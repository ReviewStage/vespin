name: Release iOS

# Builds Vespin's iOS app (apps/mobile) and uploads it to App Store Connect,
# where TestFlight picks it up. It runs on an ios-v<version> tag, whose version
# must match app.config.ts's, and on a manual dispatch, which uploads the same
# way: a TestFlight build is a rehearsal of its own, since nothing reaches a
# tester until it is added to a group.
#
# Expo generates the native project and Xcode archives it signed to run
# locally: an ad-hoc signature, which needs no certificate, profile, or account,
# but under which Xcode still writes each target's entitlements into its
# signature, and the export reads them from there. The export then signs the
# app and its two extensions for the App Store through Apple's cloud-managed
# distribution certificate, under an App Store Connect API key of its own,
# apart from the one the Mac release notarizes with, and uploads it to App
# Store Connect. Note that the archive never signs automatically, because a
# runner's keychain starts empty, so automatic signing would create a new
# Apple Development certificate on every run until the team reaches Apple's
# cap; and it is never unsigned, because an unsigned archive carries no
# entitlements, so the export would drop aps-environment. The build number is
# the run's, so every upload is one TestFlight has not seen.
#
# The app reports crashes to the desktop's Sentry project, under the same DSN
# (SENTRY_DSN), and its symbols go there through sentry-cli
# (SENTRY_AUTH_TOKEN): the archive uploads its Hermes source maps in the
# bundle phase Sentry's Expo config plugin wraps, and the job uploads the
# archive's dSYMs once Xcode has written them all, printing what sentry-cli
# answered for both. Note that the plugin's own dSYM phase is turned off
# (SENTRY_DISABLE_XCODE_DEBUG_UPLOAD), because it runs inside the app target
# before Xcode generates Vespin.app.dSYM, so it waits and uploads without it.
# A refused upload warns and the build goes on (SENTRY_ALLOW_FAILURE), so
# Sentry being down never holds a TestFlight build back; its reports read
# unsymbolicated until symbols are uploaded by hand.

on:
  push:
    tags:
      - "ios-v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Whether the signing secrets and the team exist, asked in a step because a
  # job-level `if` cannot read the `secrets` context. The expression compares
  # to empty and never prints a secret.
  gate:
    name: Check for signing secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      signable: ${{ steps.check.outputs.signable }}
    steps:
      - id: check
        env:
          SIGNABLE: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 != '' && secrets.APP_STORE_CONNECT_KEY_ID != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != '' && vars.APPLE_TEAM_ID != '' }}
        run: echo "signable=$SIGNABLE" >> "$GITHUB_OUTPUT"

  testflight:
    name: Archive and upload to TestFlight
    # A tag push without the secrets skips this job cleanly; a manual dispatch
    # runs it regardless, so it fails loudly at the check below.
    needs: gate
    if: ${{ github.event_name == 'workflow_dispatch' || needs.gate.outputs.signable == 'true' }}
    # GitHub's Xcode 27 image, as ci.yml's iOS job uses: macos-26 has no Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      EXPO_NO_TELEMETRY: "1"
      LANG: en_US.UTF-8
      VESPIN_IOS_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "27.1"

      - name: Check release secrets
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          for secret_name in \
            APP_STORE_CONNECT_KEY_P8_BASE64 \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            SENTRY_AUTH_TOKEN \
            SENTRY_DSN; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "error: required GitHub Actions secret is missing: $secret_name" >&2
              exit 1
            fi
          done
          if [[ -z "$APPLE_TEAM_ID" ]]; then
            echo "error: required GitHub Actions variable is missing: APPLE_TEAM_ID" >&2
            exit 1
          fi

      - uses: ./.github/actions/setup

      - name: Resolve release version
        working-directory: apps/mobile
        run: |
          config=$(pnpm exec expo config --type public --json)
          VERSION=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).version)' "$config")
          BUILD_NUMBER=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).ios.buildNumber)' "$config")
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF" != "refs/tags/ios-v$VERSION" ]]; then
            echo "error: tag $GITHUB_REF does not match the app's version ios-v$VERSION" >&2
            exit 1
          fi
          if [[ "$BUILD_NUMBER" != "$VESPIN_IOS_BUILD_NUMBER" ]]; then
            echo "error: app.config.ts names build $BUILD_NUMBER, not the run's $VESPIN_IOS_BUILD_NUMBER" >&2
            exit 1
          fi
          echo "Vespin $VERSION ($BUILD_NUMBER)"

      # The token's presence is what turns Sentry's upload phases on (app.config.ts).
      - name: Generate the native project
        working-directory: apps/mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: pnpm exec expo prebuild --platform ios --clean

      - name: Archive, export, and upload
        working-directory: apps/mobile
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          SENTRY_ALLOW_FAILURE: "true"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DISABLE_XCODE_DEBUG_UPLOAD: "true"
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -o pipefail
          key_directory=$(mktemp -d "$RUNNER_TEMP/vespin-asc.XXXXXX")
          trap 'rm -rf "$key_directory"' EXIT
          key_path="$key_directory/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          printf '%s' "$APP_STORE_CONNECT_KEY_P8_BASE64" | /usr/bin/base64 -D > "$key_path"
          chmod 600 "$key_path"
          archive_path="$RUNNER_TEMP/Vespin.xcarchive"
          archive_log="$key_directory/archive.log"
          export_path="$key_directory/export"
          authentication=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$key_path"
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          )

          # Signed to run locally, with no key, so the archive cannot reach
          # the account to create a certificate or a profile. Base
          # entitlements are left out, since they would add a development
          # get-task-allow the distribution profile refuses.
          xcodebuild \
            -workspace ios/Vespin.xcworkspace \
            -scheme Vespin \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            PROVISIONING_PROFILE_SPECIFIER= \
            archive | tee "$archive_log" | xcbeautify

          # What sentry-cli answered for the source maps, which xcbeautify
          # drops from the archive's output.
          echo "--- Sentry source maps"
          if ! grep -E "^(output|warning|error): sentry-cli - " "$archive_log"; then
            echo "::warning::sentry-cli printed nothing in the archive, so its source maps may not have reached Sentry"
          fi

          # The dSYMs, from the finished archive through the sentry-cli
          # Sentry's package ships, under the org and project the plugin
          # wrote into ios/sentry.properties.
          echo "--- Sentry dSYMs"
          sentry_cli_package=$(node --print "require('path').dirname(require.resolve('@sentry/cli/package.json', { paths: [require.resolve('@sentry/react-native/package.json')] }))")
          if ! SENTRY_PROPERTIES=ios/sentry.properties node "$sentry_cli_package/bin/sentry-cli" debug-files upload "$archive_path/dSYMs"; then
            echo "::warning::sentry-cli could not upload the archive's dSYMs, so this build's native crashes read unsymbolicated"
          fi

          entitlements=$(codesign -d --entitlements - --xml "$archive_path/Products/Applications/Vespin.app" 2>/dev/null)
          if ! grep -q "aps-environment" <<< "$entitlements"; then
            echo "error: the archived app carries no aps-environment entitlement" >&2
            exit 1
          fi

          # Exported once to a local .ipa, so the app the export signed is
          # checked before anything uploads: the app must carry
          # aps-environment production, and no bundle may be signed for
          # development. The upload below exports the same archive under the
          # same profiles.
          export_options="$key_directory/ExportOptions.plist"
          cp release/ExportOptions.plist "$export_options"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$export_options"
          local_options="$key_directory/ExportOptions-local.plist"
          cp "$export_options" "$local_options"
          plutil -replace destination -string export "$local_options"
          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportOptionsPlist "$local_options" \
            -exportPath "$export_path" \
            "${authentication[@]}" | xcbeautify

          payload="$key_directory/payload"
          ditto -x -k "$export_path/Vespin.ipa" "$payload"
          app="$payload/Payload/Vespin.app"
          # Note that a read codesign refuses fails the run rather than
          # reading as empty, because the widget extension legitimately
          # carries no entitlements, so an empty answer proves nothing.
          for bundle in "$app" "$app/PlugIns/NotificationService.appex" "$app/PlugIns/AgentsLiveActivity.appex"; do
            bundle_name=$(basename "$bundle")
            echo "--- $bundle_name"
            if ! signature=$(codesign -dvv "$bundle" 2>&1); then
              echo "error: cannot read the exported $bundle_name's signature" >&2
              exit 1
            fi
            if ! grep -q "^Authority=Apple Distribution: " <<< "$signature"; then
              echo "error: the exported $bundle_name is not signed with an Apple Distribution certificate" >&2
              exit 1
            fi
            grep -E "^(Identifier|Authority|TeamIdentifier)=" <<< "$signature"
            if ! bundle_entitlements=$(codesign -d --entitlements - --xml "$bundle" 2>/dev/null); then
              echo "error: cannot read the exported $bundle_name's entitlements" >&2
              exit 1
            fi
            if [[ -n "$bundle_entitlements" ]]; then
              plutil -p - <<< "$bundle_entitlements"
            fi
            if [[ "$(plutil -extract get-task-allow raw -o - - <<< "$bundle_entitlements" 2>/dev/null)" == "true" ]]; then
              echo "error: the exported $bundle_name is signed for development" >&2
              exit 1
            fi
          done
          aps_environment=$(codesign -d --entitlements - --xml "$app" 2>/dev/null | plutil -extract aps-environment raw -o - - 2>/dev/null || true)
          if [[ "$aps_environment" != "production" ]]; then
            echo "error: the exported app's aps-environment is '${aps_environment:-missing}', not production" >&2
            exit 1
          fi

          rm -rf "$export_path"
          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportOptionsPlist "$export_options" \
            -exportPath "$export_path" \
            "${authentication[@]}" | xcbeautify
