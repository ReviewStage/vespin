name: Model catalog drift

# The end-to-end suite starts agents on a fake AI Gateway catalog
# (`FAKE_GATEWAY_CATALOG`, `@repo/service/testing/model-catalog-fake`), so a
# hermetic green run says nothing of whether the gateway still lists those
# models as the fake does. This reads the live, unauthenticated `/v1/models`
# nightly and fails, naming each drifted field, where the service would read
# a fake model differently from its live entry. It reaches the network, so it
# is never on the PR path.
on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  check:
    name: Hold the fake model catalog against AI Gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - run: pnpm --filter @repo/model-catalog-drift check
