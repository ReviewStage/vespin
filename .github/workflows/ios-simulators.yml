name: iOS simulators

# The iOS app built and driven on the simulators, which only a Mac can do,
# run by hand on any branch (`gh workflow run ios-simulators.yml --ref
# <branch>`) rather than on every pull request: a run takes two hours or more
# on a runner billed at ten times a Linux one, and each push restarted it, so
# it held every iOS pull request for hours. A pull request merges on the Linux
# checks, which still bundle the app with Metro (`export:ios`), and the
# TestFlight build (`release-ios.yml`) is the native build's gate; a run here
# is for the screenshots an agent or the developer asks for.
#
# Expo generates the native project from `apps/mobile/app.config.ts`, Xcode
# builds it for the simulator, and Maestro runs the flows under
# `apps/mobile/maestro/` on an iPhone, the iPhone Duo as it boots, folded,
# and an iPad for the regular-width layout the unfolded Duo shows, since no
# supported command folds or unfolds the Duo simulator. Their screenshots
# are the artifact, which `apps/mobile/AGENTS.md` says how to read. The
# image is GitHub's Xcode 27 one, whose label names the Xcode major rather
# than a macOS version, and which carries the iOS 27.1 runtime the Duo
# simulator needs; the Xcode point release is pinned below.

on:
  workflow_dispatch:
    inputs:
      simulators:
        description: The simulators to run the flows on, comma-separated, as `xcrun simctl list devices` names them
        type: string
        default: "iPhone 18 Pro,iPhone Duo,iPad Pro 11-inch (M5)"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: iOS app on the simulators
    runs-on: xcode-27
    # Note that a run on all three simulators takes over two hours (a
    # 20-minute build, then every flow in light and dark on each, a retried
    # flow adding up to 15), so a quicker look names fewer simulators.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "27.2"
      - uses: ./.github/actions/setup
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
        env:
          MAESTRO_VERSION: 2.12.1
      - name: Generate the native project and build for the simulator
        run: apps/mobile/scripts/simulator-build.sh "$RUNNER_TEMP/derived-data"
      # Note that the flows' limit sits under the job's, so a run that
      # outgrows it still uploads the screenshots it took, because a job
      # canceled at its own limit skips even an `always()` step.
      - name: Run the Maestro flows
        timeout-minutes: 200
        env:
          SIMULATORS: ${{ inputs.simulators }}
        run: |
          simulators=()
          while IFS= read -r name; do
            if [ -n "$name" ]; then simulators+=("$name"); fi
          done < <(printf '%s\n' "$SIMULATORS" | tr ',' '\n' | sed 's/^ *//; s/ *$//')
          apps/mobile/scripts/simulator-screenshots.sh \
            "$RUNNER_TEMP/derived-data/Build/Products/Release-iphonesimulator/Vespin.app" \
            "$RUNNER_TEMP/screenshots" \
            "${simulators[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: mobile-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error
