# The workspace that resolves a dependency away from the catalog above, and
# it is the compiler alone, held to TypeScript 6 because it needs the compiler
# API that the native 7 does not ship: `apps/web`, whose
# `server/api-callers.ts` walks its routes through it. `@types/node` used to be pinned here
# too, at 22.x, on the stated ground that it matched Vercel's own runtime; it
# did not, because `apps/web`'s `engines.node` says 24.x and that is what Vercel
# takes the runtime from. The pin bought no safety either, since every
# `@repo/*` package the functions import is already checked against the
# catalog's types, so the deployed graph was never held to 22.x. What it did buy
# was a second `vitest`: `@types/node` is a peer of `vitest`, so pnpm stood one
# copy up per version, `@effect/vitest` read the collector out of whichever copy
# it resolved itself, and `apps/web/vitest.config.ts` had to inline
# `@effect/vitest` to force the two back together. One `@types/node` is one
# `vitest`, and that workaround is gone with it.
catalogs:
  web:
    typescript: 6.0.3
  # The mobile app's React. React Native 0.88 is compiled against React 19.3
  # and declares `react: ^19.3.0` as its peer, while the web and desktop apps
  # stand on the default catalog's 19.2.8 with the panel and `@repo/ui`. The
  # two trees never meet in one bundle: Metro bundles the app's own React, and
  # nothing of `@repo/panel` or `@repo/ui` is drawn in it. Move the default
  # catalog to 19.3 and delete this one once the web and desktop apps take it.
  #
  # Note that `packages/service` declares the default catalog's `react` as a
  # devDependency it never imports, because pnpm resolves a peer a workspace
  # leaves undeclared to the highest version in the lockfile: once this
  # catalog put a second React there, the service's `better-auth`, whose
  # React peer is optional, resolved it to 19.3 while the web app's resolved
  # 19.2, and the two copies of `better-auth` that made did not share their
  # routes (the desktop's OAuth sign-in answered 404 under test). Declaring
  # it from the root does not reach that peer; the service's own does.
  mobile:
    react: 19.3.0
    "@types/react": 19.3.0

# Every dependency here builds nothing this repository needs: esbuild runs from
# its platform package, @sentry/cli is only reached with an auth token no check
# carries, node-pty's Mac prebuilds are copied out of its package by the
# desktop's native build (`apps/desktop/scripts/build-native.mjs`) rather than
# compiled, Sentry's CPU profiler ships a prebuilt binary for every Node the
# service runs on, and the other two are transitive Windows and polyfill packages.
# Listed so an install says so once instead of printing the approval box every
# time.
ignoredBuiltDependencies:
  - "@sentry/cli"
  - "@sentry/node-cpu-profiler"
  - core-js
  - electron-winstaller
  - esbuild
  - node-pty

# The one build this repository runs: `embedded-postgres` ships each
# platform's Postgres in a package whose install script restores the
# library symlinks its tarball cannot carry, without which the binaries
# do not load. The demo's throwaway database (`tools/demo-postgres`) runs
# them; only the package for the machine's own platform is installed.
onlyBuiltDependencies:
  - "@embedded-postgres/darwin-arm64"
  - "@embedded-postgres/darwin-x64"
  - "@embedded-postgres/linux-arm64"
  - "@embedded-postgres/linux-x64"

# The Agent SDK's native `claude` binaries, one optional package per platform
# at about 290 MB each. Nothing here runs the CLI: `@repo/agent-runner` bundles
# the SDK alone and runs the binary the agent's sandbox image installs, which
# it names in `pathToClaudeCodeExecutable`. And pdf.js's `@napi-rs/canvas`,
# a native canvas it draws with only under Node: the file viewer draws a PDF
# in the window's own canvases (`@repo/ui/pdf-pages`).
ignoredOptionalDependencies:
  - "@anthropic-ai/claude-agent-sdk-*"
  - "@napi-rs/canvas"

# `@better-auth/oauth-provider` 1.7.7 declares its `/oauth2/authorize` OpenAPI
# parameters with `items?: undefined`, which `exactOptionalPropertyTypes` (on in
# `tsconfig.base.json`) refuses against better-call's `OpenAPIParameter`, so the
# plugin stops typing as a `BetterAuthPlugin` and its endpoints fall off
# `auth.api`. The patch drops those four lines of the emitted declaration and
# nothing at runtime; delete it when an upstream release types them cleanly.
patchedDependencies:
  "@better-auth/oauth-provider@1.7.7": patches/@better-auth__oauth-provider@1.7.7.patch
#
# `drizzle-orm` 1.0.0-rc.4's Effect code is patched for three things. Its error
# classes call `Schema.TaggedErrorClass`, which Effect 4.0.4 stable names
# `Schema.TaggedError`, so the Effect drivers fail to load at all; the patch
# makes the same rename upstream's unreleased rc.5 builds make. Its Postgres
# and PGlite declarations import `SqlError` from `effect/unstable/sql/SqlError`,
# a path 4.0.4 does not have, which `skipLibCheck` turns into `any` in every
# transaction's and migration's error channel; the patch points them at
# `effect/sql/SqlError`. And its
# Postgres driver fails a statement with an `EffectDrizzleQueryError` that
# carries the statement's bound parameters and prints them in its `message`,
# and a parameter can be an account's secret (a sealed provider key, a token)
# that AGENTS.md's Never rule keeps out of every log, span, and answer; the
# patch builds that error with no parameters, keeping the statement's text and
# its cause. `apps/web/tests/drizzle-driver.test.ts` holds all three. Delete
# the patch when drizzle-orm 1.0.0-rc.5 is released and carries them.
  drizzle-orm@1.0.0-rc.4: patches/drizzle-orm@1.0.0-rc.4.patch
#
# `@sentry/browser` 11.8.0, which `@sentry/electron` 8.3.0 pins, starts the
# window's profiler in the trace lifecycle for a root span already open as its
# profiling integration sets up, the page load, without asking whether that span
# was sampled; one sampled out never ends as far as the profiler hears, so the
# window profiled for five minutes with no trace kept. The patch makes the
# check upstream's 11.11.0 makes: a root span that is not recording is passed
# over. Delete it when `@sentry/electron` moves to a browser SDK that has it.
  "@sentry/browser@11.8.0": patches/@sentry__browser@11.8.0.patch
#
# `react-native-screens` 4.30.1 loops over a native-stack header's live
# subviews in `updateHeaderStateInShadowTreeInContextOfNavigationBar:` while
# each subview's shadow state update commits and mounts synchronously, so a
# header item mounted or unmounted mid-loop throws "Collection was mutated
# while being enumerated" and the app aborts. Turning an iPhone to landscape
# and back on the Tasks list or the Inbox did it on TestFlight 20, whose bar
# held two resizing leading items and a title view. The patch loops over a
# copy, as upstream's react-native-screens#4851 does. Delete it when a
# react-native-screens release carries #4851.
  react-native-screens@4.30.1: patches/react-native-screens@4.30.1.patch
#
# `@tiptap/extension-list` 3.33.1 strips an ordered list item's continuation
# lines by the marker's width less its `.` or `)`, so each line of a code
# block in a numbered item opens with a stray space, one more on every save,
# and a code block after a second paragraph in the item is dropped. The patch
# makes upstream's one-line change in ueberdosis/tiptap#8405 (#8404): strip the
# width the item's first line actually gives its words. Delete it when a
# TipTap release carries #8405.
  "@tiptap/extension-list@3.33.1": patches/@tiptap__extension-list@3.33.1.patch
#
# `@tiptap/markdown` 3.33.1 writes two code spans that touch as one span where
# another mark changes between them, so an edited line holding inline code
# right against bold inline code saved one span with the bold's asterisks
# inside it. The patch makes the serializer half of upstream's
# ueberdosis/tiptap#8662 (#8637): a code span is written innermost, closed
# where another mark opens or closes while it goes on, and opened again
# after. Delete it when a TipTap release carries #8662.
  "@tiptap/markdown@3.33.1": patches/@tiptap__markdown@3.33.1.patch

# Transitive versions raised past a published advisory, each within the major
# its dependents already take. Delete a line once nothing resolves below it.
overrides:
  # GHSA-cg2g-xh64-v4q7 and GHSA-mrv2-3pqr-j5jr, through `posthog-js` and `mermaid`
  "dompurify@>=3.0.0 <3.4.17": 3.4.17
  # GHSA-2m5v-pch6-74hx, GHSA-4w7w-5xrc-9h26 and other undici advisories, through the AI SDK and `@vercel/sandbox`
  "undici@>=7.0.0 <7.30.1": 7.30.2
  # The same undici advisories on 8.x, through `eve` and `jsdom`
  "undici@>=8.0.0 <8.12.2": 8.12.4
  # GHSA-27r3-jxmh-p828, through `@modelcontextprotocol/sdk`'s `express`
  "body-parser@>=2.0.0 <2.4.0": 2.4.0
  # GHSA-mrhx-c7xc-m3w5, through `@vercel/cli-config`
  "zod@>=4.0.0 <4.6.6": 4.6.7
  # GHSA-68fv-2mgg-jv7q, through `@tailwindcss/node`, `postcss` and `jsdom`
  "source-map-js@>=1.0.0 <1.2.2": 1.2.2
  # GHSA-r4xh-jqrq-34v2, through `knip`
  "smol-toml@<1.9.0": 1.9.1
  # GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7 and GHSA-q2hr-2g5m-vwhr, through `@sentry/esbuild-plugin`'s `glob`
  "brace-expansion@>=5.0.0 <5.0.12": 5.0.13
  # The same brace-expansion advisories on 1.x and 2.x, through electron-builder's `minimatch`
  "brace-expansion@>=1.0.0 <1.1.22": 1.1.22
  "brace-expansion@>=2.0.0 <2.1.8": 2.1.8
  # GHSA-27p8-2357-5qqv, GHSA-c7q8-3ch8-vqpv and other @xmldom/xmldom advisories, through electron-builder's `plist`; Expo's `@expo/plist` keeps its own
  "plist>@xmldom/xmldom@<0.8.15": 0.8.15
  # The same advisories on 0.9, through `@electron/osx-sign` and `@electron/universal`'s `plist`, which Expo's `simple-plist` shares
  "@xmldom/xmldom@>=0.9.0 <0.9.12": 0.9.12
  # GHSA-2883-xcg3-v3hh, through electron-builder and electron-updater; Expo's `@expo/xcpretty` keeps its own
  "app-builder-lib>js-yaml": 4.3.2
  "builder-util>js-yaml": 4.3.2
  "dmg-builder>js-yaml": 4.3.2
  "electron-updater>js-yaml": 4.3.2
  # GHSA-2m5v-pch6-74hx and the other undici advisories on 6.x, through `@electron/rebuild`'s `node-gyp`; `@sentry/cli` keeps its own
  "node-gyp>undici": 6.29.1

# A dependency is keyed by its peers' names alone, not by the peers' own peer
# graphs, so one `vitest` serves every workspace. Keyed in full, a peer's own
# optional peers can split `vitest` in two, and `@effect/vitest` then reads
# its collector out of the other copy, as the old `@types/node` pin once did.
dedupePeers: true
