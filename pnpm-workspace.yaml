# The workspace that resolves a dependency away from the catalog above, and
# it is the compiler alone, held to TypeScript 6 because it needs the compiler
# API that the native 7 does not ship: `apps/web`, whose
# `server/api-callers.ts` walks its routes through it. `@types/node` used to be pinned here
# too, at 22.x, on the stated ground that it matched Vercel's own runtime; it
# did not, because `apps/web`'s `engines.node` says 24.x and that is what Vercel
# takes the runtime from. The pin bought no safety either, since every
# `@repo/*` package the functions import is already checked against the
# catalog's types, so the deployed graph was never held to 22.x. What it did buy
# was a second `vitest`: `@types/node` is a peer of `vitest`, so pnpm stood one
# copy up per version, `@effect/vitest` read the collector out of whichever copy
# it resolved itself, and `apps/web/vitest.config.ts` had to inline
# `@effect/vitest` to force the two back together. One `@types/node` is one
# `vitest`, and that workaround is gone with it.
catalogs:
  web:
    typescript: 6.0.3
  # The mobile app's React. React Native 0.88 is compiled against React 19.3
  # and declares `react: ^19.3.0` as its peer, while the web and desktop apps
  # stand on the default catalog's 19.2.8 with the panel and `@repo/ui`. The
  # two trees never meet in one bundle: Metro bundles the app's own React, and
  # nothing of `@repo/panel` or `@repo/ui` is drawn in it. Move the default
  # catalog to 19.3 and delete this one once the web and desktop apps take it.
  #
  # Note that `packages/service` declares the default catalog's `react` as a
  # devDependency it never imports, because pnpm resolves a peer a workspace
  # leaves undeclared to the highest version in the lockfile: once this
  # catalog put a second React there, the service's `better-auth`, whose
  # React peer is optional, resolved it to 19.3 while the web app's resolved
  # 19.2, and the two copies of `better-auth` that made did not share their
  # routes (the desktop's OAuth sign-in answered 404 under test). Declaring
  # it from the root does not reach that peer; the service's own does.
  mobile:
    react: 19.3.0
    "@types/react": 19.3.0
    # The iPhone's SQLite, which the account's local database opens on
    # (`apps/mobile/src/host/expo-sqlite-driver.ts`), at the patch line Expo
    # SDK 58 pins (`expo/bundledNativeModules.json`).
    expo-sqlite: 58.0.17

# Every dependency here builds nothing this repository needs: esbuild runs from
# its platform package, @sentry/cli is only reached with an auth token no check
# carries, node-pty's Mac prebuilds are copied out of its package by the
# desktop's native build (`apps/desktop/scripts/build-native.mjs`) rather than
# compiled, Sentry's CPU profiler ships a prebuilt binary for every Node the
# service runs on, and the other two are transitive Windows and polyfill packages.
# Listed so an install says so once instead of printing the approval box every
# time.
ignoredBuiltDependencies:
  - "@sentry/cli"
  - "@sentry/node-cpu-profiler"
  - core-js
  - electron-winstaller
  - esbuild
  - node-pty

# The one build this repository runs: `embedded-postgres` ships each
# platform's Postgres in a package whose install script restores the
# library symlinks its tarball cannot carry, without which the binaries
# do not load. The demo's throwaway database (`tools/demo-postgres`) runs
# them; only the package for the machine's own platform is installed.
onlyBuiltDependencies:
  - "@embedded-postgres/darwin-arm64"
  - "@embedded-postgres/darwin-x64"
  - "@embedded-postgres/linux-arm64"
  - "@embedded-postgres/linux-x64"

# The Agent SDK's native `claude` binaries, one optional package per platform
# at about 290 MB each. Nothing here runs the CLI: `@repo/agent-runner` bundles
# the SDK alone and runs the binary the agent's sandbox image installs, which
# it names in `pathToClaudeCodeExecutable`. And pdf.js's `@napi-rs/canvas`,
# a native canvas it draws with only under Node: the file viewer draws a PDF
# in the window's own canvases (`@repo/ui/pdf-pages`).
ignoredOptionalDependencies:
  - "@anthropic-ai/claude-agent-sdk-*"
  - "@napi-rs/canvas"

# `@better-auth/oauth-provider` 1.7.7 declares its `/oauth2/authorize` OpenAPI
# parameters with `items?: undefined`, which `exactOptionalPropertyTypes` (on in
# `tsconfig.base.json`) refuses against better-call's `OpenAPIParameter`, so the
# plugin stops typing as a `BetterAuthPlugin` and its endpoints fall off
# `auth.api`. The patch drops those four lines of the emitted declaration and
# nothing at runtime; delete it when an upstream release types them cleanly.
patchedDependencies:
  "@better-auth/oauth-provider@1.7.7": patches/@better-auth__oauth-provider@1.7.7.patch
#
# `drizzle-orm` 1.0.0-rc.4's Effect code is patched for three things. Its error
# classes call `Schema.TaggedErrorClass`, which Effect 4.0.4 stable names
# `Schema.TaggedError`, so the Effect drivers fail to load at all; the patch
# makes the same rename upstream's unreleased rc.5 builds make. Its Postgres
# and PGlite declarations import `SqlError` from `effect/unstable/sql/SqlError`,
# a path 4.0.4 does not have, which `skipLibCheck` turns into `any` in every
# transaction's and migration's error channel; the patch points them at
# `effect/sql/SqlError`. And its
# Postgres driver fails a statement with an `EffectDrizzleQueryError` that
# carries the statement's bound parameters and prints them in its `message`,
# and a parameter can be an account's secret (a sealed provider key, a token)
# that AGENTS.md's Never rule keeps out of every log, span, and answer; the
# patch builds that error with no parameters, keeping the statement's text and
# its cause. `apps/web/tests/drizzle-driver.test.ts` holds all three. Delete
# the patch when drizzle-orm 1.0.0-rc.5 is released and carries them.
  drizzle-orm@1.0.0-rc.4: patches/drizzle-orm@1.0.0-rc.4.patch
#
# `@sentry/browser` 11.8.0, which `@sentry/electron` 8.3.0 pins, starts the
# window's profiler in the trace lifecycle for a root span already open as its
# profiling integration sets up, the page load, without asking whether that span
# was sampled; one sampled out never ends as far as the profiler hears, so the
# window profiled for five minutes with no trace kept. The patch makes the
# check upstream's 11.11.0 makes: a root span that is not recording is passed
# over. Delete it when `@sentry/electron` moves to a browser SDK that has it.
  "@sentry/browser@11.8.0": patches/@sentry__browser@11.8.0.patch
#
# `@tanstack/db` 1.0.0-rc.1.5 walks every `fn.select` result's whole object
# graph for a value it can't hold (`validateFnSelectResult`) on every row a
# live query draws, in production too, where every other check of its kind
# runs in a development build alone. An iOS launch draws the task list's
# thousands of plans and agents through such selects, and the walk was about
# a tenth of the host's launch. The patch runs it where `devBuild()` says, so
# tests and development builds still refuse such a select. Delete it when a
# release checks it in development alone.
  "@tanstack/db@1.0.0-rc.1.5": patches/@tanstack__db@1.0.0-rc.1.5.patch
#
# `@formatjs/intl-datetimeformat` 8.0.3 unpacks every IANA zone the moment its
# data is added (`__addTZData`), each zone's every transition into arrays,
# though a reader reads its own zone and few others: the iOS app adds all of
# them as Hermes starts (`apps/mobile/src/host/polyfills.ts`), since the
# reader's zone is known only on the device, and the unpacking was about
# 80 ms of every launch with V8's JIT off, on the path to the first frame.
# The patch unpacks each zone as it is first read, the data an object of
# enumerable getters, so a lookup by name and `Object.keys` read it as
# before. It patches the three builds that carry `unpack` (`index.js`,
# `polyfill.js`, `polyfill-force.js`). Delete it when a release unpacks
# zones lazily.
  "@formatjs/intl-datetimeformat@8.0.3": patches/@formatjs__intl-datetimeformat@8.0.3.patch
#
# `expo-notifications` 58.1.8's `getPermissionsAsync` runs on Expo's one shared
# async queue (`expo.modules.AsyncFunctionQueue`, which every module's
# synchronous `AsyncFunction` runs on) and blocks it on a semaphore until
# usernotificationsd answers `getNotificationSettings`. On a cold-booted
# simulator that answer never came, so every other module's async call queued
# behind it for good, the iOS app's cached recording writes among them, and
# the agent page's recording never played. The patch runs the module's two
# permission calls on a serial queue of their own, so a late answer holds the
# permission read alone. Delete it when a release stops blocking the shared
# queue there.
  expo-notifications@58.1.8: patches/expo-notifications@58.1.8.patch
#
# `expo-quick-actions` 6.0.2 takes a cold launch's quick action only from
# `launchOptions` in `didFinishLaunching`, but under the scene life cycle
# Expo 58's scene delegate forwards it to `performActionFor`, where the
# library only posts an event JavaScript isn't listening for yet, so a Home
# Screen quick action that woke the app was dropped. The patch also keeps
# that first item as `QuickActions.initial`, which `useQuickActionRouting`
# reads once the tabs mount. Delete it when a release reads a scene's
# launch item.
  expo-quick-actions@6.0.2: patches/expo-quick-actions@6.0.2.patch
#
# `expo-symbols` 58.0.4's `SymbolView` reads its name as an SF Symbol alone
# (`UIImage(systemName:)`), so a custom symbol the app's asset catalog holds,
# such as the Lucide glyphs `@repo/ui-native` draws, stays blank. The patch
# falls back to the catalog (`UIImage(named:)`), as react-native-screens'
# `RNSImageLoadingHelper` does for a tab's icon. Delete it when an
# `expo-symbols` release loads a symbol set by name.
  expo-symbols@58.0.4: patches/expo-symbols@58.0.4.patch
#
# `react-native-screens` 4.30.1 loops over a native-stack header's live
# subviews in `updateHeaderStateInShadowTreeInContextOfNavigationBar:` while
# each subview's shadow state update commits and mounts synchronously, so a
# header item mounted or unmounted mid-loop throws "Collection was mutated
# while being enumerated" and the app aborts. Turning an iPhone to landscape
# and back on the Tasks list or the Inbox did it on TestFlight 20, whose bar
# held two resizing leading items and a title view. The patch loops over a
# copy, as upstream's react-native-screens#4851 does. And a header button's
# or a menu item's icon is read as an SF Symbol alone (`systemImageNamed:`),
# so the Lucide glyphs `@repo/ui-native` draws stood blank in a bar; the patch
# falls back to the app's asset catalog (`imageNamed:`), as its own tab icons
# already do. Delete the first when a react-native-screens release carries
# #4851, and the second when one reads a bar item's symbol from the catalog.
  react-native-screens@4.30.1: patches/react-native-screens@4.30.1.patch
#
# `@expo/ui` 58.0.27's `Image` colors a symbol only through a `foregroundStyle`
# modifier, which a system menu drops, drawing every item's icon as a template
# in the menu's ink; so the Status menu's marks lost the status tones the
# panel's menu draws them in. The patch adds `originalColor`, which tints the
# symbol's own image (`withTintColor`, rendering kept original), as Mail's Flag
# menu hands its colored flags to the menu; and `photoSize`, which draws a `file://`
# `uiImage` round at a menu glyph's size with its rendering kept original, so
# the Assignee menu leads each member with their face; and `emoji` with
# `emojiSize`, which draws an emoji into a square image at a menu glyph's
# size, its rendering kept original, so Move to leads an emoji section with
# its emoji in the glyph's place and its name lines up; `underAssetName`
# with `underOpacity`, which draws a second catalog symbol faint under the
# tinted one in the same image, so a priority's lit bars stand over its unlit
# ones in a menu; `photoCorner`, which rounds a photo's square instead, as a
# repository's owner picture stands; and `assetSize`, which draws a catalog
# image fit in a menu glyph's square, its rendering kept original, so a
# model's harness mark leads its name at a glyph's width rather than its own
# size. And it lets `ContentUnavailableView` draw a symbol of the
# app's asset catalog (`image`) in `systemImage`'s place, leave out an empty
# description, and take its primary and secondary inks (`primaryColor`,
# `secondaryColor`), so an empty state wears the panel's glyph and words'
# colors rather than the system's grays. And it hands
# a `List` its edit mode as a binding (`editing`, `onEditingChange`), so a
# two-finger drag down a list can switch Select mode on. And it gives a
# `ToolbarItem` a `spacerBefore`, which stands the item after a `Spacer` in
# one `ToolbarItemGroup`, since iOS 26 centers a keyboard bar's lone item,
# such as a number pad's Done, which neither a `Spacer` inside the item nor
# a `ToolbarSpacer` moves to the trailing edge. It patches `build/`, which
# Metro and TypeScript read, and the Swift under `ios/`, never `src/`; a modifier alone goes in the
# app's own `modules/native-interactions` instead, as `sideMargins` does.
# 58.0.29 changes none of the files it patches. Delete it when an `@expo/ui`
# release offers a tinted image, a layered one, a photo and an emoji a menu
# keeps, a catalog image and inks on an empty state, a list's edit mode as a
# binding, and a toolbar spacer.
  "@expo/ui@58.0.27": patches/@expo__ui@58.0.27.patch
#
# `@tiptap/extension-list` 3.33.1 strips an ordered list item's continuation
# lines by the marker's width less its `.` or `)`, so each line of a code
# block in a numbered item opens with a stray space, one more on every save,
# and a code block after a second paragraph in the item is dropped. The patch
# makes upstream's one-line change in ueberdosis/tiptap#8405 (#8404): strip the
# width the item's first line actually gives its words. Delete it when a
# TipTap release carries #8405.
  "@tiptap/extension-list@3.33.1": patches/@tiptap__extension-list@3.33.1.patch
#
# `@tiptap/markdown` 3.33.1 is patched for two things. It writes two code spans
# that touch as one span where another mark changes between them, so an edited
# line holding inline code right against bold inline code saved one span with
# the bold's asterisks inside it; the patch makes the serializer half of
# upstream's ueberdosis/tiptap#8662 (#8637): a code span is written innermost,
# closed where another mark opens or closes while it goes on, and opened again
# after. And its `MarkdownManager` registers its extensions' tokenizers on the
# global `marked` for good, so every editor opened adds about six more and
# parsing a description slows with each one (ueberdosis/tiptap#8316): a
# 20-section description took ~16 ms to open in a fresh window and ~300 ms
# after 400 editors had opened; the patch makes upstream's one-line change in
# ueberdosis/tiptap#8317, each manager lexing with a `marked` of its own.
# Delete each half when a TipTap release carries its PR.
  "@tiptap/markdown@3.33.1": patches/@tiptap__markdown@3.33.1.patch
#
# `@xterm/addon-webgl` 0.19.0 builds each glyph's canvas font as
# `${style} ${weight} …`, which starts with a space for upright text. Chromium's
# font parser briefly refused a font with leading whitespace (crrev.com/c/8525429,
# fixed by crrev.com/c/8573817), and Electron 43.8.8 shipped the first change
# without the second, so the canvas kept its `10px sans-serif` default and the
# desktop's terminal drew tiny letters spread across full-size cells. The patch
# makes upstream's change in xtermjs/xterm.js#6312 (#6297): the space goes with
# the optional style. Only `lib/addon-webgl.mjs` is patched, the build the
# browser bundles resolve. Delete it when an addon release carries #6312.
  "@xterm/addon-webgl@0.19.0": patches/@xterm__addon-webgl@0.19.0.patch

