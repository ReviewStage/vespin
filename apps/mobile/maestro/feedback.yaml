# feedback.yaml -- Settings' Send feedback on the Inbox fixture: the form under its Feedback and Prompt control, a note typed, signed by the fixture's account, and sent, thanked on the page, then Back to Settings.
#
# Launched on the host's Inbox fixture, signed in as Ada Lovelace, whose
# act door answers a send as delivered (`@repo/host/fixture-inbox`), so no
# note reaches the feedback service.
appId: dev.vespin.ios
---
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
# Note that the Inbox is waited for, since a loaded runner's cold launch has
# drawn it after Maestro's own few seconds.
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- runFlow:
    file: subflows/switcher.yaml
- tapOn: "Settings(, .*)?"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Send feedback"
- tapOn: "Send feedback"
- waitForAnimationToEnd
- assertVisible: "Include my name and email"
- assertVisible: "Ada Lovelace.*"
- takeScreenshot: feedback-empty
- tapOn:
    id: "feedback-words"
- inputText: "The Inbox count lags a moment after a thread settles."
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: feedback-written
# Prompt keeps its own words, so the field stands empty under its own hint.
- tapOn: "Prompt"
- assertNotVisible: "The Inbox count lags.*"
- takeScreenshot: feedback-prompt
- tapOn: "Feedback"
- tapOn: "Send"
- waitForAnimationToEnd
# The page stays and thanks the reader under the cleared field, since the
# app's notice stands under the Settings sheet; Back then leaves without asking.
- assertVisible: "Feedback sent. Thank you."
- takeScreenshot: feedback-sent
- tapOn:
    id: "BackButton"
- waitForAnimationToEnd
# Settings' list stands again, Email us beside Send feedback in its last group.
# Note that the list is scrolled to it, because a short window, the iPhone
# Duo's, stands that group below its fold.
- scrollUntilVisible:
    element: "Email us"
    direction: DOWN
