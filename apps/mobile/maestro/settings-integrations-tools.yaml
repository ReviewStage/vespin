# settings-integrations-tools.yaml -- Settings › Integrations reading each connected server's tools on the Inbox fixture: a server whose tools answered stands quiet under Connected, one whose read couldn't be answered says so, its page offering Try again, and an account at a provider holding two is renamed from its page.
#
# Launched on the host's Inbox fixture, whose Linear and Relay Notion list
# their tools and whose Personal Notion's read failed, and whose rename is
# answered as the service would (`@repo/host/fixture-inbox`), so no server
# is reached.
appId: dev.vespin.ios
---
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- runFlow:
    file: subflows/switcher.yaml
- tapOn: "Settings(, .*)?"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Integrations"
- tapOn: "Integrations"
- waitForAnimationToEnd
- assertVisible: "The tools could not be read."
- takeScreenshot: settings-integrations-tools
# The Personal Notion's page offers Try again first, then Rename, which asks for the label in the system's alert.
- tapOn: "Notion · Personal"
- waitForAnimationToEnd
- assertVisible: "Try again"
- tapOn: "Rename"
- assertVisible: "Rename Notion account"
- takeScreenshot: settings-integrations-rename
- tapOn: "Cancel"
