# inbox.yaml -- the Inbox's list, the workspace's button in its bar, its ⋯ menu with its scopes, its search, a row's swipes and its long press preview, a thread with a picture opened full screen, a video in the system's player, and a PDF's chip opening its viewer, Remind me from its ⋯ menu, and Remind me putting a thread away under Reminders.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
# Launched on the host's Inbox fixture, as `skeleton.yaml` is, so the list
# holds the fixture's threads and no server is reached; the fixture answers
# each mark and each thread's file read (`@repo/host/fixture-inbox`).
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
# The workspace's one button leads the bar, its menu holding the account and
# Settings (`workspace.yaml`).
- assertVisible:
    id: "workspace-switcher"
- waitForAnimationToEnd
- takeScreenshot: inbox-list
# The ⋯ menu: the scopes, Open checked, then Mark all as read. A tap off the
# menu closes it.
- tapOn: "More"
- assertVisible: "Mark all as read"
- assertVisible: "Questions.*"
- takeScreenshot: inbox-more
- runFlow:
    file: subflows/dismiss.yaml
# The thread comes first, before the row's swipes and its long press: a row
# a swipe opened takes the next tap to close its actions, and its files, the
# PDF among them, are shot whatever the press below does.
# Note that the thread is opened before anything scrolls the list, so its
# row stands where the list opened, below the large title and clear of the
# bar, as a tap by hand opens it; brought back up after the scopes' pass,
# now below, the row stood under the bar or took the flow's tap without
# opening, though a tap by hand on the same row at the same place opened it.
# A thread opens named in a compact window's bar, as Messages names a
# conversation, and under its path and title in a split view's detail, as
# Mail's message stands; then each message: the agent's tile, name and time
# over its words, its picture drawn where the words name it, and its recording
# after the message that sent it, played in place from its MP4 copy.
- tapOn: "Recorded the invite flow"
- assertVisible: ".*walked the invite flow.*"
- waitForAnimationToEnd
- takeScreenshot: inbox-thread
# The picture opens full screen in the app's viewer, grown out of its
# thumbnail, whose close button closes it.
- tapOn: "The invite page"
- assertVisible:
    id: "picture-viewer-close"
- waitForAnimationToEnd
- takeScreenshot: inbox-picture
- tapOn:
    id: "picture-viewer-close"
- scrollUntilVisible:
    element: "invite-flow.webm.*"
    direction: DOWN
- waitForAnimationToEnd
# The recording is read as its MP4 copy, which iOS's player plays in place:
# the flow waits for the player to report it can play the file, so a read
# that never lands, or a file it cannot play, fails here rather than leaving a
# well with its spinner in the screenshot.
- extendedWaitUntil:
    visible:
      id: "video-player"
    timeout: 15000
- assertNotVisible: ".*can't play here.*"
# Until it is first played, the video stands its play mark and its length
# over its first frame, as Messages marks one, so it never reads as a
# picture; a press plays it in place and leaves the system's controls to it.
- assertVisible: "invite-flow.*, \\d+:\\d\\d"
- takeScreenshot: inbox-video
- tapOn: "invite-flow.*, \\d+:\\d\\d"
# Note that the flow waits on the mark leaving rather than on the screen to
# settle, since a playing video never settles.
- extendedWaitUntil:
    notVisible: "invite-flow.*, \\d+:\\d\\d"
    timeout: 5000
- takeScreenshot: inbox-video-playing
# A file that is neither a picture nor a video, the test plan's PDF, stands
# after its message as its chip, its name over its kind and size once read; a
# press opens it full screen, its pages drawn in a web view under a bar with
# Done and Share. Note that the chip is scrolled to above the reply box,
# since the thread's last message first shows under it and the tab bar, where
# a tap lands on them instead, and stands at the list's end, which no scroll
# can center.
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: "invite-test-plan.pdf, PDF.*"
      ABOVE: composer-field
- takeScreenshot: inbox-file
- tapOn: "invite-test-plan.pdf, PDF.*"
# The PDF opens in the system's Quick Look, titled with its name, and its
# close button closes it. Note that the button is found by Quick Look's own
# id, since it reads "Done" on an iPhone and "close" on an iPad, and that an
# iPad's Quick Look hides its bar a moment after it opens, so a tap on the
# page brings the bar back first where the button no longer stands. The page
# is found by Quick Look's own id for its view, since PDFKit hands none of
# the PDF's words to the accessibility tree.
- extendedWaitUntil:
    visible:
      id: "QLOverlayDoneButtonAccessibilityIdentifier"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: inbox-pdf
- runFlow:
    when:
      notVisible:
        id: "QLOverlayDoneButtonAccessibilityIdentifier"
    commands:
      - tapOn:
          id: "QLPreviewControllerView"
      - extendedWaitUntil:
          visible:
            id: "QLOverlayDoneButtonAccessibilityIdentifier"
          timeout: 5000
- tapOn:
    id: "QLOverlayDoneButtonAccessibilityIdentifier"
- waitForAnimationToEnd
- assertNotVisible:
    id: "QLOverlayDoneButtonAccessibilityIdentifier"
# Remind me's times stand in a menu: a compact window's ⋯ holds it as a
# submenu, and a regular window's detail bar stands it as its own clock
# (`bar-act.yaml`). Each time says when it comes due, and Pick a date and
# time… stands last. A tap off the menu closes it unchanged, so the row's
# Remind me below still finds the thread under Open.
- runFlow:
    file: subflows/bar-act.yaml
    env:
      ACT: Remind me
- tapOn: "Remind me"
- assertVisible: "Pick a date and time…"
- waitForAnimationToEnd
- takeScreenshot: inbox-thread-remind
# Note that the menu is put away by a tap off it at a point, through the
# flows' own `dismiss.yaml`, as keep.yaml puts its menus away, because iOS
# takes everything under an open menu out of the accessibility tree, so no
# named control exists to tap. The point is the window's trailing margin
# beside the thread's files, where nothing presses even with no menu
# standing, and the flow then asserts the menu gone and the thread as it
# stood, its PDF's chip still there, so a tap that ever lands on something
# fails here.
- runFlow:
    file: subflows/dismiss.yaml
    env:
      POINT: "94%, 60%"
- assertNotVisible: "Pick a date and time…"
- assertVisible: "invite-test-plan.pdf, PDF.*"
# Back on the list, from the thread.
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Inbox
# A swipe from the leading edge reveals Mark as read or unread, which a full
# swipe would press at once, so the flow swipes partway across "Recorded the
# invite flow", the second row, which a compact window stands at about a
# quarter of its height whatever the list holds below it, and presses it; a
# long press offers the same in the row's menu. A swipe from the trailing
# edge reveals Resolve, which a full swipe would press at once, and Remind
# me, so the flow swipes partway back across the same row, and a tap on the
# row's own line, across from its actions, closes it unpressed.
# Note that each swipe is closed before anything else is pressed, because a
# row left open takes the next press on the list, the long press below among
# them, only to close itself; that a tap off the list, on the bar's title,
# leaves it open; and that an iPad, whose floating tabs `FLOATING_TABS`
# names, is left out, since its list is a column a third of the window wide,
# which the swipes' points, set across a compact window, miss. The trailing
# swipe starts a fifth of the window in from its edge, since a wide
# window, the iPhone Duo's, stands its tabs as a rail along that edge.
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - swipe:
          start: "8%, 27%"
          end: "38%, 27%"
          duration: 900
      - waitForAnimationToEnd
      - takeScreenshot: inbox-swipe
      - tapOn: "Mark as .*"
      - waitForAnimationToEnd
      - swipe:
          start: "80%, 27%"
          end: "48%, 27%"
          duration: 900
      - waitForAnimationToEnd
      - assertVisible: "Resolve"
      - takeScreenshot: inbox-swipe-trailing
      # Note that the tap is on the row itself, its words drawn across from
      # its actions, and that the flow then asserts the actions gone and the
      # list still standing, no thread opened, so a tap that ever presses the
      # row fails here.
      - tapOn: "Recorded the invite flow"
      - waitForAnimationToEnd
      - assertNotVisible: "Resolve"
      - assertVisible: "Recorded the invite flow"
      - assertNotVisible:
          id: "composer-field"
# A long press lifts the thread's preview, its newest messages under its
# task and title, over the row's menu, which leads with Open, since a tap on
# the preview only closes it.
- runFlow:
    file: subflows/row-menu.yaml
    env:
      ROW: acceptInvite can add a member twice
      ITEM: Open
- assertVisible: "Mark as read"
- takeScreenshot: inbox-preview
- tapOn: "Mark as read"
# Note that the list is scrolled back to its first row, rather than to the
# first point this row shows, because the folded Duo then stands it against the
# top edge, where a tap a point or two higher no longer opens it. Neither row
# can be scrolled to the middle, since a list at its top scrolls no further,
# and a window that shows the row already scrolls not at all.
- runFlow:
    when:
      notVisible: "Recorded the invite flow"
    commands:
      - scrollUntilVisible:
          element: "Who can withdraw an invite\\?"
          direction: UP
# Remind me, which a row's trailing swipe and its long press both open, offers
# the panel's times in a submenu, Tomorrow and Next week saying when; In 1 hour puts
# the thread away, out of Open and under Reminders, its time in the row's
# time's place. The long press is used, since a regular window's sidebar
# stands its rows elsewhere. Open is chosen again for the search below.
- runFlow:
    file: subflows/row-menu.yaml
    env:
      ROW: Recorded the invite flow
      ITEM: Remind me
- tapOn: "Remind me"
- assertVisible: "Pick a date and time…"
- waitForAnimationToEnd
- takeScreenshot: inbox-remind
- tapOn: "In 1 hour.*"
- waitForAnimationToEnd
# Note that a compact window goes back to the list, which no longer holds
# the reminded thread, while an iPad's split view keeps it standing, still
# picked beside its thread, with its reminder's time, Open's count one less.
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - assertNotVisible: "Recorded the invite flow"
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - assertVisible: "Reminder .*"
- tapOn: "More"
- tapOn: "Reminders"
- assertVisible: "Recorded the invite flow"
- assertVisible: "Reminder .*"
- waitForAnimationToEnd
- takeScreenshot: inbox-reminders
- tapOn: "More"
- tapOn: "Open.*"
- waitForAnimationToEnd
# The scopes stand in the ⋯ menu, on every window, as Mail's filter does:
# All lists the settled threads too. It comes after every press on a row,
# since it scrolls the list down. Note that All is picked while Open
# stands, so the bar names no scope yet and its "All" is the menu's alone.
- tapOn: "More"
- tapOn: "All"
- scrollUntilVisible:
    element: "Which day the digest goes out"
    direction: DOWN
- waitForAnimationToEnd
- takeScreenshot: inbox-all
- tapOn: "More"
- tapOn: "Open.*"
# The search, a round glass button in the bar, narrows the list to
# the threads whose words hold every word typed. It comes last, since its
# keyboard stands over the rows.
# A compact window's search is the bar's round button, named as the Search
# tab is, so the one above the tab bar is pressed; a split view's sidebar
# holds the field itself.
- runFlow:
    when:
      notVisible: "Search inbox"
    commands:
      - tapOn:
          text: "Search"
          above: "Tab Bar"
- tapOn: "Search inbox"
- inputText: "digest"
- assertVisible: "Verify the digest's sender domain"
- assertNotVisible: "Invite limits"
- takeScreenshot: inbox-search
