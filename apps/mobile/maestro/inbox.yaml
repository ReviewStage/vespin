# inbox.yaml -- the Inbox's list under its scopes' segmented control (a menu picker in a regular window's list column), the account's photo in its bar, its ⋯ menu, its search, a row's swipes and its long press preview, a thread with a picture opened full screen and a video in the system's player, Remind me from its ⋯ menu, and Remind me putting a thread away under Reminders.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
---
# Launched on the host's Inbox fixture, as `skeleton.yaml` is, so the list
# holds the fixture's threads and no server is reached; the fixture answers
# each mark and each thread's file read (`@repo/host/fixture-inbox`).
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- assertVisible: "Recorded the invite flow"
# The account's photo leads the bar, heard as Settings: the fixture's account
# has no picture, so its letters stand in it.
- assertVisible: "Settings"
- waitForAnimationToEnd
- takeScreenshot: inbox-list
# The ⋯ menu: Mark all as read. A tap off the menu closes it.
- tapOn: "More"
- assertVisible: "Mark all as read"
- takeScreenshot: inbox-more
- tapOn:
    point: "50%, 90%"
- waitForAnimationToEnd
# The scopes' segmented control over the list, Open chosen: All lists the settled threads
# too. A regular window's list column holds them as a menu picker instead,
# named for the scope chosen, so the flow opens it first there.
- runFlow:
    when:
      visible: "Choose an item"
    commands:
      - tapOn: "Open.*"
- tapOn: "All"
- scrollUntilVisible:
    element: "Which day the digest goes out"
    direction: DOWN
- waitForAnimationToEnd
- takeScreenshot: inbox-all
- scrollUntilVisible:
    element: "Recorded the invite flow"
    direction: UP
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Choose an item"
    commands:
      - tapOn: "All"
- tapOn: "Open.*"
# A swipe from the leading edge reveals Mark as read or unread, which a full
# swipe would press at once, so the flow swipes partway across "Recorded the
# invite flow", the second row, which a compact window stands at about a
# quarter of its height whatever the list holds below it; a long press offers
# the same in the row's menu. Note that the press is optional, because a
# regular window's sidebar stands its rows elsewhere.
- swipe:
    start: "8%, 27%"
    end: "38%, 27%"
    duration: 900
- takeScreenshot: inbox-swipe
- tapOn:
    text: "Mark as .*"
    optional: true
# A swipe from the trailing edge reveals Resolve, which a full swipe would
# press at once, and Remind me, so the flow swipes partway back across the
# same row, and a tap on the Inbox's tab closes it unpressed. Note that a
# regular window, which stands "Choose an item" beside its sidebar, is left
# out, as its swipes read as taps.
- runFlow:
    when:
      notVisible: "Choose an item"
    commands:
      - swipe:
          start: "92%, 27%"
          end: "60%, 27%"
          duration: 900
      - assertVisible: "Resolve"
      - takeScreenshot: inbox-swipe-trailing
      - tapOn: "Inbox"
      - waitForAnimationToEnd
- scrollUntilVisible:
    element: "acceptInvite can add a member twice"
    direction: DOWN
- waitForAnimationToEnd
# A long press lifts the thread's preview, its newest messages under its
# task and title, over the row's menu, which leads with Open, since a tap on
# the preview only closes it.
- longPressOn: "acceptInvite can add a member twice"
- assertVisible: "Open"
- assertVisible: "Mark as read"
- waitForAnimationToEnd
- takeScreenshot: inbox-preview
- tapOn: "Mark as read"
# Note that the list is scrolled back to its first row, rather than to the
# first point this row shows, because the folded Duo then stands it against the
# top edge, where a tap a point or two higher no longer opens it. Neither row
# can be scrolled to the middle, since a list at its top scrolls no further,
# and a window that shows the row already scrolls not at all.
- runFlow:
    when:
      notVisible: "Recorded the invite flow"
    commands:
      - scrollUntilVisible:
          element: "Who can withdraw an invite\\?"
          direction: UP
# A thread opens on its path small in the bar and its title as the page's
# heading, then each message: the agent's tile, name and time over its words,
# its picture drawn where the words name it, and its recording after the
# message that sent it, played in place from its MP4 copy.
- tapOn: "Recorded the invite flow"
- assertVisible: ".*walked the invite flow.*"
- waitForAnimationToEnd
- takeScreenshot: inbox-thread
- tapOn: "The invite page"
- assertVisible:
    id: "markdown-picture-done"
- takeScreenshot: inbox-picture
- tapOn:
    id: "markdown-picture-done"
- scrollUntilVisible:
    element: "invite-flow.webm.*"
    direction: DOWN
- waitForAnimationToEnd
# The recording is read as its MP4 copy, which iOS's player plays in place:
# the flow waits for the player to report it can play the file, so a read
# that never lands, or a file it cannot play, fails here rather than leaving a
# well with its spinner in the screenshot.
- extendedWaitUntil:
    visible:
      id: "video-player"
    timeout: 15000
- assertNotVisible: ".*can't play here.*"
- takeScreenshot: inbox-video
# A file that is neither a picture nor a video, the test plan's PDF, stands
# after its message as its chip, its name over its kind and size once read; a
# press opens it full screen, its pages drawn in a web view under a bar with
# Done and Share.
- scrollUntilVisible:
    element: "invite-test-plan.pdf, PDF · .*"
    direction: DOWN
- waitForAnimationToEnd
- takeScreenshot: inbox-file
- tapOn: "invite-test-plan.pdf, PDF · .*"
- assertVisible:
    id: "file-viewer"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: inbox-pdf
- tapOn:
    id: "file-viewer-done"
- waitForAnimationToEnd
# The thread's ⋯ menu opens Remind me too: a compact window's bar holds the
# menu, and a regular window's detail column its own, the last "More" on
# screen beside the sidebar's. The sheet stands over the whole thread, and a
# split view's thread fills its column's height beneath it. A tap off the
# sheet closes it unchanged, so the row's Remind me below still finds the
# thread under Open.
- tapOn:
    text: "More"
    index: -1
- tapOn: "Remind me"
- assertVisible: "Pick a date and time…"
- waitForAnimationToEnd
- takeScreenshot: inbox-thread-remind
- tapOn:
    point: "50%, 5%"
- waitForAnimationToEnd
- assertNotVisible: "Pick a date and time…"
# Back on the list, the search, a round glass button in the bar, narrows it to
# the threads whose words hold every word typed. It comes last, since its
# keyboard stands over the rows.
- tapOn: "Inbox"
- waitForAnimationToEnd
# Remind me, which a row's trailing swipe and its long press both open, offers
# the panel's times in a sheet, each saying when it comes due; In 1 hour puts
# the thread away, out of Open and under Reminders, its time in the row's
# time's place. The long press is used, since a regular window's sidebar
# stands its rows elsewhere. Open is chosen again for the search below.
- longPressOn: "Recorded the invite flow"
- tapOn: "Remind me"
- assertVisible: "Pick a date and time…"
- waitForAnimationToEnd
- takeScreenshot: inbox-remind
- tapOn: "In 1 hour.*"
- waitForAnimationToEnd
- assertNotVisible: "Recorded the invite flow"
- runFlow:
    when:
      visible: "Choose an item"
    commands:
      - tapOn: "Open.*"
- tapOn: "Reminders"
- assertVisible: "Recorded the invite flow"
- assertVisible: "Reminder .*"
- waitForAnimationToEnd
- takeScreenshot: inbox-reminders
- runFlow:
    when:
      visible: "Choose an item"
    commands:
      - tapOn: "Reminders"
- tapOn: "Open.*"
- waitForAnimationToEnd
# A compact window's search is the bar's round button, named as the Search
# tab is, so the one above the tab bar is pressed; a split view's sidebar
# holds the field itself.
- runFlow:
    when:
      notVisible: "Search inbox"
    commands:
      - tapOn:
          text: "Search"
          above: "Tab Bar"
- tapOn: "Search inbox"
- inputText: "digest"
- assertVisible: "Verify the digest's sender domain"
- assertNotVisible: "Invite limits"
- takeScreenshot: inbox-search
