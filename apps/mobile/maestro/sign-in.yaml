# sign-in.yaml -- sign in, relaunch still signed in, and sign out, against the stubbed account service.
#
# The app is launched with `-authServer stub` (`src/host/launch-arguments.ts`),
# which answers the account service in the app and grants the authorization
# page at once (`src/host/stub-auth-server.ts`), so the flow signs in through
# the host's real `ios` client, its tokens sealed by the Keychain's cipher in
# the settings file, without a network or the system's sign-in sheet.
appId: dev.vespin.ios
---
- launchApp:
    clearState: true
    arguments:
      authServer: stub
- assertVisible: "Sign in to Vespin"
- waitForAnimationToEnd
- takeScreenshot: sign-in
- tapOn: "Continue with GitHub"
- assertVisible: "Inbox"
# The next launch reads the tokens back from the settings file and opens on
# the Inbox, never the sign-in screen.
- stopApp
- launchApp:
    arguments:
      authServer: stub
- assertVisible: "Inbox"
- assertNotVisible: "Sign in to Vespin"
# The workspace switcher leads the Inbox's bar, and its menu's account,
# heard as its name and Settings, opens it.
- assertVisible:
    id: "workspace-switcher"
- waitForAnimationToEnd
- takeScreenshot: inbox-account
- tapOn:
    id: "workspace-switcher"
- tapOn: ".*, Settings"
- assertVisible: "Ada Lovelace"
# The workspace the app works in stands under the account, the signed-in
# account's own one first; the switcher in the bar chooses among the others.
- assertVisible: "Ada's workspace"
- waitForAnimationToEnd
- takeScreenshot: settings
# Sign out stands on the Account page, which the account's row opens.
- tapOn: "Ada Lovelace"
- waitForAnimationToEnd
# Note that Sign out stands at the page's foot, below the fold of a short
# window such as the folded iPhone Duo's, so the page scrolls to it first.
- scrollUntilVisible:
    element: "Sign out"
- tapOn: "Sign out"
- assertVisible: "Sign in to Vespin"
