# sign-in.yaml -- sign in, relaunch still signed in, and sign out, against the stubbed account service.
#
# The app is launched with `-authServer stub` (`src/host/launch-arguments.ts`),
# which answers the account service in the app and grants the authorization
# page at once (`src/host/stub-auth-server.ts`), so the flow signs in through
# the host's real `ios` client, its tokens sealed by the Keychain's cipher in
# the settings file, without a network or the system's sign-in sheet.
appId: dev.vespin.ios
---
- launchApp:
    clearState: true
    arguments:
      authServer: stub
# Note that a prompt standing over the sign-in screen, as one AX5 run showed,
# is answered before the screen's title is looked for, since it hides the
# title from the tree; the app asks only once an account is signed in, so
# this is for a prompt that rose a beat late, never a second one.
- extendedWaitUntil:
    visible: "Sign in to Vespin|Don.t Allow"
    timeout: 30000
- runFlow:
    when:
      visible: "Don.t Allow"
    commands:
      - tapOn: "Don.t Allow"
- assertVisible: "Sign in to Vespin"
- waitForAnimationToEnd
- takeScreenshot: sign-in
- tapOn: "Continue with GitHub"
# Signed in, the Inbox asks for notifications in place rather than raising
# iOS's prompt at once (`src/notification-ask.tsx`): its first row says why,
# and Turn On Notifications raises the prompt. The flow answers Don't Allow,
# because at an accessibility text size Allow stands below the alert's fold,
# where no tap reaches it; nothing grants the permission before, since
# Maestro 2.12.1's `permissions` sets no notifications and the launch's clear
# reinstalls the app, which takes a grant back
# (`scripts/simulator-screenshots.sh`). Refused, the row offers iOS's
# Settings instead, and Not Now lets it go.
- extendedWaitUntil:
    visible: "Know when an agent needs you"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: inbox-notification-ask
- tapOn: "Turn On Notifications"
- extendedWaitUntil:
    visible: "Don.t Allow"
    timeout: 10000
- tapOn: "Don.t Allow"
- extendedWaitUntil:
    visible: "Notifications are off"
    timeout: 10000
- assertVisible: "Open Settings"
- waitForAnimationToEnd
- takeScreenshot: inbox-notification-refused
- tapOn: "Not Now"
- assertNotVisible: "Notifications are off"
- assertVisible: "Activity"
# The next launch reads the tokens back from the settings file and opens on
# the Inbox, never the sign-in screen.
- stopApp
- launchApp:
    arguments:
      authServer: stub
- extendedWaitUntil:
    visible: "Activity"
    timeout: 30000
- assertNotVisible: "Sign in to Vespin"
# The workspace switcher leads the Inbox's bar, and its menu's account,
# heard as Settings and its address, opens it.
- runFlow:
    file: subflows/show-sidebar.yaml
- assertVisible:
    id: "workspace-switcher"
- waitForAnimationToEnd
- takeScreenshot: inbox-account
- runFlow:
    file: subflows/switcher.yaml
# Note that the account's row stands last in the list, below the fold at an
# accessibility text size, so the list scrolls to it first.
- scrollUntilVisible:
    element: "Settings(, .*)?"
- tapOn: "Settings(, .*)?"
- assertVisible: "Ada Lovelace"
# The workspace the app works in stands under the account, the signed-in
# account's own one first; the switcher in the bar chooses among the others.
- assertVisible: "Ada's workspace"
- waitForAnimationToEnd
- takeScreenshot: settings
# Sign out stands on the Account page, which the account's row opens.
- tapOn: "Ada Lovelace"
- waitForAnimationToEnd
# Note that Sign out stands at the page's foot, below the fold of a short
# window such as the folded iPhone Duo's, so the page scrolls to it first.
- scrollUntilVisible:
    element: "Sign out"
- tapOn: "Sign out"
- assertVisible: "Sign in to Vespin"
