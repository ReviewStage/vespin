# new-thread.yaml -- a thread's box turned to start a new thread with its agent from the composer's +, and back, its line asking for the new thread while it is on.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
---
# Launched on the host's Inbox fixture, as `answer.yaml` is, so no server is
# reached. Nothing is sent: the flow shows the box's two states and the
# switch that moves between them.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- scrollUntilVisible:
    element: "acceptInvite can add a member twice"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn: "acceptInvite can add a member twice"
- assertVisible: "Reply"
- waitForAnimationToEnd
# New thread, from the composer's +: a switch named for the agent, which has
# the box ask for a new thread, and Got it steps aside, since the next send
# starts one rather than settling.
- tapOn:
    id: "composer-add"
- assertVisible: "Send as a new thread to.*"
- takeScreenshot: new-thread-switch
- tapOn: "Send as a new thread to.*"
- waitForAnimationToEnd
- assertVisible: "Start a new thread"
- assertNotVisible: "Got it"
- takeScreenshot: new-thread-box
# Turning the switch off has the box reply again.
- tapOn:
    id: "composer-add"
- tapOn: "Send as a new thread to.*"
- waitForAnimationToEnd
- assertVisible: "Reply"
- takeScreenshot: new-thread-off
