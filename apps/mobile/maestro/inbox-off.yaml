# inbox-off.yaml -- the app with the member's Inbox turned off: it opens on Tasks with no Inbox tab, a thread a link names opens on Tasks' stack, Search offers no Inbox scope, and Settings › Agents stands Use the Inbox off.
#
# Launched on the host's Inbox fixture with `-inboxOff true`, which stands
# the account as one that turned its Inbox off on another device
# (`fixture-host.ts`'s `withInboxOff`), so no server is reached. The
# screenshots land under the run's --test-output-dir (`takeScreenshot/`).
appId: dev.vespin.ios
# Note that an iPad is turned back upright however the flow ends, because a
# run left in landscape fails every flow after it.
onFlowComplete:
  - setOrientation: PORTRAIT
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      inboxOff: "true"
# Note that an iPad stands in landscape, so its tab sidebar is checked too.
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible: "Teammate invitations"
    timeout: 30000
# Note that an iPad's floating bar and tab sidebar carry no ids, so there the Inbox is looked for by its name.
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - assertVisible:
          id: "tasks-tab"
      - assertNotVisible:
          id: "inbox-tab"
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - assertNotVisible: "Inbox"
- assertNotVisible: "Recorded the invite flow"
- takeScreenshot: inbox-off-tasks
# A thread a link names still opens, on Tasks' stack, since no Inbox tab
# stands to open it on. The system asks before a custom scheme opens the app.
# Note that an iPad is turned upright first, its sidebar already shot,
# because in landscape XCTest names the system's ask in the upright screen's
# points, so a tap on its Open lands beside it and the ask stays.
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - setOrientation: PORTRAIT
- openLink: "vespin://inbox/81e2a425-6d9f-4ab7-92df-000000000001"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: ".*withdrawing one deletes it.*"
    timeout: 15000
- takeScreenshot: inbox-off-thread
# Search offers Tasks and Agents, and finds no thread.
- stopApp
- launchApp:
    arguments:
      fixture: inbox
      inboxOff: "true"
- extendedWaitUntil:
    visible: "Teammate invitations"
    timeout: 30000
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Search
- tapOn: "Search Vespin"
- inputText: "invite"
- extendedWaitUntil:
    visible: "Invite email copy"
    timeout: 15000
- assertNotVisible: "Inbox"
- assertNotVisible: "Recorded the invite flow"
- takeScreenshot: inbox-off-search
# Settings › Agents stands the switch off, read from the account.
- stopApp
- launchApp:
    arguments:
      fixture: inbox
      inboxOff: "true"
- extendedWaitUntil:
    visible: "Teammate invitations"
    timeout: 30000
- tapOn:
    id: "workspace-switcher"
- tapOn: "Settings(, .*)?"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Agents"
- tapOn: "Agents"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Use the Inbox"
- assertVisible:
    text: "Use the Inbox"
    checked: false
- takeScreenshot: inbox-off-settings
