# skeleton-dark.yaml -- the skeleton's screens in the dark theme, each shot once, so the brand's dark colors are seen beside the light.
#
# The screenshots land beside `skeleton.yaml`'s under the run's
# --test-output-dir, each named with a `-dark` suffix.
appId: dev.vespin.ios
---
- setDarkMode: enabled
- launchApp:
    clearState: true
- assertVisible: "Inbox"
- takeScreenshot: inbox-dark
- tapOn: "Pick the tab bar's placement"
- assertVisible: "Recommended"
- takeScreenshot: inbox-ask-dark
- tapOn: "Inbox"
- tapOn: "Tasks"
- assertVisible: "Tasks"
- takeScreenshot: tasks-dark
- tapOn: "New task"
- assertVisible: "Describe the task, and an agent starts on it."
- takeScreenshot: new-task-dark
- openLink: vespin://signed-out
# As in `skeleton.yaml`: iOS may ask before it opens the link, in its own time.
- extendedWaitUntil:
    visible: "Open"
    timeout: 60000
    optional: true
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 60000
- takeScreenshot: signed-out-dark
- setDarkMode: disabled
