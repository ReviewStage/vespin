# open.yaml -- PROBE, not for merge: one launch, one open of #128 by LINK with its parts held back by DELAYS, waited on until WAIT shows.
appId: dev.vespin.ios
---
- launchApp:
    stopApp: true
    arguments:
      fixture: inbox
      prProbe: ${DELAYS}
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- openLink: ${LINK}
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Ready to merge"
    timeout: 30000
- extendedWaitUntil:
    visible: ${WAIT}
    timeout: 30000
