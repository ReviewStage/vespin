# j07-new-task.yaml -- New task's sheet with the keyboard, a repository picked, the sheet closed and opened again (does the draft stand?), and closed.
appId: dev.vespin.ios
---
- launchApp:
    clearState: true
    arguments:
      fixture: inbox-large
# Note that the Inbox stands once its workspace button does: inbox-large pins its many rows above the staged threads, so no staged row stands on the first screen.
- extendedWaitUntil:
    visible:
      id: "workspace-switcher"
    timeout: 30000
- runFlow: { file: _pause.yaml, env: { MS: "1000" } }
- tapOn: "New task"
- runFlow: { file: _pause.yaml, env: { MS: "1500" } }
- inputText: { text: "Let a workspace owner revoke a pending invite.", optional: true }
- runFlow: { file: _pause.yaml, env: { MS: "800" } }
- runFlow: { file: ../../subflows/lower-keyboard.yaml }
- tapOn: { text: "ada/relay", optional: true }
- runFlow: { file: _pause.yaml, env: { MS: "1200" } }
- tapOn: { text: "ada/ledger", optional: true }
- runFlow: { file: _pause.yaml, env: { MS: "1200" } }
- runFlow: { file: ../../subflows/close-sheet.yaml }
# Note that main asks before letting a sheet with words go (Discard / Save / Cancel; desktop keeps the draft with no question, #10936), so the first close keeps it, to see whether it stands on reopen.
- runFlow:
    when:
      visible: "Save draft"
    commands:
      - tapOn: "Save draft"
- runFlow: { file: _pause.yaml, env: { MS: "1500" } }
- tapOn: "New task"
- runFlow: { file: _pause.yaml, env: { MS: "2500" } }
- runFlow: { file: ../../subflows/close-sheet.yaml }
- runFlow:
    when:
      visible: "Discard draft"
    commands:
      - tapOn: "Discard draft"
- runFlow: { file: _pause.yaml, env: { MS: "1500" } }
