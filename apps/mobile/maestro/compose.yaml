# compose.yaml -- an agent's composer: the messages queued behind its turn folded over the field under one line that opens them, each with Steer and Delete, a follow-up typed and sent, the + menu's Photos and MCP servers, the model chip's permission mode, a `/` offering the task's skills, an `@` picked into a pill, and the turn stopped.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
# Note that each wait for the screen to settle is capped at five seconds,
# because the page draws its agent still running, whose mark never stops
# moving, so an uncapped wait always ran to Maestro's fifteen.
---
# Launched on the host's Inbox fixture, opened on its invitations agent's page
# as `agent.yaml` is, whose turn still runs and whose queue holds one message
# of the account's; the fixture takes each message, queue change, and Stop as
# the service would (`@repo/host/fixture-inbox`), so nothing reaches a server.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      agent: 5ebf7192-3a6c-4d84-8fac-6b7c8d9eafb5
- extendedWaitUntil:
    visible: "2 queued"
    timeout: 30000
# The two queued messages stand folded under one line, which a press opens.
- tapOn: "2 queued"
- assertVisible: "Then add a Resend button beside each pending invite."
- assertVisible: "Steer"
- assertVisible: "Stop"
- assertVisible: "Add"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: compose-idle
# A follow-up typed lights Send in Stop's place; sent, the field empties and
# no refusal stands over it.
- tapOn:
    id: "composer-field"
- inputText: "Show the invite's expiry in the email too."
- assertVisible: "Send"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: compose-typed
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Stop"
    timeout: 5000
- assertNotVisible:
    id: "ask-note"
# The keyboard goes down on a drag from the transcript into it, as Messages
# lowers it. Note that hideKeyboard is not used, since it drags at the
# screen's middle, where the composer stands while a call waits, the queue
# holds a message, and the keyboard is up.
- swipe:
    start: "50%, 25%"
    end: "50%, 92%"
    duration: 600
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: compose-sent
# The queued message steered into the turn under way.
- tapOn: "Steer"
- assertNotVisible:
    id: "ask-note"
# The + opens a menu, as the desktop composer's +: Photos, then MCP
# servers, each server the agent is handed, checked while it is on, a press
# switching it.
- tapOn: "Add"
- assertVisible: "Photos"
- assertVisible: "MCP servers"
- assertNotVisible: "Options"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: compose-add-menu
- tapOn: "MCP servers"
- assertVisible: "Linear"
- assertVisible: "Notion · Personal"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: compose-servers
- tapOn: "Notion · Personal"
# The permission mode stands last in the model chip's sheet, as the
# desktop's model chip menu holds it; a mode picked is drawn on the agent at
# once, as the fixture lays it, and stands picked.
- tapOn:
    id: "agent-model-chip"
- runFlow:
    file: subflows/full-sheet.yaml
- scrollUntilVisible:
    element: "Full access.*"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: compose-permissions
- tapOn: "Approve for me.*"
- assertVisible:
    text: "Approve for me.*"
    selected: true
# Note that the sheet is scrolled back to its head for Done, which drawing
# it up on a short window, the iPhone Duo's, scrolled out of sight.
- scrollUntilVisible:
    element: "Done"
    direction: UP
- tapOn: "Done"
# A `/` typed offers the task's skills over the field, narrowed as the name
# is typed, and a press writes the skill's word into the message.
- tapOn:
    id: "composer-field"
- inputText: "/"
- assertVisible: "/release-notes"
- assertVisible: "/migrate"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: compose-skills
- inputText: "rev"
- assertVisible: "/review"
- assertNotVisible: "/migrate"
- tapOn: "/review"
- assertNotVisible: "/release-notes"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: compose-skill-picked
# An `@` typed after it offers what the words find, read at the caret, and a
# press stands the picked thread as its pill in the words, as the desktop's
# box draws its chip, the message carrying its link.
- inputText: "@Invite li"
- assertVisible: "Invite limits"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: compose-mention-offered
- tapOn: "Invite limits"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: compose-mention-picked
- eraseText: 40
- swipe:
    start: "50%, 25%"
    end: "50%, 92%"
    duration: 600
# Stop, with nothing typed, stands as the system's spinner until the agent stops.
- tapOn: "Stop"
- assertVisible: "Stopping"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: compose-stopping
