# compose.yaml -- an agent's composer: the message queued behind its turn listed over the field with Steer and Delete, a follow-up typed and sent, the + menu's Photos, Options, permission mode, and Fast, a `/` offering the task's skills, and the turn stopped.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
# Note that each wait for the screen to settle is capped at five seconds,
# because the page draws its agent still running, whose mark never stops
# moving, so an uncapped wait always ran to Maestro's fifteen.
---
# Launched on the host's Inbox fixture, opened on its invitations agent's page
# as `agent.yaml` is, whose turn still runs and whose queue holds one message
# of the account's; the fixture takes each message, queue change, and Stop as
# the service would (`@repo/host/fixture-inbox`), so nothing reaches a server.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      agent: 5ebf7192-3a6c-4d84-8fac-6b7c8d9eafb5
- assertVisible: "Then add a Resend button beside each pending invite."
- assertVisible: "Steer"
- assertVisible: "Stop"
- assertVisible: "Add"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: compose-idle
# A follow-up typed lights Send in Stop's place; sent, the field empties and
# no refusal stands over it.
- tapOn:
    id: "composer-field"
- inputText: "Show the invite's expiry in the email too."
- assertVisible: "Send"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: compose-typed
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Stop"
    timeout: 5000
- assertNotVisible:
    id: "ask-note"
# The keyboard goes down on a drag from the transcript into it, as Messages
# lowers it. Note that hideKeyboard is not used, since it drags at the
# screen's middle, where the composer stands while a call waits, the queue
# holds a message, and the keyboard is up.
- swipe:
    start: "50%, 25%"
    end: "50%, 92%"
    duration: 600
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: compose-sent
# The queued message steered into the turn under way.
- tapOn: "Steer"
- assertNotVisible:
    id: "ask-note"
# The + opens a menu, nearest it Photos and Options, then the agent's
# permission mode, a menu of the three with the one it runs on checked, and
# Fast, a switch, since Opus 5.5 has a fast version; a mode picked there is
# drawn on the agent at once, as the fixture lays it.
- tapOn: "Add"
- assertVisible: "Photos"
- assertVisible: "Options"
- assertVisible: "Permissions"
- assertVisible: "Fast"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: compose-add-menu
- tapOn: "Permissions"
- assertVisible: "Full access"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: compose-permissions
- tapOn: "Approve for me"
- assertNotVisible:
    id: "ask-note"
# The mode taken stands picked in the options sheet the + also opens.
- tapOn: "Add"
- tapOn: "Options"
- runFlow:
    file: subflows/full-sheet.yaml
- assertVisible:
    text: "Approve for me.*"
    selected: true
- tapOn: "Done"
# A `/` typed offers the task's skills over the field, narrowed as the name
# is typed, and a press writes the skill's word into the message.
- tapOn:
    id: "composer-field"
- inputText: "/"
- assertVisible: "/release-notes"
- assertVisible: "/migrate"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: compose-skills
- inputText: "rev"
- assertVisible: "/review"
- assertNotVisible: "/migrate"
- tapOn: "/review"
- assertNotVisible: "/release-notes"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: compose-skill-picked
- eraseText: 20
- swipe:
    start: "50%, 25%"
    end: "50%, 92%"
    duration: 600
# Stop, with nothing typed, stands as the system's spinner until the agent stops.
- tapOn: "Stop"
- assertVisible: "Stopping"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: compose-stopping
