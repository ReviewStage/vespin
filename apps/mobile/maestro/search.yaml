# search.yaml -- the Search tab: what it says before anything is typed, a place a query finds as a "Go to …" command, the tasks, Inbox items, and agents a query finds, each in its own section, a task opened from them, what it says where nothing matches, and the task opened standing under Recent once nothing is typed.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
---
# Launched on the host's Inbox fixture, as `tasks.yaml` is, so the search
# finds the fixture's tasks, the Inbox's threads, and the agents on the
# tasks, and no server is reached (`@repo/host/fixture-inbox`).
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Inbox"
    timeout: 30000
# Note that the tab is tapped by its id, since a list's round search button
# in a compact window's bar, and a split view's search field in a regular
# one, are named Search too.
- runFlow:
    when:
      visible:
        id: "search-tab"
    commands:
      - tapOn:
          id: "search-tab"
# The iPad's top tab bar carries no id, so there the tab is the Search right of Tasks.
- runFlow:
    when:
      notVisible: "Search Vespin"
    commands:
      - tapOn:
          text: "Search"
          rightOf: "Tasks"
- assertVisible: "Search Vespin"
- takeScreenshot: search-empty
# The field is focused as the tab opens; it is pressed anyway, which a
# focused field takes as nothing. Words nothing answers say so.
- tapOn: "Search Vespin"
- inputText: "zzqx"
- assertVisible: "No results for “zzqx”"
- takeScreenshot: search-no-results
# A place found once something is typed stands under Commands as "Go to …",
# as ⌘K finds it, where Go to stood before anything was typed.
- eraseText
- inputText: "settings"
- assertVisible: "Commands"
- assertVisible: "Go to settings"
- takeScreenshot: search-go-to
# The task "Ledger rounding" leads Tasks, its agent "Fix ledger rounding"
# stands under Agents, and a task the words do not name is left out.
- eraseText
- inputText: "rounding"
- assertVisible: "Ledger rounding"
- assertNotVisible: "Weekly digest email"
- scrollUntilVisible:
    element: "Fix ledger rounding"
    direction: DOWN
- takeScreenshot: search-results
# A task found opens on its Overview, in the Tasks tab, as its row there
# opens it. It comes last, since the Tasks tab then stands over the search.
# Note that the agent's row names its task too, so the task's own row is found
# as the one above the agent.
- scrollUntilVisible:
    element:
      text: "Ledger rounding"
      above: "Fix ledger rounding"
    direction: UP
- waitForAnimationToEnd
- tapOn:
    text: "Ledger rounding"
    above: "Fix ledger rounding"
- assertVisible: "Created by .*"
- takeScreenshot: search-opened
# Back on Search with nothing typed, Recent lists the task just opened, as
# Apple's search tabs list their recents. A compact window pushed the task on
# Search's own stack, whose tab, tapped again, pops back to the field still
# holding the words; a regular one opened it on Tasks and ended the search,
# so its Search tab stands with the field empty.
- runFlow:
    when:
      visible:
        id: "search-tab"
    commands:
      - tapOn:
          id: "search-tab"
- runFlow:
    when:
      notVisible: "rounding"
    commands:
      - tapOn:
          text: "Search"
          rightOf: "Tasks"
- runFlow:
    when:
      visible: "rounding"
    commands:
      - tapOn: "rounding"
      - eraseText
- assertVisible: "Recent"
- assertVisible: "Ledger rounding"
- takeScreenshot: search-recent
