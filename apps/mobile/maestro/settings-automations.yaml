# settings-automations.yaml -- Settings › Automations on the Inbox fixture: the workspace's automations, the workspace's first and Ada's own after, each with what fires it and how its newest run went; a row's Run now and switch in its long press menu; an automation's page, read-only, with its switch turned off and on, Run now, and recent runs; and a run opening the agent it started on the tabs, Settings closed, so Back goes to the Tasks list.
#
# Launched on the host's Inbox fixture, whose workspace holds three
# automations and their runs (`@repo/host/fixture-inbox`'s
# `inboxAutomationsAppState`), so no server is reached: a weekly digest on a
# schedule, a fix on each failed check whose newest run is at work, and
# Ada's own deploy check, turned off, whose newest run could not start. The
# fixture answers a Run now and a switch as the service would, and lays the
# switch over the list (`fixture-host.ts`).
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- tapOn:
    id: "workspace-switcher"
- tapOn: "Settings(, .*)?"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "settings-automations"
- tapOn:
    id: "settings-automations"
- waitForAnimationToEnd
# Note that a row is one element, heard as its name, so an automation is found by it.
- assertVisible: "Weekly digest"
- assertVisible: "Fix failing checks"
- assertVisible: "Check each deploy"
- takeScreenshot: settings-automations
# A long press offers Run now and the switch turned the other way.
- longPressOn: "Fix failing checks"
- assertVisible: "Run now"
- assertVisible: "Turn off"
- waitForAnimationToEnd
- takeScreenshot: settings-automations-menu
- tapOn: "Run now"
- waitForAnimationToEnd
# An automation's page: its switch and Run now, what fires it, its prompt, and its runs.
- tapOn: "Weekly digest"
- waitForAnimationToEnd
- assertVisible: "Run now"
- assertVisible: "Trigger"
- takeScreenshot: settings-automation
# The switch turns it off at once, as the host draws a switch turned, and on
# again. Note that the switch is pressed where it stands, at the row's
# trailing end, because a press on the row's words turns nothing, as in iOS's
# own Settings.
- tapOn:
    text: "On"
    checked: true
    point: "92%,50%"
- assertVisible:
    text: "On"
    checked: false
- waitForAnimationToEnd
- takeScreenshot: settings-automation-off
- tapOn:
    text: "On"
    checked: false
    point: "92%,50%"
- assertVisible:
    text: "On"
    checked: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Send the weekly digest"
- takeScreenshot: settings-automation-runs
# A run opens the agent it started, on the tabs, the Settings sheet gone:
# its transcript drawn, and Back going to the tabs rather than to the
# automation's page, which a page pushed inside the sheet would.
- tapOn: "Send the weekly digest"
- waitForAnimationToEnd
- assertVisible: ".*merged pull requests.*"
- assertNotVisible: "Recent runs"
- takeScreenshot: settings-automation-agent
- tapOn:
    id: "BackButton"
- waitForAnimationToEnd
- assertVisible: "Weekly digest email"
- assertNotVisible: "Weekly digest"
- assertNotVisible: "Recent runs"
- takeScreenshot: settings-automation-agent-back
