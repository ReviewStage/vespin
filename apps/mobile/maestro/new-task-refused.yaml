# new-task-refused.yaml -- New task whose agent is refused: the task made, the refusal said in an alert, and once it is read the task's page opened.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
---
# Launched on the host's Inbox fixture, whose task start on these words is
# answered with the task made and its agent refused for a retired model
# (`@repo/host/fixture-inbox`), so nothing reaches a server.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- assertVisible: "Inbox"
- tapOn: "New task"
- assertVisible: "Describe the task"
- inputText: "Start this agent on a retired model."
- hideKeyboard
- tapOn: "Start"
- extendedWaitUntil:
    visible: "Task made, its agent not started"
    timeout: 5000
- assertVisible: "That model isn't offered any more. Choose another."
- waitForAnimationToEnd
- takeScreenshot: new-task-refused-note
- tapOn: "OK"
- extendedWaitUntil:
    notVisible: "Describe the task"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: new-task-refused-task
