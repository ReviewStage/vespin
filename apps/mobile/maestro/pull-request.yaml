# pull-request.yaml -- a pull request's screen: reached from its card on the agent's page, whose Merge asks first; green and ready, then merged from the bar; reached from its task's Overview, by its agent's row and by its chip; one whose checks failed; and one in the merge queue, taken out of it after the question, and opened on GitHub.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
---
# Launched on the host's Inbox fixture, whose invitations agent opened three
# pull requests (`@repo/host/fixture-inbox`'s `FIXTURE_PULL_REQUEST`): #128
# green and ready, #127 with a check failed, and #126 second in the merge
# queue. A change is answered by the fixture as GitHub would take it and
# moves the pull request on the document; nothing reaches a server.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      agent: 5ebf7192-3a6c-4d84-8fac-6b7c8d9eafb5
# Note that each launch waits up to half a minute for its first words,
# because a loaded runner has taken longer than Maestro's own wait to bring
# the app to the front.
- extendedWaitUntil:
    visible: "Add a way to resend an invite that expired."
    timeout: 30000
# The card offers Merge beside Review, which asks first.
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: Merge
      DIRECTION: UP
- takeScreenshot: pull-request-card
- tapOn: "Merge"
- assertVisible: "Merge this pull request?"
- waitForAnimationToEnd
- takeScreenshot: pull-request-card-merge
- tapOn: "Cancel"
- waitForAnimationToEnd
# The card opens the pull request's own screen: green, approved, ready.
- tapOn: "#128 Invite a teammate by email.*"
- extendedWaitUntil:
    visible: "Ready to merge"
    timeout: 30000
- assertVisible: "grace"
- waitForAnimationToEnd
- takeScreenshot: pull-request-ready
# Merging acts on the press, as the panel's merge control does. Note that a
# regular window draws the press in the page, under the checks, where it may
# stand below the fold, so it is scrolled to first; an iPad's bar that folds
# its buttons into its overflow, "More", has it opened where it is in neither.
- runFlow:
    when:
      notVisible: "Squash and merge"
    commands:
      - scrollUntilVisible:
          element: "Squash and merge"
          direction: DOWN
          timeout: 5000
          optional: true
- runFlow:
    when:
      notVisible: "Squash and merge"
    commands:
      - tapOn: "More"
- tapOn: "Squash and merge"
# Note that the state stands in the page's head, which a scroll to the press
# may have taken out of sight, so the wait for it scrolls back up.
- scrollUntilVisible:
    element: "Merged"
    direction: UP
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: pull-request-merged
# A task's Overview opens it on the same screen rather than on GitHub: by the
# number on its agent's row, and by the chip its description names it with.
# Note that each is reached from a fresh launch, since iOS offers Maestro no
# back press.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- tapOn: "Teammate invitations"
- assertVisible: "Agents"
- tapOn: "#128"
- extendedWaitUntil:
    visible: "Ready to merge"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: pull-request-from-agent-row
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- tapOn: "Teammate invitations"
# Note that iOS never hears a chip as an element of its own, since it stands
# in its line as a view, so the line is found by what it is heard as
# (`heardLine`), "Pull request: pull request #128 …", and pressed at its
# middle, where the chip stands.
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: ".*#128 Invite a teammate by email"
- tapOn: ".*#128 Invite a teammate by email"
- extendedWaitUntil:
    visible: "Ready to merge"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: pull-request-from-chip
# One whose checks failed: the failure first, a check still running, and
# changes asked for, with no merge to press.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      agent: 5ebf7192-3a6c-4d84-8fac-6b7c8d9eafb5
      pullRequest: "127"
- extendedWaitUntil:
    visible: "Expire an invite after seven days.*"
    timeout: 30000
- assertVisible: "Changes requested"
- waitForAnimationToEnd
- takeScreenshot: pull-request-failing
# One in the merge queue: Remove from queue asks first, with what leaving
# costs the pull requests behind it, and once out it offers Merge when ready.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      agent: 5ebf7192-3a6c-4d84-8fac-6b7c8d9eafb5
      pullRequest: "126"
- extendedWaitUntil:
    visible: "Queued #2"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: pull-request-queued
- runFlow:
    when:
      notVisible: "Remove from queue"
    commands:
      - scrollUntilVisible:
          element: "Remove from queue"
          direction: DOWN
          timeout: 5000
          optional: true
- runFlow:
    when:
      notVisible: "Remove from queue"
    commands:
      - tapOn: "More"
- tapOn: "Remove from queue"
- assertVisible: "Remove from the merge queue?"
- waitForAnimationToEnd
- takeScreenshot: pull-request-dequeue
- tapOn:
    text: "Remove from queue"
    below: "Remove from the merge queue?"
- scrollUntilVisible:
    element: "Send the invite email from the workspace.*"
    direction: UP
- extendedWaitUntil:
    notVisible: "Queued #2"
    timeout: 30000
- runFlow:
    when:
      notVisible: "Merge when ready"
    commands:
      - scrollUntilVisible:
          element: "Merge when ready"
          direction: DOWN
          timeout: 5000
          optional: true
- runFlow:
    when:
      notVisible: "Merge when ready"
    commands:
      - tapOn: "More"
- assertVisible: "Merge when ready"
- waitForAnimationToEnd
- takeScreenshot: pull-request-dequeued
- scrollUntilVisible:
    element: "Send the invite email from the workspace.*"
    direction: UP
# Its diff and comments open on GitHub, from the bar's menu, the last "More"
# on screen where an iPad's overflow stands open with the menu inside it.
- tapOn:
    text: "More"
    index: -1
- assertVisible: "Open on GitHub"
- waitForAnimationToEnd
- takeScreenshot: pull-request-menu
- tapOn: "Open on GitHub"
- extendedWaitUntil:
    notVisible: "Send the invite email from the workspace.*"
    timeout: 30000
- takeScreenshot: pull-request-github
