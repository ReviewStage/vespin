# pull-request.yaml -- a pull request's screen: reached from its card on the agent's page, whose Merge asks first; green and ready, its title edited from a tap on it, then merged from the press under its heading after the question; reached from its task's Overview, by its agent's row and by its chip; one whose checks failed, its Checks row opening their list, turned to a draft and back from its state chip, then closed from its ⋯, with Undo reopening it; and one in the merge queue, whose Close from its state chip asks first, taken out of it after the question, and opened on GitHub.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
# Launched on the host's Inbox fixture, whose invitations agent opened three
# pull requests (`@repo/host/fixture-inbox`'s `FIXTURE_PULL_REQUEST`): #128
# green and ready, #127 with a check failed, and #126 second in the merge
# queue. A change is answered by the fixture as GitHub would take it and
# moves the pull request on the document; nothing reaches a server.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      agent: 5ebf7192-3a6c-4d84-8fac-6b7c8d9eafb5
# Note that each launch waits up to half a minute for its first words,
# because a loaded runner has taken longer than Maestro's own wait to bring
# the app to the front.
- extendedWaitUntil:
    visible: "Add a way to resend an invite that expired."
    timeout: 30000
# The card offers Merge beside Review, which asks first. Note that the
# transcript is dragged at three quarters across the screen rather than at
# its center, which on a landscape iPad is the list column beside it, and
# until the words the card's row follows are in sight rather than Merge,
# because a landscape iPad opens with the card under the top bar, where
# Merge reads as visible but takes no tap.
- repeat:
    while:
      notVisible: "The dialog takes an address and a role.*"
    times: 10
    commands:
      - swipe:
          start: "75%, 35%"
          end: "75%, 75%"
          duration: 400
- waitForAnimationToEnd
# Note that the drag that brings the words into sight can leave the card
# mid-list with its Merge under the dock's chips and composer, which take
# its tap, so where Merge stands below the dock's Approval the transcript is
# lifted once by a quarter of the screen, which stands the card above them.
- runFlow:
    when:
      visible:
        text: "Merge"
        below: "Approval"
    commands:
      - swipe:
          start: "75%, 60%"
          end: "75%, 35%"
          duration: 400
      - waitForAnimationToEnd
- takeScreenshot: pull-request-card
# Note that the card's Merge is found below the words its row follows,
# because while the transcript lays out its rows a fresh row can stand
# at the top of the tree for a moment, and on a 26.5 iPad the tap went
# there, past the card; the words' row ends that moment.
- tapOn:
    text: "Merge"
    below: "The dialog takes an address and a role.*"
- assertVisible: "Merge this pull request?"
- waitForAnimationToEnd
- takeScreenshot: pull-request-card-merge
- runFlow:
    file: subflows/dismiss-ask.yaml
    env:
      QUESTION: "Merge this pull request?"
- waitForAnimationToEnd
# The card opens the pull request's own screen: green, approved, ready.
- tapOn: "#128 Invite a teammate by email.*"
- extendedWaitUntil:
    visible: "Ready to merge"
    timeout: 30000
# Its description, as its agent wrote it, under the heading.
- assertVisible: "Adds Invite by email.*"
- waitForAnimationToEnd
- takeScreenshot: pull-request-ready
# Its title is edited where it stands: a tap on it opens the system's name
# alert, as a task is renamed, and Save keeps the words, which the heading
# draws at once and keeps once GitHub took them.
- tapOn: "Invite a teammate by email #128"
- assertVisible: "Edit title"
- waitForAnimationToEnd
- takeScreenshot: pull-request-title-edit
- eraseText
- inputText: "Invite teammates by email"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Invite teammates by email #128"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: pull-request-title-edited
# Note that the description stands above the checks, so the reviewers' rows,
# the page's last, may stand below the fold on a phone and are scrolled to,
# dragged at three quarters across as the card is, so a landscape iPad's
# drag lands on the page rather than the list column beside it.
- repeat:
    while:
      notVisible: "relay-review"
    times: 10
    commands:
      - swipe:
          start: "75%, 75%"
          end: "75%, 35%"
          duration: 400
- assertVisible: "grace"
# A review App's bot is named as the panel names it, its login without
# GitHub's "[bot]", in its rounded square with the bot tag after its name.
- assertVisible: "relay-review"
- waitForAnimationToEnd
- takeScreenshot: pull-request-reviewers
# Merging is the press under the heading, in every window, and it asks
# first, as the card's Merge does, scrolled back up to after the reviewer.
# Note that it is dragged back to the page's top every time, rather than
# while the press reads as not visible, because the tree still names the
# press in its place from before the reviewer's drag while the list glides,
# and the tap went there, above the press. The list is then let settle,
# since a tap on a list still gliding only stops it and presses nothing.
- swipe:
    start: "75%, 35%"
    end: "75%, 75%"
    duration: 400
- swipe:
    start: "75%, 35%"
    end: "75%, 75%"
    duration: 400
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Squash and merge"
    timeout: 10000
- tapOn: "Squash and merge"
- assertVisible: "Merge this pull request?"
- waitForAnimationToEnd
- takeScreenshot: pull-request-merge-ask
- tapOn:
    text: "Squash and merge"
    below: "Merge this pull request?"
- extendedWaitUntil:
    visible: "Merged"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: pull-request-merged
# A task's Overview opens it on the same screen rather than on GitHub: by the
# number on its agent's row, and by the chip its description names it with.
# Note that each is reached from a fresh launch, since iOS offers Maestro no
# back press.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- tapOn: "Teammate invitations"
- assertVisible: "Agents"
# A tap on the agent's row, one element with its pull request's number in
# its line, opens the agent, never the pull request.
- tapOn: "Build teammate invitations"
- extendedWaitUntil:
    visible: "Add a way to resend an invite that expired."
    timeout: 30000
- assertNotVisible: "Ready to merge"
- tapOn:
    text: "Back"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Agents"
# The pull request opens from the row's long-press menu, its item matched with
# or without the subtitle iPadOS 27 adds to its label.
- runFlow:
    file: subflows/row-menu.yaml
    env:
      ROW: Build teammate invitations
      ITEM: "Open pull request(, .*)?"
- tapOn: "Open pull request(, .*)?"
- extendedWaitUntil:
    visible: "Ready to merge"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: pull-request-from-agent-row
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- tapOn: "Teammate invitations"
# Note that iOS never hears a chip as an element of its own, since it stands
# in its line as a view, so the line is found by what it is heard as
# (`heardLine`), "Pull request: pull request #128", the chip named by its
# key alone, and pressed where the chip stands: 130 pt from the line's
# leading edge, just past "Pull request:" in the body style, the same on an
# iPhone's line and an iPad's twice as long, where a share of the line's
# width lands on the words before the chip. Note that the 130 pt holds only
# at the default text size, since "Pull request:" grows with Dynamic Type:
# this flow launches at the reader's default, and the AX lanes
# (`accessibility.yaml`, `accessibility-ax3.yaml`) never tap the chip, so a
# lane that does must find its own place for it. Note that the page
# is swiped at its right side rather than scrolled from the screen's center,
# since a landscape iPad's center falls in the list column beside the task,
# which never holds the chip.
- repeat:
    while:
      notVisible: "Pull request: pull request #128.*"
    times: 8
    commands:
      - swipe:
          start: 85%, 70%
          end: 85%, 35%
      - waitForAnimationToEnd
- tapOn:
    text: "Pull request: pull request #128.*"
    point: "130, 12"
- extendedWaitUntil:
    visible: "Ready to merge"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: pull-request-from-chip
# One whose checks failed: the failure first, a check still running, and
# changes asked for, with no merge to press.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      agent: 5ebf7192-3a6c-4d84-8fac-6b7c8d9eafb5
      pullRequest: "127"
- extendedWaitUntil:
    visible: "Expire an invite after seven days.*"
    timeout: 30000
- assertVisible: "Changes requested"
- waitForAnimationToEnd
- takeScreenshot: pull-request-failing
# Its Checks row sums them up, the failure first, and pushes their list,
# each check where it stands and how long it ran; Back returns to the page.
- assertVisible: "Checks.*"
- runFlow:
    file: subflows/open-row.yaml
    env:
      ROW: "Checks.*"
- extendedWaitUntil:
    visible: "e2e.*"
    timeout: 30000
- assertVisible: "test.*"
- waitForAnimationToEnd
- takeScreenshot: pull-request-checks
- tapOn:
    id: "BackButton"
- extendedWaitUntil:
    visible: "Changes requested"
    timeout: 10000
# Its state chip offers what may change where it stands, as the panel's
# pill does: Convert to draft, and Close pull request in red. Each lands on
# the chip; Close, which can be taken back, acts at once and says so in the
# app's notice, whose Undo reopens it. The bar's ⋯ offers the same changes.
- tapOn: "Pull request, Open"
- assertVisible: "Convert to draft"
- assertVisible: "Close pull request"
- takeScreenshot: pull-request-state-menu
- tapOn: "Convert to draft"
- extendedWaitUntil:
    visible: "Pull request, Draft"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: pull-request-drafted
- tapOn: "Pull request, Draft"
- assertVisible: "Ready for review"
- takeScreenshot: pull-request-state-menu-draft
- tapOn: "Ready for review"
- extendedWaitUntil:
    visible: "Pull request, Open"
    timeout: 30000
- runFlow:
    file: subflows/more.yaml
- assertVisible: "Convert to draft"
- tapOn: "Close pull request"
- extendedWaitUntil:
    visible: "Pull request closed"
    timeout: 30000
- assertVisible: "Pull request, Closed"
- waitForAnimationToEnd
- takeScreenshot: pull-request-closed
- tapOn:
    id: "failure-notice-undo"
- extendedWaitUntil:
    visible: "Pull request, Open"
    timeout: 30000
# One in the merge queue: Remove from queue asks first, with what leaving
# costs the pull requests behind it, and once out it offers Merge when ready.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      agent: 5ebf7192-3a6c-4d84-8fac-6b7c8d9eafb5
      pullRequest: "126"
- extendedWaitUntil:
    visible: "Queued #2"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: pull-request-queued
# Its state chip offers Close alone, since a queued pull request cannot
# turn back to a draft, and Close asks first, since reopening does not queue
# it again.
- tapOn: "Pull request, Queued #2"
- assertNotVisible: "Convert to draft"
- tapOn: "Close pull request"
- assertVisible: "Close this pull request?"
- waitForAnimationToEnd
- takeScreenshot: pull-request-close-queued
- runFlow:
    file: subflows/dismiss-ask.yaml
    env:
      QUESTION: "Close this pull request?"
- assertVisible: "Queued #2"
- tapOn: "Remove from queue"
- assertVisible: "Remove from the merge queue?"
- waitForAnimationToEnd
- takeScreenshot: pull-request-dequeue
- tapOn:
    text: "Remove from queue"
    below: "Remove from the merge queue?"
- extendedWaitUntil:
    notVisible: "Queued #2"
    timeout: 30000
- assertVisible: "Merge when ready"
- waitForAnimationToEnd
- takeScreenshot: pull-request-dequeued
- scrollUntilVisible:
    element: "Send the invite email from the workspace.*"
    direction: UP
# Its diff and comments open on GitHub, from the bar's menu, the last "More"
# on screen where an iPad's overflow stands open with the menu inside it.
# Note that a compact window's one "More" is tapped by name alone, since a
# negative index found none on the Mac's iOS 26.5 simulator.
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - tapOn: "More"
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - tapOn:
          text: "More"
          index: -1
- assertVisible: "Open on GitHub"
- waitForAnimationToEnd
- takeScreenshot: pull-request-menu
# Note that the flow waits for the system's "Return to Vespin" in the
# status bar, which stands once Safari is in front, because the app's own
# words stay in the tree Maestro reads while Safari draws its first page.
- tapOn: "Open on GitHub"
- extendedWaitUntil:
    visible: "Return to Vespin"
    timeout: 30000
- takeScreenshot: pull-request-github
