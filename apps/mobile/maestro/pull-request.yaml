# pull-request.yaml -- a pull request's screen: reached from its card on the agent's page, whose Merge asks first; green and ready, reviewed from Review beside its title, its title edited from a tap on it, then merged from the press under its heading after the question; reached from its task's Overview, by its agent's row and by its chip; one whose checks failed, its Checks row opening their list, its review opened whole in its conversation and reacted to from its long press, its thread replied to on its own screen and resolved and reopened from its long press, a new comment's field opened, turned to a draft and back from its state chip, its ⋯ holding only the GitHub link's acts, then closed from its state chip, with Undo reopening it; its Description and Conversation folded under their headings and opened again; its chapters opened from their row, and on one that has none, generated; and one in the merge queue, its long description folded behind Show more, whose Close from its state chip asks first, taken out of it after the question, and opened on GitHub.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
# Launched on the host's Inbox fixture, whose invitations agent opened three
# pull requests (`@repo/host/fixture-inbox`'s `FIXTURE_PULL_REQUEST`): #128
# green and ready, #127 with a check failed, and #126 second in the merge
# queue. A change is answered by the fixture as GitHub would take it and
# moves the pull request on the document; nothing reaches a server.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      agent: 5ebf7192-3a6c-4d84-8fac-6b7c8d9eafb5
# Note that each launch waits up to half a minute for its first words,
# because a loaded runner has taken longer than Maestro's own wait to bring
# the app to the front.
- extendedWaitUntil:
    visible: "Add a way to resend an invite that expired."
    timeout: 30000
# The card offers Merge beside Review, which asks first. Note that the
# transcript is dragged at three quarters across the screen rather than at
# its center, which on a landscape iPad is the list column beside it, and
# until the words the card's row follows are in sight rather than Merge,
# because a landscape iPad opens with the card under the top bar, where
# Merge reads as visible but takes no tap.
- repeat:
    while:
      notVisible: "The dialog takes an address and a role.*"
    times: 10
    commands:
      - swipe:
          start: "75%, 35%"
          end: "75%, 75%"
          duration: 400
- waitForAnimationToEnd
# Note that the drag that brings the words into sight can leave the card
# mid-list with its Merge under the dock's chips and composer, which take
# its tap, so where Merge stands below the dock's Approval the transcript is
# lifted once by a quarter of the screen, which stands the card above them.
- runFlow:
    when:
      visible:
        text: "Merge"
        below: "Approval"
    commands:
      - swipe:
          start: "75%, 60%"
          end: "75%, 35%"
          duration: 400
      - waitForAnimationToEnd
- takeScreenshot: pull-request-card
# Note that the card's Merge is found below the words its row follows,
# because while the transcript lays out its rows a fresh row can stand
# at the top of the tree for a moment, and on a 26.5 iPad the tap went
# there, past the card; the words' row ends that moment.
- tapOn:
    text: "Merge"
    below: "The dialog takes an address and a role.*"
- assertVisible: "Merge this pull request?"
- waitForAnimationToEnd
- takeScreenshot: pull-request-card-merge
- runFlow:
    file: subflows/dismiss-ask.yaml
    env:
      QUESTION: "Merge this pull request?"
- waitForAnimationToEnd
# The card opens the pull request's own screen: green, approved, ready.
- tapOn: "#128 Invite a teammate by email.*"
- extendedWaitUntil:
    visible: "Ready to merge"
    timeout: 30000
# Its description, as its agent wrote it, under the heading.
- assertVisible: "Adds Invite by email.*"
- waitForAnimationToEnd
- takeScreenshot: pull-request-ready
# The Description folds under its heading, as the panel's does: a tap on
# the heading folds it away, its chevron turning, and a second opens it.
- tapOn: "Description"
- extendedWaitUntil:
    notVisible: "Adds Invite by email.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: pull-request-description-section-folded
- tapOn: "Description"
- extendedWaitUntil:
    visible: "Adds Invite by email.*"
    timeout: 10000
# Its Chapters row, between Checks and Files changed as the panel's tabs
# stand, counts them and pushes them: each chapter in reading order under
# its place and title, with its summary, its risk, what to review, and its
# files, "Other changes" last, and the model that told them at the foot.
- runFlow:
    file: subflows/open-row.yaml
    env:
      ROW: "Chapters.*"
- extendedWaitUntil:
    visible: ".*Resend an expired invitation"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: pull-request-chapters
- scrollUntilVisible:
    element: "Chapters by Haiku 5.5"
    direction: DOWN
- waitForAnimationToEnd
- takeScreenshot: pull-request-chapters-end
# Note that Back finds the page still scrolled to the Chapters row, its
# title under the bar, so it waits on the description beside the row and
# then scrolls the title back.
- tapOn:
    id: "BackButton"
- extendedWaitUntil:
    visible: "Adds Invite by email.*"
    timeout: 10000
- scrollUntilVisible:
    element: "Invite a teammate by email #128"
    direction: UP
# Review stands beside its title, as the panel's phone stands it, and opens
# the member's review on a screen of its own: what it says in the capsule
# at the field's foot (Comment, Approve, Request changes), sent on GitHub as
# the member. Approve, sent, closes the screen.
- tapOn: "Review"
- extendedWaitUntil:
    visible: "Finish your review"
    timeout: 10000
# The fixture's member holds one pending comment on it, which the review
# lists and publishes with it.
- assertVisible: "Could this also check the new expiry?"
- waitForAnimationToEnd
- takeScreenshot: pull-request-review-open
- tapOn: "Comment"
- tapOn: "Approve"
- waitForAnimationToEnd
- takeScreenshot: pull-request-review-approve
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Ready to merge"
    timeout: 30000
# Its title is edited where it stands: a tap on it opens the system's name
# alert, as a task is renamed, and Save keeps the words, which the heading
# draws at once and keeps once GitHub took them.
- tapOn: "Invite a teammate by email #128"
- assertVisible: "Edit title"
- waitForAnimationToEnd
- takeScreenshot: pull-request-title-edit
- eraseText
- inputText: "Invite teammates by email"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Invite teammates by email #128"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: pull-request-title-edited
# Its reviewers stand as faces in its heading after who opened it, as the
# panel's people line draws them, each wearing where they stand at its
# corner, heard as one element; the page holds no Reviews section.
- assertVisible: "Reviewers"
- assertNotVisible: "Reviews.*"
- waitForAnimationToEnd
- takeScreenshot: pull-request-reviewers
# A press on the faces opens the system's menu of every reviewer, by name
# and where they stand, as the panel's faces reveal those past their count;
# a press on one closes it, since it only names them.
# Note that a menu's act reads its name and its standing as one label
# ("grace, Approved"), so each is matched by both, which no other row reads.
- tapOn: "Reviewers"
- assertVisible: "relay-review.*Commented"
- assertVisible: "grace.*Approved"
- waitForAnimationToEnd
- takeScreenshot: pull-request-reviewers-menu
- tapOn: "grace.*Approved"
- waitForAnimationToEnd
# Merging is the press under the heading, in every window, and it asks
# first, as the card's Merge does, with the page dragged to its top.
# Note that it is dragged back to the page's top every time, rather than
# while the press reads as not visible, because the tree can still name the
# press in an old place while the list glides, and the tap went there. The list is then let settle,
# since a tap on a list still gliding only stops it and presses nothing.
- swipe:
    start: "75%, 35%"
    end: "75%, 75%"
    duration: 400
- swipe:
    start: "75%, 35%"
    end: "75%, 75%"
    duration: 400
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Squash and merge"
    timeout: 10000
- tapOn: "Squash and merge"
- assertVisible: "Merge this pull request?"
- waitForAnimationToEnd
- takeScreenshot: pull-request-merge-ask
- tapOn:
    text: "Squash and merge"
    below: "Merge this pull request?"
- extendedWaitUntil:
    visible: "Merged"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: pull-request-merged
# A task's Overview opens it on the same screen rather than on GitHub: by the
# number on its agent's row, and by the chip its description names it with.
# Note that each is reached from a fresh launch, since iOS offers Maestro no
# back press.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- tapOn: "Teammate invitations"
- assertVisible: "Agents"
# A tap on the agent's row, one element with its pull request's number in
# its line, opens the agent, never the pull request.
- tapOn: "Build teammate invitations"
- extendedWaitUntil:
    visible: "Add a way to resend an invite that expired."
    timeout: 30000
- assertNotVisible: "Ready to merge"
- tapOn:
    text: "Back"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Agents"
# The pull request opens from the row's long-press menu, its item matched with
# or without the subtitle iPadOS 27 adds to its label.
- runFlow:
    file: subflows/row-menu.yaml
    env:
      ROW: Build teammate invitations
      ITEM: "Open pull request(, .*)?"
- tapOn: "Open pull request(, .*)?"
- extendedWaitUntil:
    visible: "Ready to merge"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: pull-request-from-agent-row
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- tapOn: "Teammate invitations"
# Note that iOS never hears a chip as an element of its own, since it stands
# in its line as a view, so the line is found by what it is heard as
# (`heardLine`), "Pull request: pull request #128", the chip named by its
# key alone, and pressed where the chip stands: 130 pt from the line's
# leading edge, just past "Pull request:" in the body style, the same on an
# iPhone's line and an iPad's twice as long, where a share of the line's
# width lands on the words before the chip. Note that the 130 pt holds only
# at the default text size, since "Pull request:" grows with Dynamic Type:
# this flow launches at the reader's default, and the AX lanes
# (`accessibility.yaml`, `accessibility-ax3.yaml`) never tap the chip, so a
# lane that does must find its own place for it. Note that the page
# is swiped at its right side rather than scrolled from the screen's center,
# since a landscape iPad's center falls in the list column beside the task,
# which never holds the chip.
- repeat:
    while:
      notVisible: "Pull request: pull request #128.*"
    times: 8
    commands:
      - swipe:
          start: 85%, 70%
          end: 85%, 35%
      - waitForAnimationToEnd
- tapOn:
    text: "Pull request: pull request #128.*"
    point: "130, 12"
- extendedWaitUntil:
    visible: "Ready to merge"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: pull-request-from-chip
# One whose checks failed: the failure first, a check still running, and
# changes asked for, with no merge to press.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      agent: 5ebf7192-3a6c-4d84-8fac-6b7c8d9eafb5
      pullRequest: "127"
- extendedWaitUntil:
    visible: "Expire an invite after seven days.*"
    timeout: 30000
# Its head says changes were asked for, in GitHub's sentence, its
# reviewers standing as faces beside who opened it.
- assertVisible: "Changes were requested.*"
# Its head says its one review thread still stands unresolved, beside
# GitHub's sentence.
- assertVisible: ".*1 unresolved conversation"
- waitForAnimationToEnd
- takeScreenshot: pull-request-failing
# Its Checks row counts them as the panel's tab does, the failed one by a
# red cross, and pushes their list,
# each check where it stands and how long it ran; Back returns to the page.
- assertVisible: "Checks.*"
- runFlow:
    file: subflows/open-row.yaml
    env:
      ROW: "Checks.*"
- extendedWaitUntil:
    visible: "e2e.*"
    timeout: 30000
- assertVisible: "test.*"
- waitForAnimationToEnd
- takeScreenshot: pull-request-checks
- tapOn:
    id: "BackButton"
- extendedWaitUntil:
    visible: "Changes were requested.*"
    timeout: 10000
# It has no chapters yet: its Chapters page offers Generate, which stands
# as being made until the chapters it told land.
- runFlow:
    file: subflows/open-row.yaml
    env:
      ROW: "Chapters.*"
- extendedWaitUntil:
    visible: "No chapters yet."
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: pull-request-chapters-none
- tapOn: "Generate chapters"
- extendedWaitUntil:
    visible: ".*Resend an expired invitation"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: pull-request-chapters-generated
- tapOn:
    id: "BackButton"
- extendedWaitUntil:
    visible: "Changes were requested.*"
    timeout: 10000
- scrollUntilVisible:
    element: "Expire an invite after seven days.*"
    direction: UP
# Its conversation stands inline under the rows: the review that asked for
# changes, its words a short preview, and the thread it started on a file's
# lines. A press opens each whole, in Markdown, and the page goes back up.
- scrollUntilVisible:
    element: "src/invites/expiry.ts.*"
    direction: DOWN
- waitForAnimationToEnd
- takeScreenshot: pull-request-conversation
# The Conversation folds under its heading too, its count standing, and a
# second tap opens it again.
- tapOn: "Conversation.*"
- extendedWaitUntil:
    notVisible: "src/invites/expiry.ts.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: pull-request-conversation-folded
- tapOn: "Conversation.*"
- extendedWaitUntil:
    visible: "src/invites/expiry.ts.*"
    timeout: 10000
- tapOn:
    text: "grace"
    below: "Conversation.*"
- extendedWaitUntil:
    visible: ".*Treat the seventh day as still open.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: pull-request-conversation-open
# A long press on the review offers Add reaction, GitHub's eight, its
# thumbs up standing under its words.
- longPressOn:
    text: "grace"
    below: "Conversation.*"
- tapOn: "Add reaction"
- assertVisible: "Heart"
- waitForAnimationToEnd
- takeScreenshot: pull-request-reactions
- tapOn: "Heart"
# The thread opens on a screen of its own, its comments as a thread's and
# the reply field at its foot, whose send clears it once GitHub took it.
- tapOn: "src/invites/expiry.ts.*"
- extendedWaitUntil:
    visible: ".*Good catch, it takes the request's time now.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: pull-request-thread
# A long press on one of its comments offers Add reaction beside Copy.
- longPressOn: ".*Good catch, it takes the request's time now.*"
- tapOn: "Add reaction"
- assertVisible: "Rocket"
- waitForAnimationToEnd
- takeScreenshot: pull-request-thread-reactions
- tapOn: "Rocket"
- tapOn: "Reply"
- inputText: "Thanks, that reads right now."
- tapOn: "Send"
- extendedWaitUntil:
    notVisible: "Thanks, that reads right now."
    timeout: 10000
- tapOn:
    id: "BackButton"
- scrollUntilVisible:
    element: "src/invites/expiry.ts.*"
    direction: DOWN
# A long press on the thread offers Resolve, which stands it resolved and
# takes it out of the head's unresolved count; Reopen stands it open again,
# and the head counts it once more.
- longPressOn: "src/invites/expiry.ts.*"
- tapOn: "Resolve"
- waitForAnimationToEnd
- takeScreenshot: pull-request-thread-resolved
- scrollUntilVisible:
    element: "Expire an invite after seven days.*"
    direction: UP
- extendedWaitUntil:
    notVisible: ".*unresolved conversation.*"
    timeout: 10000
- scrollUntilVisible:
    element: "src/invites/expiry.ts.*"
    direction: DOWN
- longPressOn: "src/invites/expiry.ts.*"
- tapOn: "Reopen"
- scrollUntilVisible:
    element: "Expire an invite after seven days.*"
    direction: UP
- extendedWaitUntil:
    visible: ".*1 unresolved conversation"
    timeout: 10000
# The conversation ends in Comment, which opens a new comment's field.
- scrollUntilVisible:
    element: "Comment"
    direction: DOWN
- tapOn: "Comment"
- assertVisible: "Comment"
- waitForAnimationToEnd
- takeScreenshot: pull-request-new-comment
- tapOn:
    id: "BackButton"
- scrollUntilVisible:
    element: "Expire an invite after seven days.*"
    direction: UP
# Note that the page is then dragged to its top and let settle before its
# state chip is tapped, as the merge's press is, because a scroll up stops
# once the title peeks in under the bar, and a tap there, or on a list
# still gliding, scrolls the page or stops it and opens no menu.
- swipe:
    start: "75%, 35%"
    end: "75%, 75%"
    duration: 400
- swipe:
    start: "75%, 35%"
    end: "75%, 75%"
    duration: 400
- waitForAnimationToEnd
# Its state chip offers what may change where it stands, as the panel's
# pill does: Convert to draft, and Close pull request in red. Each lands on
# the chip; Close, which can be taken back, acts at once and says so in the
# app's notice, whose Undo reopens it. The bar's ⋯ repeats none of them, as
# the panel's toolbar ⋯ doesn't.
- tapOn: "Pull request, Open"
- assertVisible: "Convert to draft"
- assertVisible: "Close pull request"
- takeScreenshot: pull-request-state-menu
- tapOn: "Convert to draft"
- extendedWaitUntil:
    visible: "Pull request, Draft"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: pull-request-drafted
- tapOn: "Pull request, Draft"
- assertVisible: "Ready for review"
- takeScreenshot: pull-request-state-menu-draft
- tapOn: "Ready for review"
- extendedWaitUntil:
    visible: "Pull request, Open"
    timeout: 30000
- runFlow:
    file: subflows/more.yaml
- assertVisible: "Open on GitHub"
- assertNotVisible: "Convert to draft"
- assertNotVisible: "Edit title"
- waitForAnimationToEnd
- takeScreenshot: pull-request-more-menu
# Note that the menu is closed by its own Copy GitHub link, an act that
# changes nothing on the page, rather than a tap off it at a point.
- tapOn: "Copy GitHub link"
- waitForAnimationToEnd
- tapOn: "Pull request, Open"
- tapOn: "Close pull request"
- extendedWaitUntil:
    visible: "Pull request closed"
    timeout: 30000
- assertVisible: "Pull request, Closed"
- waitForAnimationToEnd
- takeScreenshot: pull-request-closed
- tapOn:
    id: "failure-notice-undo"
- extendedWaitUntil:
    visible: "Pull request, Open"
    timeout: 30000
# One in the merge queue: Remove from queue asks first, with what leaving
# costs the pull requests behind it, and once out it offers Merge when ready.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      agent: 5ebf7192-3a6c-4d84-8fac-6b7c8d9eafb5
      pullRequest: "126"
- extendedWaitUntil:
    visible: "Queued #2"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: pull-request-queued
# Its state chip offers Close alone, since a queued pull request cannot
# turn back to a draft, and Close asks first, since reopening does not queue
# it again.
- tapOn: "Pull request, Queued #2"
- assertNotVisible: "Convert to draft"
- tapOn: "Close pull request"
- assertVisible: "Close this pull request?"
- waitForAnimationToEnd
- takeScreenshot: pull-request-close-queued
- runFlow:
    file: subflows/dismiss-ask.yaml
    env:
      QUESTION: "Close this pull request?"
- assertVisible: "Queued #2"
- tapOn: "Remove from queue"
- assertVisible: "Remove from the merge queue?"
- waitForAnimationToEnd
- takeScreenshot: pull-request-dequeue
- tapOn:
    text: "Remove from queue"
    below: "Remove from the merge queue?"
- extendedWaitUntil:
    notVisible: "Queued #2"
    timeout: 30000
- assertVisible: "Merge when ready"
- waitForAnimationToEnd
- takeScreenshot: pull-request-dequeued
# Its long description stands folded to its first lines, faded at its foot,
# and Show more opens it whole, then Show less folds it again.
- scrollUntilVisible:
    element: "Show more"
    direction: DOWN
- waitForAnimationToEnd
- takeScreenshot: pull-request-description-folded
- tapOn: "Show more"
- scrollUntilVisible:
    element: "Show the sender in Settings.*"
    direction: DOWN
- assertVisible: "Show less"
- waitForAnimationToEnd
- takeScreenshot: pull-request-description-open
- scrollUntilVisible:
    element: "Send the invite email from the workspace.*"
    direction: UP
# Its diff and comments open on GitHub, from the bar's menu, the last "More"
# on screen where an iPad's overflow stands open with the menu inside it.
# Note that a compact window's one "More" is tapped by name alone, since a
# negative index found none on the Mac's iOS 26.5 simulator.
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - tapOn: "More"
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - tapOn:
          text: "More"
          index: -1
- assertVisible: "Open on GitHub"
- waitForAnimationToEnd
- takeScreenshot: pull-request-menu
# Note that the flow waits for the system's "Return to Vespin" in the
# status bar, which stands once Safari is in front, because the app's own
# words stay in the tree Maestro reads while Safari draws its first page.
- tapOn: "Open on GitHub"
- extendedWaitUntil:
    visible: "Return to Vespin"
    timeout: 30000
- takeScreenshot: pull-request-github
