# settings-cloud-environment.yaml -- Settings › Cloud environment on the Inbox fixture: the workspace's sandbox size, its variables by name with who changed each, its install and setup scripts read whole, and Add variable's value sheet, opened and canceled.
#
# Launched on the host's Inbox fixture, whose workspace's cloud environment
# is staged (`@repo/host/fixture-inbox`'s `CLOUD_ENVIRONMENT`), so no server
# is reached.
appId: dev.vespin.ios
---
- launchApp:
    clearState: true
    arguments:
      fixture: "inbox"
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- runFlow:
    file: subflows/switcher.yaml
- tapOn: "Settings(, .*)?"
- waitForAnimationToEnd
- tapOn:
    id: "settings-cloud-environment"
- waitForAnimationToEnd
- assertVisible: "Sandbox"
- assertVisible: "Variables"
- assertVisible: "DATABASE_URL"
- takeScreenshot: settings-cloud-environment
- scrollUntilVisible:
    element: "Setup scripts"
- assertVisible: "Install software"
- assertVisible: "ada/relay"
- takeScreenshot: settings-cloud-environment-scripts
- scrollUntilVisible:
    element: "Variables"
    direction: UP
- tapOn: "Add variable"
- inputText: "SENTRY_DSN"
- tapOn: "Next"
- waitForAnimationToEnd
- assertVisible: "SENTRY_DSN"
- assertVisible:
    id: "variable-value-field"
- takeScreenshot: settings-cloud-environment-value
- tapOn: "Cancel"
- waitForAnimationToEnd
- assertVisible: "Variables"
