# scroll-to.yaml -- scrolls the page until `ELEMENT` stands in its middle, down unless `DIRECTION` is UP, and lets it settle.
#
# Note that the element is centered, because a scroll that stops once it
# shows leaves it at the window's edge: under a thread's reply box and the
# tab bar going down, where a tap lands on them instead, and under the bar
# and the status bar going up, where a tap scrolls the page to its top. A row
# at a list's end cannot be centered, since the list scrolls no further, so a
# row is reached through `open-row.yaml` or `row-menu.yaml`. Each swipe
# waits at most a second for the page to hold still, because an agent's page
# draws its turn still running, whose mark never stops moving, so a wait to
# its end took four seconds a swipe and ran a scroll out of time on a loaded
# runner.
appId: dev.vespin.ios
env:
  DIRECTION: ${DIRECTION || 'DOWN'}
---
- runFlow:
    when:
      true: ${DIRECTION == 'UP'}
    commands:
      - scrollUntilVisible:
          element: "${ELEMENT}"
          direction: UP
          centerElement: true
          waitToSettleTimeoutMs: 1000
- runFlow:
    when:
      true: ${DIRECTION != 'UP'}
    commands:
      - scrollUntilVisible:
          element: "${ELEMENT}"
          direction: DOWN
          centerElement: true
          waitToSettleTimeoutMs: 1000
- waitForAnimationToEnd:
    timeout: 5000
