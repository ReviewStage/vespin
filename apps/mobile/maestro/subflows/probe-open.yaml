# probe-open.yaml -- for measurement only, never merged: scrolls the row `ROW` names into the middle of the screen and opens it, at any text size.
appId: dev.vespin.ios
---
- scrollUntilVisible:
    element: "${ROW}"
    direction: DOWN
    visibilityPercentage: 40
    centerElement: true
    timeout: 45000
- waitForAnimationToEnd
- tapOn: "${ROW}"
