# tab.yaml -- opens the place `TAB` names (Inbox, Tasks, Automations, or Search): by its tab's id, which the iPhone's tab bar carries, or on an iPad by its row in the sidebar, as a reader picks it, the sidebar shown first where it is hidden.
#
# Note that a tab is never tapped by its name alone where an id stands,
# because a list's title and a back button share the name and come first in
# the tree: a tap meant for the Tasks tab lands on the Tasks list's title.
# Note too that the way is chosen by the device, `FLOATING_TABS` that
# `scripts/simulator-screenshots.sh` sets for an iPad, which stands no tabs
# but the places of its sidebar, the first column of its split view, rather than by
# whether the id stands on screen, because the tab bar draws seconds after a
# cold launch and is out of the tree while a sheet goes, so a check of the
# screen found neither way and tapped nothing. Each way waits for its tab
# up to half a minute, as long as a loaded runner's cold launch has taken.
# On an iPhone, a page scrolled down collapses the tab bar to its current
# tab alone, heard as "Collapsed" and with no id, and a page pushed over a
# tab's list hides the bar, so until the tab's id stands a collapsed bar is
# pressed to stand its tabs again and a pushed page is gone back from, as a
# person would. Note that the bar is never waited for by its own name, "Tab
# Bar", because a wide window, the iPhone Duo's, draws the tabs as a rail
# that carries their ids but no such name.
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - repeat:
          times: 10
          while:
            notVisible:
              id: "${TAB.toLowerCase()}-tab"
          commands:
            - runFlow:
                when:
                  visible: "Collapsed"
                commands:
                  - tapOn: "Collapsed"
            - runFlow:
                when:
                  visible:
                    id: "BackButton"
                  notVisible:
                    id: "${TAB.toLowerCase()}-tab"
                commands:
                  - tapOn:
                      id: "BackButton"
            - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "${TAB.toLowerCase()}-tab"
          timeout: 30000
      - tapOn:
          id: "${TAB.toLowerCase()}-tab"
# Note that on an iPad the place already standing is left as it stands,
# known by its list's title, because a pick of the place already picked is
# no change of the sidebar's selection, which SwiftUI reports nothing of, so
# an upright window's sidebar, shown to pick it, stood over the list after it
# (vjipadmain's failure-notice lane). The title is found by its bar's
# identifier, which iOS sets to the title, never by the words alone, because
# a list's search field heads with a magnifying glass heard as "Search",
# which stood for the Search place on the Tasks list (managers.yaml, jp10991).
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - extendedWaitUntil:
          visible: "(Show|Hide) Sidebar"
          timeout: 30000
      - waitForAnimationToEnd
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
      notVisible:
        id: "${TAB}"
    commands:
      - runFlow:
          file: show-sidebar.yaml
      - extendedWaitUntil:
          visible:
            id: "place-row"
            text: "${TAB}"
          timeout: 30000
      - tapOn:
          id: "place-row"
          text: "${TAB}"
# A window wide enough stands its sidebar beside the list, the place's row
# among the names on screen, so there the row is picked as it stands.
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
      visible:
        id: "place-row"
        text: "${TAB}"
    commands:
      - tapOn:
          id: "place-row"
          text: "${TAB}"
- waitForAnimationToEnd
