# tab.yaml -- opens the tab `TAB` names (Inbox, Tasks, or Search): by its id, which the iPhone's tab bar and the app sidebar carry, or on an iPad by its name, last in the tree, in its floating bar, which carries no id.
#
# Note that a tab is never tapped by its name alone where an id stands,
# because a list's title and a back button share the name and come first in
# the tree: a tap meant for the Tasks tab lands on the Tasks list's title.
# Note too that the way is chosen by the device, `FLOATING_TABS` that
# `scripts/simulator-screenshots.sh` sets for an iPad, rather than by
# whether the id stands on screen, because the tab bar draws seconds after a
# cold launch and is out of the tree while a sheet goes, so a check of the
# screen found neither way and tapped nothing. Each way waits for its tab
# up to half a minute, as long as a loaded runner's cold launch has taken.
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - extendedWaitUntil:
          visible:
            id: "${TAB.toLowerCase()}-tab"
          timeout: 30000
      - tapOn:
          id: "${TAB.toLowerCase()}-tab"
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - extendedWaitUntil:
          visible: "${TAB}"
          timeout: 30000
      - tapOn:
          text: "${TAB}"
          index: -1
- waitForAnimationToEnd
