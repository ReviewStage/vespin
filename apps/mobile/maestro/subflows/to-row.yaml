# to-row.yaml -- scrolls the list down to the row `ROW` names and lets it settle, clear of the tab bar; a row above is scrolled back to first.
#
# Note that an iPad's list is a column down the window's leading third,
# beside the page it opens, and Maestro's scroll swipes at the window's
# middle, on that page, which never moves the list, so there the column
# itself is drawn up in slow steps until the row shows. The way is chosen by
# the device, `FLOATING_TABS` naming an iPad, as `tab.yaml`'s is.
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - scrollUntilVisible:
          element: "${ROW}"
          direction: DOWN
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - repeat:
          times: 20
          while:
            notVisible: "${ROW}"
          commands:
            - swipe:
                start: "15%, 75%"
                end: "15%, 45%"
                duration: 1200
      - assertVisible: "${ROW}"
- runFlow:
    file: clear-of-tabs.yaml
