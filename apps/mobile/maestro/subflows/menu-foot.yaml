# menu-foot.yaml -- scrolls a task row's long press menu to its foot on an iPad, where Permanently delete stands.
#
# Note that this works around an app problem rather than hiding it: since
# the row menu took the panel's order (#10104) it is too long for an iPad,
# so the system stands it beside the row's preview clipped at Unpin, and
# Follow, Move to, Repository, and Permanently delete are reached only by
# scrolling inside it, which nothing on screen hints at (jnat10310's
# `tasks-row-menu` frame, Nov 21). Maestro's tree calls the acts below the
# clip visible, so `scrollUntilVisible` scrolls nothing and a tap on
# Permanently delete lands off the menu, which closes it unasked. So the menu is dragged up from its Assignee, which
# every task's menu holds above the fold. Note that a compact window is
# left alone, because its menu scrolls with the window, which
# `scrollUntilVisible` moves, and a drag over a menu that does not scroll
# picks the act it ends on.
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - swipe:
          from: "Assignee"
          direction: UP
          duration: 900
      - waitForAnimationToEnd
