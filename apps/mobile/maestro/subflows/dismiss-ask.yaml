# dismiss-ask.yaml -- puts a confirmation away without its act, and requires its question gone: on an iPhone a tap off its action sheet, and on an iPad its alert's Cancel.
#
# Note that iOS 26 draws a compact window's confirmation as an action sheet
# anchored at the screen's foot with no Cancel, a tap off it cancelling, while
# a regular window's alert keeps its Cancel. The tap off the sheet goes first,
# only where no Cancel stands, so an iPad's alert is never tapped through.
# `QUESTION` is the confirmation's title as the flow asserted it.
appId: dev.vespin.ios
env:
  QUESTION: ${QUESTION}
---
- runFlow:
    when:
      notVisible: "Cancel"
    commands:
      - tapOn:
          point: "50%, 20%"
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- waitForAnimationToEnd
- assertNotVisible: "${QUESTION}"
