# open-row.yaml -- scrolls down to the row `ROW` names, lets the list settle, and opens it; a row above is scrolled back to first.
#
# Note that the row is moved clear of the tab bar (`clear-of-tabs.yaml`),
# and the list let settle, before the tap, because a scroll leaves the row
# under the bar and a list still gliding takes a tap as a stop rather than a
# pick.
appId: dev.vespin.ios
---
- scrollUntilVisible:
    element: "${ROW}"
    direction: DOWN
- runFlow:
    file: clear-of-tabs.yaml
- tapOn: "${ROW}"
