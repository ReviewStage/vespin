# settings-integrations.yaml -- Settings › Integrations on the Inbox fixture: the account's servers under Connected and Not connected, two accounts at one provider named apart, an expired one's page offering Reconnect, and a connection's page asking Disconnect first, canceled.
#
# Launched on the host's Inbox fixture, whose account holds Linear, two
# Notion accounts, and an expired Sentry (`@repo/host/fixture-inbox`), so no
# server is reached and no sign-in opens.
appId: dev.vespin.ios
---
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- runFlow:
    file: subflows/switcher.yaml
- tapOn: "Settings(, .*)?"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Integrations"
- tapOn: "Integrations"
- waitForAnimationToEnd
- assertVisible: "Connected"
- assertVisible: "Not connected"
- assertVisible: "Notion · Relay"
- takeScreenshot: settings-integrations
# The expired Sentry opens its own page, which leads with Reconnect.
- tapOn: "Sentry"
- waitForAnimationToEnd
- assertVisible: "Sign-in expired"
- assertVisible: "Reconnect"
- takeScreenshot: settings-integration-expired
- tapOn:
    id: "BackButton"
- waitForAnimationToEnd
# A connected account's page closes with Disconnect, which asks first.
- tapOn: "Linear"
- waitForAnimationToEnd
- assertVisible: "Connected"
- scrollUntilVisible:
    element: "Disconnect"
- tapOn: "Disconnect"
- assertVisible: "Disconnect Linear?"
- waitForAnimationToEnd
- takeScreenshot: settings-integrations-disconnect
- runFlow:
    file: subflows/dismiss-ask.yaml
    env:
      QUESTION: "Disconnect Linear?"
