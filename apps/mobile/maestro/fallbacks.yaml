# fallbacks.yaml -- BEFORE (throwaway: main plus the fixture, asserting only what main draws). what a build draws where it knows no better, each readable rather than blank: another agent's message of its head alone as its sender with no empty bubble, words that are only a link's definition as written, a set shown whose picture was not kept standing in its place, a call in a state this build does not know settled rather than spinning, a call given and answering nothing saying No output once opened, and a thread's ask of a type this build does not know saying to answer it in a newer Vespin.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
#
# Note that an iPad stands in landscape, where the transcript stands in the
# detail column beside the list, so it is scrolled well inside that column
# (`BESIDE`), and that the window is turned back upright however the flow
# ends, because a run left in landscape fails every flow after it.
appId: dev.vespin.ios
onFlowComplete:
  - setOrientation: PORTRAIT
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
# Launched on the host's Inbox fixture, whose fallbacks agent finished one
# turn of what a build draws by a fallback, then heard from another agent
# (`@repo/host/fixture-fallbacks-agent`), and opened on its page by
# `-agent <id>`; nothing reaches a server.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      agent: 3b9e6f12-7c4d-4a85-b1e0-9d2c8f4a6e17
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - setOrientation: LANDSCAPE_LEFT
# Note that the launch waits up to half a minute for its first words, as
# `agent.yaml`'s does.
- extendedWaitUntil:
    visible: "The labels are tidy, and the export reads them in one place now."
    timeout: 30000
# Another agent's message of its head alone stands as its sender's name,
# with no empty bubble under it.
- assertVisible: "Weekly digest email"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: fallbacks-message
# Words that are only a link's definition stand as written, and the set
# shown whose picture was not kept stands in its place, its caption under it.
# The turn's calls stand settled, the one in a state this build does not
# know among them, so its fold turns no spinner; opened, the call given and
# answering nothing says so. Note that the fold is drawn on clear under the
# agent's name in the bar before its tap, as `agent.yaml` draws its fold.
- runFlow:
    file: subflows/scroll-in.yaml
    env:
      ELEMENT: ".*tool calls.*"
      DIRECTION: UP
      BESIDE: ${FLOATING_TABS}
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: ".*tool calls.*"
      BELOW: "Tidy the ledger's labels"
      BESIDE: ${FLOATING_TABS}
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: fallbacks-shown
- tapOn: ".*tool calls.*"
- tapOn: ".*sync_labels.*"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: fallbacks-calls
# A thread whose open ask is of a type this build does not know says to
# answer it in a newer Vespin, where the ask stood as nothing, and its box
# still replies. Note that the thread is the Inbox's oldest, so it is
# scrolled to rather than to the list's middle.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible: "Who can withdraw an invite?"
    timeout: 30000
- runFlow:
    file: subflows/open-row.yaml
    env:
      ROW: "Which currencies round first\\?"
- extendedWaitUntil:
    visible: "Three currencies settle on the same day.*"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: fallbacks-newer-ask
