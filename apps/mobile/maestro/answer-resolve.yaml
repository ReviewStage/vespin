# answer-resolve.yaml -- an open ask resolved without an answer from the × at its controls' top end in the box, as the panel's question wears it: the thread settles as resolved, its controls gone from the box and its options stepped back on their message, and nothing sent as an answer.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
---
# Launched on the host's Inbox fixture, as `answer.yaml` is, so no server is
# reached: the fixture takes the resolve as the service would.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Who can withdraw an invite?"
    timeout: 30000
- runFlow:
    file: subflows/open-row.yaml
    env:
      ROW: "Who can withdraw an invite\\?"
- assertVisible: "The member who sent it.*"
- assertVisible:
    id: "resolve-ask"
- waitForAnimationToEnd
- takeScreenshot: resolve-ask-open
# Its × resolves the thread at once, with no pick and no words, as the
# panel's does, through the same close as the ⋯'s Resolve.
- tapOn:
    id: "resolve-ask"
- extendedWaitUntil:
    visible: "You resolved this without an answer.*"
    timeout: 5000
# Note that the options stay on their own message, stepped back, as the
# panel's held ask stands, so the box's controls are known gone by the ×.
- assertNotVisible:
    id: "resolve-ask"
- waitForAnimationToEnd
- takeScreenshot: resolve-ask-resolved
