# settings-mcp.yaml -- Settings › Vespin MCP & CLI on the Inbox fixture: the apps the account allowed, each by its name and when it was last active, an app's own page with Disconnect asked first and canceled, and the CLI section's rows that copy its commands.
#
# Launched on the host's Inbox fixture, whose account allowed two apps
# (`@repo/host/fixture-inbox`), so no server is reached.
appId: dev.vespin.ios
---
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- runFlow:
    file: subflows/switcher.yaml
- tapOn: "Settings(, .*)?"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Vespin MCP & CLI"
- tapOn: "Vespin MCP & CLI"
- waitForAnimationToEnd
- assertVisible: "Claude Code"
- assertVisible: "ChatGPT"
- takeScreenshot: settings-mcp
# An app's row opens its own page: where it signs in from, when it was
# allowed and last active, and Disconnect in red, asked first. Note that the
# row is one element, heard as its name and its line, so it's found by its name.
- tapOn: "ChatGPT.*"
- waitForAnimationToEnd
- assertVisible: "Disconnect"
- takeScreenshot: settings-mcp-app
- tapOn: "Disconnect"
- assertVisible: "Disconnect ChatGPT?"
- waitForAnimationToEnd
- takeScreenshot: settings-mcp-disconnect
- runFlow:
    file: subflows/dismiss-ask.yaml
    env:
      QUESTION: "Disconnect ChatGPT?"
- tapOn:
    id: "BackButton"
- waitForAnimationToEnd
# The CLI section under the apps: a row that copies the install's command,
# and one the sign-in's while the command has none, the commands spelled out
# in the section's footer.
- scrollUntilVisible:
    element: "Copy install command"
    centerElement: true
- assertVisible: ".*npm i -g vespin.*"
- takeScreenshot: settings-mcp-cli
