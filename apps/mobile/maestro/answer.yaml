# answer.yaml -- a thread's ask answered from the phone, each kind once: a decide's pick, an unanswered approval standing Not delivered with Retry, Edit and Delete, an answer's fields, a do's steps marked done, an answer in words, a reply, and Resolve.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
---
# Note that Send is pressed only once it stands lit, so words the field
# kept without telling the app fail at the press's step rather than later.
#
# Launched on the host's Inbox fixture, as `inbox.yaml` is, so no server is
# reached: the fixture takes each reply and resolve as the service would, but
# for the migration's approval, which it refuses (`@repo/host/fixture-inbox`).
# Each thread is opened from a fresh launch, so a compact window's pushed
# thread and a regular window's split view are reached the same way, with no
# back button between them. Note that a row is scrolled to rather than to the
# list's middle, because the list's last rows, the expired invite page's and
# the tax rounding's under it, can never stand there.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Who can withdraw an invite?"
    timeout: 30000
- waitForAnimationToEnd
# A decide: the options as a card of rows, the recommended tagged; a
# pick lights Send, which sends it with the note typed, and the thread reads
# it answered at once: the card standing at the head of the reply under
# "You", its pick checked and taking no press, as the panel's answered card.
- runFlow:
    file: subflows/open-row.yaml
    env:
      ROW: "Who can withdraw an invite\\?"
- assertVisible: "The member who sent it"
- waitForAnimationToEnd
- takeScreenshot: answer-decide
- tapOn: "Both, Recommended.*"
- assertVisible: "Add a note"
- takeScreenshot: answer-decide-picked
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Answered"
    timeout: 5000
- assertVisible: "Both, Recommended.*"
- assertVisible: "The member who sent it"
- assertNotVisible: "Add a note"
- waitForAnimationToEnd
- takeScreenshot: answer-decide-sent

# An answer no reply came back for: the approval is drawn answered at once,
# then, as the fixture leaves it unanswered, the card stands open again and
# the answer stays at the thread's foot marked Not delivered, never back on
# the card, as the panel keeps it. Its mark's menu says why, with Retry,
# which goes again under the same key and is left unanswered again, Edit,
# which takes the pick back onto the card, and Delete.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Who can withdraw an invite?"
    timeout: 30000
- runFlow:
    file: subflows/open-row.yaml
    env:
      ROW: "Run the memberships migration on preview\\?"
- assertVisible: "Decline"
- tapOn: "Approve, Recommended.*"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Not delivered.*"
    timeout: 5000
- assertVisible: "Decline"
- waitForAnimationToEnd
- takeScreenshot: answer-refused
- tapOn: "Not delivered.*"
- assertVisible: "Retry"
- assertVisible: "Edit"
- assertVisible: "Delete"
- takeScreenshot: answer-undelivered-menu
- tapOn: "Retry"
- extendedWaitUntil:
    visible: "Not delivered.*"
    timeout: 5000
- tapOn: "Not delivered.*"
- tapOn: "Edit"
- extendedWaitUntil:
    notVisible: "Not delivered.*"
    timeout: 5000
- assertVisible:
    text: "Send"
    enabled: true
- waitForAnimationToEnd
- takeScreenshot: answer-undelivered-edited
# Sent again from the card, it stands Not delivered once more, and Delete
# lets it go.
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Not delivered.*"
    timeout: 5000
- tapOn: "Not delivered.*"
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible: "Not delivered.*"
    timeout: 5000

# An answer's fields: a select's options as rows, its recommended one tagged
# and none picked, a yes or no's checkbox, and a number on the decimal pad;
# Send submits what was filled.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Who can withdraw an invite?"
    timeout: 30000
- runFlow:
    file: subflows/open-row.yaml
    env:
      ROW: "Invite limits"
- assertVisible: "Every member, Recommended"
- waitForAnimationToEnd
- takeScreenshot: answer-fields
- tapOn: "Every member, Recommended"
- tapOn: "Email the sender when an invite is accepted, Optional"
- assertVisible: "Email the sender when an invite is accepted, Optional, ticked"
# The number comes last, since the decimal pad has no key that puts it away:
# the composer rides above it, so Send is pressed with the pad still up.
# Words that read as no number hold the answer back, rather than send it
# without them. At accessibility sizes the card runs taller than the screen and
# stands scrolled to its foot after the toggle, so the field is scrolled back to first.
- scrollUntilVisible:
    element:
      id: "answer-field-Invites a member may send a day"
    direction: UP
- tapOn:
    id: "answer-field-Invites a member may send a day"
- waitForAnimationToEnd
- inputText: "."
- assertVisible:
    text: "Send"
    enabled: true
- tapOn: "Send"
# Note that at accessibility sizes the refusal stands under the tall card, below the keyboard, so it is scrolled to, and the field back to, which a person at that size does too; at the default size both already show.
- scrollUntilVisible:
    element: "Write a number in Invites a member may send a day."
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "answer-field-Invites a member may send a day"
    direction: UP
- tapOn:
    id: "answer-field-Invites a member may send a day"
- eraseText: 1
- inputText: "20"
- assertVisible:
    text: "Send"
    enabled: true
- assertVisible:
    id: "answer-field-Invites a member may send a day"
    text: "20"
- takeScreenshot: answer-fields-filled
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Submitted"
    timeout: 5000
- assertNotVisible: "Every member, Recommended"

# A do: its steps as checkbox rows, one ticked by hand, then Mark done, which
# sends at once with every step ticked.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Who can withdraw an invite?"
    timeout: 30000
- runFlow:
    file: subflows/open-row.yaml
    env:
      ROW: "Verify the digest's sender domain"
- assertVisible: "Mark done"
- tapOn: ".*Add the three DNS records.*"
- assertVisible: ".*your registrar\\., ticked"
- waitForAnimationToEnd
- takeScreenshot: answer-do
- tapOn: "Mark done"
- extendedWaitUntil:
    visible: "Done 3/3"
    timeout: 5000
- assertNotVisible: "Mark done"
- waitForAnimationToEnd
- takeScreenshot: answer-do-sent

# An answer in words: the composer's own words are the answer.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Who can withdraw an invite?"
    timeout: 30000
- runFlow:
    file: subflows/open-row.yaml
    env:
      ROW: "The digest's subject line"
- tapOn:
    id: "composer-field"
- waitForAnimationToEnd
- inputText: "What shipped in Relay this week"
- assertVisible:
    text: "Send"
    enabled: true
- takeScreenshot: answer-words
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Answered"
    timeout: 5000
- assertVisible: "What shipped in Relay this week"
# A drag down the thread puts the keyboard away, as the thread's scroll lets it.
- swipe:
    start: "50%, 30%"
    end: "50%, 60%"
- waitForAnimationToEnd
- takeScreenshot: answer-words-sent

# A reply on a notice, which asks nothing: drawn at the thread's foot at once.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Who can withdraw an invite?"
    timeout: 30000
- runFlow:
    file: subflows/open-row.yaml
    env:
      ROW: "acceptInvite can add a member twice"
- assertVisible: "Reply"
- tapOn:
    id: "composer-field"
- waitForAnimationToEnd
- inputText: "Thanks, one transaction sounds right."
- assertVisible:
    text: "Send"
    enabled: true
- tapOn: "Send"
- assertVisible: "Thanks, one transaction sounds right."
# A drag down the thread puts the keyboard away, as the thread's scroll lets it.
- swipe:
    start: "50%, 30%"
    end: "50%, 60%"
- waitForAnimationToEnd
- takeScreenshot: reply-sent

# Resolve, from the thread's ⋯ menu: the thread settles without an answer,
# its heading saying so, and the menu offers it no more.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Who can withdraw an invite?"
    timeout: 30000
- runFlow:
    file: subflows/open-row.yaml
    env:
      ROW: "What the expired invite page says"
- waitForAnimationToEnd
- runFlow:
    file: subflows/bar-act.yaml
    env:
      ACT: Resolve
- assertVisible: "Resolve"
- takeScreenshot: resolve-menu
- tapOn: "Resolve"
# Note that the resolve is found by the thread's own line at its foot, which the thread opens at, rather than the "Resolved" beside its title, which the folded Duo's short window has scrolled out of sight.
- assertVisible: "You resolved this without an answer.*"
- waitForAnimationToEnd
- takeScreenshot: resolve-sent

# The decide card at an accessibility size (AX3, Accessibility XL), from a
# fresh launch: each option's label keeps its lines, and the Recommended tag
# stands under its label rather than beside it.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      UIPreferredContentSizeCategoryName: UICTContentSizeCategoryAccessibilityXL
- extendedWaitUntil:
    visible: "Who can withdraw an invite?"
    timeout: 30000
- tapOn: "Who can withdraw an invite?"
# Note that at this size the card may stand below the thread's first screen, so the flow scrolls to the recommended option rather than asserting it at once.
- scrollUntilVisible:
    element: "Both, Recommended.*"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: answer-decide-ax3
