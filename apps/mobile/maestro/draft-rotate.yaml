# draft-rotate.yaml -- an agent's unsent message kept as an iPad turns from portrait to landscape, where the agent's page, opened on its own route in portrait, is handed to the split view's detail column and drawn anew there; skipped in a compact window, which keeps one page through a turn.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
# Note that each wait for the screen to settle is capped at five seconds,
# because the page draws its agent still running, whose mark never stops
# moving, so an uncapped wait always ran to Maestro's fifteen.
onFlowStart:
  - setOrientation: PORTRAIT
onFlowComplete:
  - setOrientation: PORTRAIT
---
# Launched on the host's Inbox fixture, opened on its invitations agent's page
# as `compose.yaml` is, so nothing reaches a server and nothing typed is sent.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      agent: 5ebf7192-3a6c-4d84-8fac-6b7c8d9eafb5
- extendedWaitUntil:
    visible: "Send a follow-up"
    timeout: 30000
# A regular window stands the tabs' pill over the page; a compact one hides
# its tab bar over a conversation, and skips the rest.
- runFlow:
    when:
      visible: "Search"
    commands:
      - tapOn:
          id: "composer-field"
      - inputText: "Keep this draft through the turn."
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: draft-portrait
      # The turn hands the page to the detail column beside the sidebar,
      # where the words typed stand in its composer still.
      - setOrientation: LANDSCAPE_LEFT
      - extendedWaitUntil:
          visible: "Keep this draft through the turn."
          timeout: 15000
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: draft-landscape
