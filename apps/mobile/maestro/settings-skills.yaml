# settings-skills.yaml -- Settings › Skills on the Inbox fixture: the account's own skills, each saying where its files came from, one opened to its SKILL.md and its files, a skill's Delete asked first and canceled, and a vespin.dev link on a skill's page opening its task on the tabs, Settings closed.
#
# Launched on the host's Inbox fixture, whose account holds two skills of
# its own and answers a skill's read itself (`@repo/host/fixture-inbox`), so
# no server is reached.
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- tapOn:
    id: "workspace-switcher"
- tapOn: "Settings(, .*)?"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Skills"
- tapOn: "Skills"
- waitForAnimationToEnd
# Note that a row is one element, heard as its name, so a skill is found by it.
- assertVisible: "Only you"
- assertVisible: "release-notes"
- assertVisible: "pr-style"
- takeScreenshot: settings-skills
# A press opens the skill's file as written, and its files.
- tapOn: "release-notes"
- assertVisible: "Files"
- waitForAnimationToEnd
- takeScreenshot: settings-skill
- tapOn:
    id: "BackButton"
# A long press offers Delete, which asks first.
- longPressOn: "pr-style"
- tapOn: "Delete"
- assertVisible: "Delete pr-style?"
- waitForAnimationToEnd
- takeScreenshot: settings-skills-delete
- runFlow:
    file: subflows/dismiss-ask.yaml
    env:
      QUESTION: "Delete pr-style?"
- assertVisible: "pr-style"
# A vespin.dev link on a skill's page opens its task on the tabs, the
# Settings sheet closed, as an automation's run opens its agent. On an
# iPhone the task is pushed on Tasks, whose Back goes to its list, where a
# page pushed inside the sheet would stand with no Back at all; on an iPad
# the task stands beside the Tasks list. Note that the link leads its line,
# so the line is pressed at its leading edge, as `person.yaml` presses a chip.
- tapOn: "release-notes"
- assertVisible: "Files"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: ".*holds this release's checklist.*"
- tapOn:
    text: ".*holds this release's checklist.*"
    point: "6%,50%"
- waitForAnimationToEnd
- assertVisible: "Created by .*"
- assertNotVisible: "Files"
- takeScreenshot: settings-skill-link
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - tapOn:
          id: "BackButton"
      - waitForAnimationToEnd
- assertVisible: "Weekly digest email"
- assertNotVisible: "release-notes"
- takeScreenshot: settings-skill-link-back
