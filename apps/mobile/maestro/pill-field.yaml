# pill-field.yaml -- the pill field on its scratch page: laid in with a mention of every kind and a picture's and a file's marker as pills, then cleared, typed into, an `@` word picked into a pill, a picture attached at the caret, and the Markdown it writes shown under it; then the document field a description is edited in, drawn with no syntax, its table and diagram as cards, words typed bold and turned into a heading from the bar over the keyboard, and an `@` word picked into a mention's pill.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
---
# Launched on the host's Inbox fixture, as every flow is, so no server is
# reached, with `-pillField true`, which opens the scratch page
# (`src/screens/pill-field-screen.tsx`). Note that the value is quoted, as
# every launch argument's is, because Maestro hands a YAML boolean to the app
# without its dash, which iOS then never reads.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      pillField: "true"
- extendedWaitUntil:
    visible: "Mention Ada"
    timeout: 30000
- assertVisible:
    id: "pill-field"
- takeScreenshot: pill-field-laid-in
# Cleared, the field stands one line with its placeholder, and takes words
# typed into it.
- tapOn: "Clear"
- assertVisible: "Message"
- tapOn:
    id: "pill-field"
- inputText: "Ping @Ad"
# The field tells the `@` word the caret stands in, which the page's Mention
# names; a press puts the pill in its place, written as the panel writes it.
- assertVisible: "Mention Ada for @Ad"
- tapOn: "Mention Ada for @Ad"
- assertVisible: ".*\\[@Ada Lovelace\\]\\(https://vespin.dev/stage/person/u-ada\\).*"
- inputText: "with "
- tapOn: "Attach a picture"
- assertVisible: ".*\\[Picture 2\\].*"
- takeScreenshot: pill-field-picked
- runFlow: subflows/lower-keyboard.yaml
- takeScreenshot: pill-field-written
# Under the page's own field, a document's field draws its words in the
# looks the page draws them in as they are written: a heading larger, bold
# words bold, code in the monospaced face, a list's marks, a quote muted,
# and the marks that only spell a look (`##`, `**`, the backticks, the
# fences) faded; with the caret in it, it keeps its looks.
- scrollUntilVisible:
    element:
      id: "pill-field-styled"
    direction: DOWN
- waitForAnimationToEnd
- takeScreenshot: pill-field-styled
- tapOn:
    id: "pill-field-styled"
- waitForAnimationToEnd
- takeScreenshot: pill-field-styled-caret
# Under them, the document field a description is edited in, as Notion edits
# a page: each block drawn with no syntax (a heading, bold words, a mention's
# pill, the lists' bullets, numbers and boxes, a quote, code, a rule), and a
# table and a diagram, which the phone does not edit, as cards. The Markdown
# it writes is shown under it, each block it was handed kept as its exact
# source, so the table stands as it was written.
- runFlow: subflows/lower-keyboard.yaml
- scrollUntilVisible:
    element:
      id: "document-field"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: document-field
- swipe:
    from:
      id: "document-field"
    direction: UP
- waitForAnimationToEnd
- takeScreenshot: document-field-cards
- assertVisible: "(?s).*\\| Role \\| May withdraw \\|\\n\\| - \\| - \\|.*"
# Formatting comes from the selection, as Notes and Notion offer it: the
# bar over the keyboard holds the desktop toolbar's marks and its Turn into,
# each named by the panel's words. Cleared, the field is typed into from its
# first line: Bold pressed with nothing selected gives the words typed next
# its look, and Turn into's Heading 1 turns their line into a heading, each
# written as the panel writes it.
- scrollUntilVisible:
    element: "Clear description"
    direction: UP
- tapOn: "Clear description"
- tapOn:
    id: "document-field"
- tapOn: "Bold"
- inputText: "Ship"
- assertVisible: "(?s).*\\*\\*Ship\\*\\*.*"
- tapOn: "Turn into"
- tapOn: "Heading 1"
- assertVisible: "(?s).*# \\*\\*Ship\\*\\*.*"
- takeScreenshot: document-field-formatted
# A description's `@` word opens a mention offer as the message box's does:
# the field tells the word the caret stands in, which the page's Mention
# names, and a pick puts the person's pill in its place, written as the panel
# writes a mention.
- scrollUntilVisible:
    element: "Clear description"
    direction: UP
- tapOn: "Clear description"
- tapOn:
    id: "document-field"
- inputText: "Ask @Ad"
- tapOn: "Mention Ada in the description for @Ad"
- assertVisible: "(?s).*Ask \\[@Ada Lovelace\\]\\(https://vespin.dev/stage/person/u-ada\\).*"
- takeScreenshot: document-field-mention
