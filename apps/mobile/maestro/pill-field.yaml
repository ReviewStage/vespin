# pill-field.yaml -- the pill field on its scratch page: laid in with a mention of every kind and a picture's and a file's marker as pills, then cleared, typed into, an `@` word picked into a pill, a picture attached at the caret, and the Markdown it writes shown under it; then the document field a description is edited in, drawn with no syntax, its table and diagram as cards, words typed bold and turned into a heading from the bar over the keyboard, and an `@` word picked into a mention's pill.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
---
# Launched on the host's Inbox fixture, as every flow is, so no server is
# reached, with `-pillField true`, which opens the scratch page
# (`src/screens/pill-field-screen.tsx`). Note that the value is quoted, as
# every launch argument's is, because Maestro hands a YAML boolean to the app
# without its dash, which iOS then never reads.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      pillField: "true"
- extendedWaitUntil:
    visible: "Mention Ada"
    timeout: 30000
- assertVisible:
    id: "pill-field"
- takeScreenshot: pill-field-laid-in
# Cleared, the field stands one line with its placeholder, and takes words
# typed into it.
- tapOn: "Clear"
- assertVisible: "Message"
- tapOn:
    id: "pill-field"
- inputText: "Ping @Ad"
# The field tells the `@` word the caret stands in, which the page's Mention
# names; a press puts the pill in its place, written as the panel writes it.
- assertVisible: "Mention Ada for @Ad"
- tapOn: "Mention Ada for @Ad"
- assertVisible: ".*\\[@Ada Lovelace\\]\\(https://vespin.dev/stage/person/u-ada\\).*"
- inputText: "with "
- tapOn: "Attach a picture"
- assertVisible: ".*\\[Picture 2\\].*"
- takeScreenshot: pill-field-picked
- runFlow: subflows/lower-keyboard.yaml
- takeScreenshot: pill-field-written
# Under it, the document field a description is edited in, as Notion edits
# a page: each block drawn with no syntax (a heading, bold words, a mention's
# pill, the lists' bullets, numbers and boxes, a quote, code, a rule), and a
# table and a diagram, which the phone does not edit, as cards. The Markdown
# it writes is shown under it, each block it was handed kept as its exact
# source, so the table stands as it was written.
# Note that the page is scrolled through `page-edge-scroll.yaml`, by drags
# in its margin, because the description's field is taller than the window
# and a drag on it scrolls its own words rather than the page; and that the
# Markdown under the field stands below the window whenever the field is
# in sight, so each check of it comes once the keyboard is lowered and the
# page scrolled down to it, which the same drags do.
- runFlow:
    file: subflows/page-edge-scroll.yaml
    env:
      ELEMENT: "Clear description"
- waitForAnimationToEnd
- takeScreenshot: document-field
- runFlow:
    file: subflows/page-edge-scroll.yaml
    env:
      ELEMENT: "(?s).*\\| Role \\| May withdraw \\|\\n\\| - \\| - \\|.*"
- waitForAnimationToEnd
- takeScreenshot: document-field-cards
- assertVisible: "(?s).*\\| Role \\| May withdraw \\|\\n\\| - \\| - \\|.*"
# Formatting comes from the selection, as Notes and Notion offer it: the
# bar over the keyboard holds the desktop toolbar's marks and its Turn into,
# each named by the panel's words. Cleared, the field is typed into from its
# first line: Bold pressed with nothing selected gives the words typed next
# its look, and Turn into's Heading 1 turns their line into a heading, each
# written as the panel writes it. Note that each section goes back up to the
# description's acts by drags in the margin too, until the act over Clear
# description shows, so Clear description and the field's middle, where the
# field is pressed, stand clear on the window.
- runFlow:
    file: subflows/page-edge-scroll.yaml
    env:
      ELEMENT: "Mention Ada in the description"
      DIRECTION: UP
- tapOn: "Clear description"
- tapOn:
    id: "document-field"
- tapOn: "Bold"
- inputText: "Ship"
- tapOn: "Turn into"
- tapOn: "Heading 1"
- takeScreenshot: document-field-formatted
- runFlow:
    file: subflows/page-edge-scroll.yaml
    env:
      ELEMENT: "(?s).*# \\*\\*Ship\\*\\*.*"
- assertVisible: "(?s).*# \\*\\*Ship\\*\\*.*"
# A description's `@` word opens a mention offer as the message box's does:
# the field tells the word the caret stands in, which the page's Mention
# names, and a pick puts the person's pill in its place, written as the panel
# writes a mention.
- runFlow:
    file: subflows/page-edge-scroll.yaml
    env:
      ELEMENT: "Mention Ada in the description"
      DIRECTION: UP
- tapOn: "Clear description"
- tapOn:
    id: "document-field"
- inputText: "Ask @Ad"
- tapOn: "Mention Ada in the description for @Ad"
- takeScreenshot: document-field-mention
- runFlow:
    file: subflows/page-edge-scroll.yaml
    env:
      ELEMENT: "(?s).*Ask \\[@Ada Lovelace\\]\\(https://vespin.dev/stage/person/u-ada\\).*"
- assertVisible: "(?s).*Ask \\[@Ada Lovelace\\]\\(https://vespin.dev/stage/person/u-ada\\).*"
# A list's item moves under the item before it, and back out, from the
# bar's Indent and Outdent, as Tab and Shift-Tab move it in Notes and
# Notion; the bar stands them only while the caret is in a list item, in
# Strikethrough's and Code's place, which step into its Turn into. A nested
# item is written two spaces in, under its parent's words. A Return on an
# empty nested item takes it a step back out, as a Return on an empty item
# leaves a list in Notes and Notion. Note that the Markdown is read once, at
# the end, so the keyboard stands throughout: Model and Ship stand nested
# only by Indent, Spec a top-level item only by the Return on the empty
# nested item under Model, and Next back out only by Outdent, where the
# Return after Ship would have kept it nested.
- runFlow:
    file: subflows/page-edge-scroll.yaml
    env:
      ELEMENT: "Mention Ada in the description"
      DIRECTION: UP
- tapOn: "Clear description"
- tapOn:
    id: "document-field"
- inputText: "Plan"
- tapOn: "Turn into"
- tapOn: "Bulleted list"
- assertNotVisible: "Strikethrough"
- pressKey: Enter
- inputText: "Model"
- tapOn: "Indent"
- takeScreenshot: document-field-nested
- pressKey: Enter
- pressKey: Enter
- inputText: "Spec"
- pressKey: Enter
- inputText: "Ship"
- tapOn: "Indent"
- pressKey: Enter
- inputText: "Next"
- tapOn: "Outdent"
- takeScreenshot: document-field-nested-out
# The field writes its words once a frame, so the Markdown is waited on
# until it reads as the field wrote it.
- runFlow:
    file: subflows/page-edge-scroll.yaml
    env:
      ELEMENT: "(?s).*- [^\\n]*Plan\\n.*"
- extendedWaitUntil:
    visible: "(?s).*- [^\\n]*Plan\\n  - Model[^\\n]*\\n- +Spec[^\\n]*\\n  - Ship[^\\n]*\\n- +Next.*"
    timeout: 10000
