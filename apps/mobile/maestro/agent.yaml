# agent.yaml -- an agent's page: its title in the bar, its transcript opened at its newest turn, still running, its test run held for an answer with Deny, Always allow and Allow under it and the working line saying it waits on you, a call opened on its body, a run of calls opened, the pictures and the recording it showed, playing in place, the pull request it opened as its card, the page it showed opened whole, its older page read on Try again, its held call allowed, its options sheet opened from the page's menu, its model, Fast, permission mode, and MCP servers changed there, and its ⋯ menu's Rename, Pin, Move to ›, and Archive; its threads line over the box, which opens the thread it names; a sent line's Edit, and a finished turn's Rewind conversation to here and Fork to new agent; then an agent whose transcript stands empty.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
# Note that each wait for the screen to settle is capped at five seconds,
# because the page draws its turn still running, whose mark never stops
# moving, so an uncapped wait always ran to Maestro's fifteen.
# Note too that on an iPad the transcript is scrolled well inside the detail
# column (`BESIDE`), because a scroll at the window's middle lands on the
# list column of a landscape window, and the page never moved
# (`scroll-in.yaml`).
# Note that an iPad stands in landscape, where its transcript stands in the
# detail column beside the list, and that the window is turned back upright
# however the flow ends, because a run left in landscape fails every flow
# after it.
onFlowComplete:
  - setOrientation: PORTRAIT
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
# Launched on the host's Inbox fixture, whose invitations agent holds a
# transcript three turns long (`@repo/host/fixture-inbox`), and opened on its
# page by `-agent <id>`, since the task's Overview that leads there is the
# Tasks tab's; nothing reaches a server.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      agent: 5ebf7192-3a6c-4d84-8fac-6b7c8d9eafb5
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - setOrientation: LANDSCAPE_LEFT
# Note that the launch waits up to half a minute for its first words, as
# `pull-request.yaml`'s do.
- extendedWaitUntil:
    visible: "Add a way to resend an invite that expired."
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-latest
# Its last call, the test run, is held for the account's answer, as Ask mode
# holds a shell command: its line says so with Deny, Always allow and Allow
# under it, its answer's only presses, Always allow naming the command's
# first words it keeps for every agent, and the working line says the agent
# waits on you.
- assertVisible: "Waiting for approval"
- assertVisible: "Always allow"
- assertVisible: "Always allow won.t ask again for pnpm test \\* in any of your agents\\."
- assertVisible: "Waiting on you · 1 approval"
- takeScreenshot: agent-held
# The file the account sent with that line stands as its chip over the
# line's bubble, its kind and its count of lines under its name. Note that it
# is scrolled to, since the page opens at its newest row's end, which a short
# window such as the iPhone Duo's stands the chip above.
- runFlow:
    file: subflows/scroll-in.yaml
    env:
      ELEMENT: "expired-invites.csv.*3 lines"
      DIRECTION: UP
      BESIDE: ${FLOATING_TABS}
# A call opens in place on its body: a command as a terminal, its prompt over
# what it printed.
- tapOn: "Edited.*"
- assertVisible: "Input"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-call
- tapOn: "Edited.*"
# The second turn: the page it showed as a card, and its recording, read as
# its MP4 copy, which the system's player plays in place.
# Note that the card is scrolled to in short steps until it stands clear
# under the agent's name in the bar (`scroll-to.yaml`'s `BELOW`), because a
# scroll that stops once it shows leaves it under the bar, where the tap
# lands on the status bar and scrolls the list to its top, and one that
# centers it may leave it under the held call's banner.
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: "Invite funnel, Page"
      BELOW: "Build teammate invitations"
      BESIDE: ${FLOATING_TABS}
- takeScreenshot: agent-page-card
- tapOn: "Invite funnel, Page"
# Note that the wait is long, because the first web view a freshly booted
# simulator opens launches WebKit's processes, which has taken a loaded CI
# runner nearly 40 seconds.
- extendedWaitUntil:
    visible: "Invites sent in the staging workspace.*"
    timeout: 90000
# Note that the page's words are heard only once its loading ground, heard
# as Loading while it stands, has faded from over them (`SealedPage`), so
# the shot is taken once it has gone rather than of the ground.
- extendedWaitUntil:
    notVisible: "Loading"
    timeout: 5000
- takeScreenshot: agent-page
- tapOn:
    id: "BackButton"
    optional: true
# The recording under the card: the flow waits for the player to report it
# can play the file, so a read that never lands, or a file it cannot play,
# fails here rather than leaving a well with its spinner in the screenshot.
# Note that the flow scrolls to the recording by its caption, which its well
# and its player both carry, since the player is named only once it can play
# and a scroll to that name would run past a recording still read.
- runFlow:
    file: subflows/scroll-in.yaml
    env:
      ELEMENT: "Accepting an invite.*"
      BESIDE: ${FLOATING_TABS}
- extendedWaitUntil:
    visible:
      id: "video-player"
    timeout: 15000
- assertNotVisible: ".*can't play here.*"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-recording
# The first turn finished: its run of calls folded under one line, the
# pictures it showed standing apart after it.
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: "The invite dialog"
      DIRECTION: UP
      BESIDE: ${FLOATING_TABS}
- takeScreenshot: agent-pictures
# The pull request it opened after them, as its card with Review.
- runFlow:
    file: subflows/scroll-in.yaml
    env:
      ELEMENT: ".*#128 Invite a teammate by email.*"
      BESIDE: ${FLOATING_TABS}
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-pull-request
# Note that once the fold shows it is drawn on clear under the agent's name
# in the bar (`scroll-to.yaml`'s `BELOW`), because a scroll that stops once
# it shows can leave it under the bar, as the scrolls before it leave it on
# an iPad, where the tap landed on the status bar and scrolled the list to
# its top, leaving the fold shut (STAG-3807). So the iPad needs no turn
# upright for the fold, and no second tap: a tap that misses here has landed
# under the bar, which a scroll clear of it mends.
- runFlow:
    file: subflows/scroll-in.yaml
    env:
      ELEMENT: ".*tool calls.*"
      DIRECTION: UP
      BESIDE: ${FLOATING_TABS}
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: ".*tool calls.*"
      BELOW: "Build teammate invitations"
      BESIDE: ${FLOATING_TABS}
- tapOn: ".*tool calls.*"
- assertVisible: "Read.*"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-fold
# At the top, the page older than the transcript's first is read; the
# fixture's first read is not heard back, so it offers Try again, and the
# next lays the older turn before the first.
# Note that the list is then pulled on to its top, because the notice is its
# first row, which no scroll can center, and a scroll that stops once the
# notice shows leaves Try again under the bar, where a press lands beside it.
- runFlow:
    file: subflows/scroll-in.yaml
    env:
      ELEMENT: "Earlier messages could not be read."
      DIRECTION: UP
      BESIDE: ${FLOATING_TABS}
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - swipe:
          start: "50%, 30%"
          end: "50%, 80%"
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - swipe:
          start: "85%, 30%"
          end: "85%, 80%"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Try again"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-older-failed
- tapOn: "Try again"
# The older page lands above the rows read, which hold their place as a chat list keeps it, so the flow scrolls up to its first message, which it finds only once the page is read and drawn.
- runFlow:
    file: subflows/scroll-in.yaml
    env:
      ELEMENT: "Before you build anything.*"
      DIRECTION: UP
      BESIDE: ${FLOATING_TABS}
- assertVisible: "Before you build anything.*"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-older
# Read back, the list offers to jump to the newest row.
- tapOn: "Jump to latest"
- assertVisible: "Add a way to resend an invite that expired."
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-jump
# Allowed, the held call says so in a word, and the working line stops waiting.
- tapOn: "Allow"
- assertVisible: "Allowed"
- assertNotVisible: "Waiting on you · 1 approval"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-allowed
# The page's menu opens the options sheet, as the panel's chip and + open
# their menus: the effort and Fast first, since the fixture's catalog lists
# Opus's fast version, then each model its harness runs, Opus 5.5 to start; its permission mode, Ask for approval to start, each
# mode with what it does; and the MCP servers it is handed, each connected
# one with its switch. A change is drawn on the agent at once, as the fixture
# lays it. Note that a regular window's bar stands Pin and Archive beside ⋯
# rather than in it (`bar-act.yaml`), so there they are found before ⋯ opens.
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - assertVisible: "Pin"
      - assertVisible: "Archive"
- tapOn: "More"
- assertVisible: "Copy link"
- assertVisible: "Rename"
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - assertVisible: "Pin"
      - assertVisible: "Archive"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-menu
# The model, its effort, Fast and the permission mode stand once, in the
# model chip's sheet at the end of the composer's row, as the desktop's
# model chip holds them; ⋯ no longer offers Options. Note that the menu is
# let go first, by a tap on the transcript at the window's leading edge,
# since on the iPhone the menu, which drops from ⋯ at the trailing edge,
# reaches the middle of its top, where a tap opened Copy transcript.
- tapOn:
    point: "4%, 50%"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "agent-model-chip"
- assertVisible: "Effort"
- assertVisible: ".*Opus 5.5.*"
- assertVisible: "Fast"
- assertVisible: "Ask for approval"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-options
- tapOn:
    id: "options-fast"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-options-fast
# Note that the sheet is drawn up first, because its permissions and their
# note stand below a short window's fold. A regular window stands Options as
# a popover from the composer's chip, with no Done, which a drag up the
# window would put away, so there the popover is scrolled from inside it,
# from its own Ask for approval, until its other modes stand.
- runFlow:
    when:
      visible: "Done"
    commands:
      - runFlow:
          file: subflows/full-sheet.yaml
- runFlow:
    when:
      notVisible: "Approve for me.*"
    commands:
      - swipe:
          from:
            text: "Ask for approval"
          direction: UP
      - waitForAnimationToEnd
- tapOn: "Approve for me.*"
# Note that the sheet opens at half height in a compact window, so the permission section's footer may stand below the fold until scrolled to; a popover is scrolled from inside it, as above.
- runFlow:
    when:
      visible: "Done"
    commands:
      - scrollUntilVisible:
          element: "Takes effect from the next turn."
          direction: DOWN
- repeat:
    times: 3
    while:
      notVisible: "Takes effect from the next turn."
    commands:
      - swipe:
          from:
            text: "Approve for me.*"
          direction: UP
      - waitForAnimationToEnd
- assertVisible: "Takes effect from the next turn."
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-options-mode
# The models stand in the sheet under their harness, each a row of its own;
# a pick of Sonnet, which the fixture's catalog lists no fast version of,
# takes Fast away.
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: ".*Sonnet 5.5"
      DIRECTION: UP
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-model-menu
- tapOn: ".*Sonnet 5.5"
- assertVisible: "Effort.*"
- assertNotVisible:
    id: "options-fast"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-model-picked
# A compact window's sheet closes on its Done; a regular window stands Model
# as a popover from the composer's chip, as the panel's menu stands, which
# has no Done and closes on a tap off it, at the window's leading edge, which
# the popover from the chip at the composer's end never reaches.
- runFlow:
    when:
      visible: "Done"
    commands:
      - tapOn: "Done"
- runFlow:
    when:
      visible: "Effort.*"
    commands:
      - runFlow:
          file: subflows/dismiss.yaml
          env:
            POINT: "5%, 50%"
- assertNotVisible: "Effort.*"
# Rename asks for the name in the system's alert, holding the name as it
# stands; the new one is drawn in the bar at once.
- tapOn: "More"
- tapOn: "Rename"
- assertVisible: "Rename agent"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-rename
- eraseText: 40
- inputText: "Invite by email"
- tapOn: "Rename"
- assertVisible: "Invite by email"
# Pinned, Unpin stands in its place. Note that an iPad's sidebar and list
# lead their Pinned groups with a glyph heard as "Pin" too, so there the bar's
# Pin is found by the Archive beside it, which only the bar holds; a compact
# window's ⋯ holds one "Pin" alone.
- runFlow:
    file: subflows/bar-act.yaml
    env:
      ACT: Pin
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - tapOn:
          text: "Pin"
          rightOf: "Archive"
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - tapOn: "Pin"
- runFlow:
    file: subflows/bar-act.yaml
    env:
      ACT: Unpin
- assertVisible: "Unpin"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-pinned
# Move to › lists where the agent may be moved, as the panel's does: the
# fixture's cloud agent goes to one of Ada's machines, each saying it
# stops the agent first, since it still works. Note that a compact window's
# ⋯ still stands open from Unpin, where a regular window's must be opened;
# a tap off the menu puts it away. Note too that each item is heard as one
# element, its machine and its subtitle together ("build-box, Stops the
# agent first"), so a step names the machine at the start of its words.
- runFlow:
    when:
      notVisible: "Move to"
    commands:
      - tapOn: "More"
- tapOn: "Move to"
- assertVisible: "Ada's MacBook Pro, Stops the agent first"
- assertVisible: "build-box, Stops the agent first"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-move-to
- tapOn:
    point: "50%, 20%"
- waitForAnimationToEnd
- assertNotVisible: "build-box.*"
# Note that the tap puts away only Move to's submenu, leaving the ⋯ menu it
# opened from, whose Permanently delete is its alone, standing over the bar;
# a tap off it near the screen's foot, which no menu reaches, puts it away
# too, so the bar's own More can be reached again.
- runFlow:
    when:
      visible: "Permanently delete"
    commands:
      - runFlow:
          file: subflows/dismiss.yaml
- assertNotVisible: "Permanently delete"
# Archive asks first, in the panel's words, since the agent still works and
# archiving it stops it; putting the question away (its Cancel, on the
# iPhone's action sheet and the iPad's alert alike) leaves it.
- runFlow:
    file: subflows/bar-act.yaml
    env:
      ACT: Archive
- tapOn: "Archive"
- assertVisible: "Archive agent?"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-archive
- runFlow:
    file: subflows/dismiss-ask.yaml
    env:
      QUESTION: "Archive agent?"
- assertNotVisible: "Archive agent?"
- assertVisible: "Invite by email"
# Confirmed, the archive is taken, as the fixture takes it, with no refusal
# said over the composer; launched straight onto the page, there is nothing
# to go back to, so the page stays.
- runFlow:
    file: subflows/bar-act.yaml
    env:
      ACT: Archive
- tapOn: "Archive"
- tapOn: "Stop agent"
- assertNotVisible: "Archive agent?"
- assertNotVisible:
    id: "ask-note"
# Its threads line stands over the box, as the panel's threads dock does:
# the Inbox's glyph, and how many of the threads it posted wait on the
# reader (the fixture's invitations agent posted several, some open). A
# press opens the oldest waiting on the agent's own tab, over its page.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      agent: 5ebf7192-3a6c-4d84-8fac-6b7c8d9eafb5
- extendedWaitUntil:
    visible: "Inbox, \\d+ waiting"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-threads-line
- tapOn: "Inbox, \\d+ waiting"
- extendedWaitUntil:
    notVisible: "Inbox, \\d+ waiting"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-threads-line-opened
# The panel's message acts, launched afresh, since the agent was archived
# above and an archived agent offers no rewind or fork. A long press on the
# reader's own line of words alone offers Edit after Copy link, which lays
# its words in the composer under "Editing message" with Cancel, and Cancel
# gives the composer back what it held.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      agent: 5ebf7192-3a6c-4d84-8fac-6b7c8d9eafb5
- extendedWaitUntil:
    visible: "Keep the old link working until the new one is sent."
    timeout: 30000
- longPressOn: "Keep the old link working until the new one is sent."
- assertVisible: "Copy message"
- assertVisible: "Edit"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-line-menu
- tapOn: "Edit"
- assertVisible: "Editing message"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-edit
- tapOn: "Cancel"
- assertNotVisible: "Editing message"
# The keyboard Edit raised goes down on a drag from the transcript into it,
# as `compose.yaml` lowers it.
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - swipe:
          start: "50%, 25%"
          end: "50%, 92%"
          duration: 600
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - swipe:
          start: "85%, 25%"
          end: "85%, 92%"
          duration: 600
- waitForAnimationToEnd:
    timeout: 5000
# The second turn, finished, ends on its row of acts, whose ⋯ holds Fork to
# new agent and Rewind conversation to here, since the teammate's line
# follows it. Note that its ⋯ is found as the "More" under the turn's last
# words, because the page's own ⋯ in the bar is "More" too and stands first.
# Note too that the words are scrolled to clear under the bar (`BELOW`), so
# the row of acts under them stands well above the dock; a centered scroll
# left the row under the dock's chips on the dark iPhone, where the tap
# opened the Inbox chip's thread.
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: ".*71 of the 120 invites sent were accepted.*"
      BELOW: "Build teammate invitations"
      BESIDE: ${FLOATING_TABS}
- tapOn:
    text: "More"
    below: ".*71 of the 120 invites sent were accepted.*"
- assertVisible: "Fork to new agent"
- assertVisible: "Rewind conversation to here"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-turn-more
# Rewind asks first, in the panel's words, its act in red; put away, it
# drops nothing. On an iPhone it is UIKit's action sheet, which iOS 26
# stands centered since no view of ours raised it: its act first and
# Cancel set apart below it.
- tapOn: "Rewind conversation to here"
- assertVisible: "Rewind conversation to this message.*"
- assertVisible: "Rewind conversation"
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - assertVisible:
          text: "Cancel"
          below: "Rewind conversation"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-rewind-ask
- runFlow:
    file: subflows/dismiss-ask.yaml
    env:
      QUESTION: "Rewind conversation to this message.*"
- assertVisible: "The digest should count pending invites separately from members."
# Fork opens New agent as the panel's forked draft: headed by the agent and
# the message's opening words, its Send lit with the box empty, which the
# fixture answers with a new agent starting.
- tapOn:
    text: "More"
    below: ".*71 of the 120 invites sent were accepted.*"
- tapOn: "Fork to new agent"
- extendedWaitUntil:
    visible: "Fork of .* at .*71 of the 120.*"
    timeout: 5000
- assertVisible: "Ask to make changes"
- runFlow:
    file: subflows/lower-keyboard.yaml
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-fork
- tapOn: "Send"
- extendedWaitUntil:
    notVisible: "Fork of .*"
    timeout: 5000
- assertNotVisible:
    id: "ask-note"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-fork-started
# An agent whose transcript is not read yet, or could not be: the fixture
# holds none for this id, so the list stands empty and its empty state, which
# is SwiftUI's, stands in the rows' place in a host of its own, rather than
# crashing the app as it did mounted bare in the list.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      agent: 00000000-0000-4000-8000-000000000000
- extendedWaitUntil:
    visible: "Reading the transcript|The transcript could not be read\\."
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-empty
