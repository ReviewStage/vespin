# markdown.yaml -- a task's description holding every piece of Markdown the app draws, shot from its top, at its table, at its end, and its picture full screen.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
---
# Launched on the host's Inbox fixture, as `skeleton.yaml` is, so no server is
# reached; the description is the fixture's task's, which holds every piece
# (`@repo/host/fixture-inbox`).
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- assertVisible: "Inbox"
- tapOn: "Tasks"
- tapOn: "Teammate invitations"
- waitForAnimationToEnd
# Note that the task's page is swiped at its right side rather than scrolled
# from the screen's center, since a landscape iPad's center falls in the list
# column beside the task, which never holds its description.
- repeat:
    while:
      notVisible: "Goal"
    times: 8
    commands:
      - swipe:
          start: 85%, 70%
          end: 85%, 35%
      - waitForAnimationToEnd
- assertVisible: "Goal"
- takeScreenshot: markdown-top
- repeat:
    while:
      notVisible: "Owner"
    times: 12
    commands:
      - swipe:
          start: 85%, 70%
          end: 85%, 35%
      - waitForAnimationToEnd
- assertVisible: "Owner"
- takeScreenshot: markdown-table
- repeat:
    while:
      notVisible: "The invite page"
    times: 20
    commands:
      - swipe:
          start: 85%, 70%
          end: 85%, 35%
      - waitForAnimationToEnd
- assertVisible: "The invite page"
- takeScreenshot: markdown-end
- tapOn: "The invite page"
- assertVisible:
    id: "markdown-picture-done"
- takeScreenshot: markdown-picture
- tapOn:
    id: "markdown-picture-done"
