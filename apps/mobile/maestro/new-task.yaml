# new-task.yaml -- New task from the Inbox bar's compose: Home's composer as a page of its own, the task described, its repository picked from its capsule under the composer's field, and the task started with its agent, the agent's page opened; then a task related to another picked from the composer's +; then a draft whose swipe down and ✕ ask Discard draft or Save draft, saved for the next New task and then discarded; then the composer's + Photos opening the system's photo picker, closed unpicked.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
---
# Launched on the host's Inbox fixture, whose models and repositories are
# staged and whose task start is answered with the task made and its agent
# starting (`@repo/host/fixture-inbox`), so nothing reaches a server.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Inbox"
    timeout: 30000
- tapOn: "New task"
- assertVisible: "Describe the task"
- assertVisible: "ada/relay"
- waitForAnimationToEnd
- takeScreenshot: new-task-sheet
- inputText: "Let a workspace owner revoke a pending invite."
# The keyboard is lowered by a drag on the page over the composer (`StartPage`).
- runFlow:
    file: subflows/lower-keyboard.yaml
# The repository's capsule, which says the one picked, opens a menu of what
# the workspace's GitHub reaches.
- tapOn: "ada/relay"
- assertVisible: "ada/ledger"
- waitForAnimationToEnd
- takeScreenshot: new-task-repositories
- tapOn: "ada/ledger"
- waitForAnimationToEnd
- takeScreenshot: new-task-filled
- tapOn: "Send"
- extendedWaitUntil:
    notVisible: "Describe the task"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: new-task-started
# A task may start related to another, Blocked by it here, and File for
# later, before Start in the bar, files it in the Backlog with no agent,
# opening its page.
- launchApp:
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Inbox"
    timeout: 30000
- tapOn: "New task"
- assertVisible: "Describe the task"
- inputText: "Audit the invite emails for broken links."
- runFlow:
    file: subflows/lower-keyboard.yaml
# A relation is picked from the sheet's + menu: Task relation, its kind,
# then the task it names; it then stands over the words as a capsule.
- tapOn:
    id: "new-task-attach"
- tapOn: "Task relation"
- tapOn: "Blocked by"
- tapOn: "Teammate invitations"
- waitForAnimationToEnd
- assertVisible: "Blocked by · Teammate invitations"
- takeScreenshot: new-task-relation
# A sheet with words typed keeps them, as Mail's compose does: the swipe
# down is held and asks Discard draft or Save draft from the system's sheet,
# whose Cancel keeps the page; the ✕ (Cancel) opens the same two as its
# menu; and a draft saved stands in the next New task's field, until it is
# discarded. Note that the app is launched again for it, so the Inbox and
# its bar's compose stand.
- launchApp:
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Inbox"
    timeout: 30000
- tapOn: "New task"
- assertVisible: "Describe the task"
- inputText: "Show who sent each pending invite."
- swipe:
    start: "50%, 12%"
    end: "50%, 85%"
    duration: 600
- assertVisible: "Save draft"
- waitForAnimationToEnd
- takeScreenshot: new-task-swipe-ask
# Note that the ask's own Cancel is found under its Save draft, because the
# ✕ is heard as Cancel too, and on an iPad a bare Cancel found the ✕ under
# the alert, which left the ask standing.
- tapOn:
    text: "Cancel"
    below: "Save draft"
- extendedWaitUntil:
    notVisible: "Save draft"
    timeout: 5000
- assertVisible: "Show who sent each pending invite."
- tapOn: "Cancel"
- assertVisible: "Discard draft"
- assertVisible: "Save draft"
- waitForAnimationToEnd
- takeScreenshot: new-task-discard
- tapOn: "Save draft"
- extendedWaitUntil:
    notVisible: "Show who sent each pending invite."
    timeout: 5000
- tapOn: "New task"
- assertVisible: "Show who sent each pending invite."
- waitForAnimationToEnd
- takeScreenshot: new-task-draft-saved
- tapOn: "Cancel"
- tapOn: "Discard draft"
- extendedWaitUntil:
    notVisible: "Show who sent each pending invite."
    timeout: 5000
- tapOn: "New task"
- assertVisible: "Describe the task"
- assertNotVisible: "Show who sent each pending invite."
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Describe the task"
    timeout: 5000
# The sheet's + menu's Photos opens the system's photo picker over it, run
# out of the app's process. The picker is known by our own sheet's words
# going, which it covers, and by its own "Select up to" line, and is shot.
# On every device it is then closed unpicked by its own Cancel, the one
# under that line, since the sheet's ✕ is heard as Cancel too, and its going
# is asserted before the sheet's words come back. A picture laid into the field as a pill is
# `pill-field.yaml`'s. Note that the waits on the picker are long, because
# the picker's process starts cold on a fresh simulator, which has taken a
# loaded runner thirteen seconds, and XCTest's snapshot has reached the
# picker's words only some seconds after it was drawn.
- launchApp:
    arguments:
      fixture: inbox
# Note that the relaunch is waited on as the flow's other launches are,
# rather than asserted at once, because a loaded iPad's relaunch draws the
# Inbox after the assert's short wait, and the failure's own frame, taken a
# moment later, then shows it.
- extendedWaitUntil:
    visible: "Inbox"
    timeout: 30000
- tapOn: "New task"
- assertVisible: "Describe the task"
- runFlow:
    file: subflows/lower-keyboard.yaml
- waitForAnimationToEnd
- takeScreenshot: new-task-add
- tapOn:
    id: "new-task-attach"
- tapOn: "Photos"
- extendedWaitUntil:
    notVisible: "Describe the task"
    timeout: 30000
- extendedWaitUntil:
    visible: "Select up to .*"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: new-task-picker
- tapOn:
    text: "Cancel"
    below: "Select up to .*"
- extendedWaitUntil:
    notVisible: "Select up to .*"
    timeout: 10000
# The sheet, holding nothing, is canceled without a question.
- extendedWaitUntil:
    visible: "Describe the task"
    timeout: 10000
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Describe the task"
    timeout: 5000
