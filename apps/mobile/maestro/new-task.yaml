# new-task.yaml -- New task from the tab bar's round +: Home's composer as a compose sheet, the task described, its repository picked from its capsule over the keyboard, and the task started with its agent, the agent's page opened; then a task related to another from the sheet's + and filed for later with no agent, its page opened; then a draft that Cancel asks before discarding; then a picture attached through the sheet's + Photos, which keeps the sheet as a draft too.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
---
# Launched on the host's Inbox fixture, whose models and repositories are
# staged and whose task start is answered with the task made and its agent
# starting (`@repo/host/fixture-inbox`), so nothing reaches a server.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- assertVisible: "Inbox"
- tapOn: "New task"
- assertVisible: "Describe the task"
- assertVisible: "ada/relay"
- waitForAnimationToEnd
- takeScreenshot: new-task-sheet
- inputText: "Let a workspace owner revoke a pending invite."
# Note that iOS's hideKeyboard is a short drag at the screen's middle, which
# lowers the keyboard because the sheet's page lowers it on a drag
# (`ComposeSheet`); the words field's return key types a new line.
- hideKeyboard
# The repository's capsule, which says the one picked, opens a menu of what
# the workspace's GitHub reaches.
- tapOn: "ada/relay"
- assertVisible: "ada/ledger"
- waitForAnimationToEnd
- takeScreenshot: new-task-repositories
- tapOn: "ada/ledger"
- waitForAnimationToEnd
- takeScreenshot: new-task-filled
- tapOn: "Start"
- extendedWaitUntil:
    notVisible: "Describe the task"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: new-task-started
# A task may start related to another, Blocked by it here, and File for
# later, before Start in the bar, files it in the Backlog with no agent,
# opening its page.
- launchApp:
    arguments:
      fixture: inbox
- assertVisible: "Inbox"
- tapOn: "New task"
- assertVisible: "Describe the task"
- inputText: "Audit the invite emails for broken links."
- hideKeyboard
# A relation is picked from the sheet's + menu: Task relation, its kind,
# then the task it names; it then stands over the words as a capsule.
- tapOn:
    id: "new-task-attach"
- tapOn: "Task relation"
- tapOn: "Blocked by"
- tapOn: "Teammate invitations"
- waitForAnimationToEnd
- assertVisible: "Blocked by · Teammate invitations"
- takeScreenshot: new-task-relation
- tapOn: "File for later"
- extendedWaitUntil:
    notVisible: "Describe the task"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: new-task-filed
# A sheet with words typed keeps them: Cancel asks before discarding the
# draft, as Mail does, and the swipe down is held. Note that the app is
# launched again for it, so the round + stands in the tab bar.
- launchApp:
    arguments:
      fixture: inbox
- assertVisible: "Inbox"
- tapOn: "New task"
- assertVisible: "Describe the task"
- inputText: "Show who sent each pending invite."
- tapOn: "Cancel"
- assertVisible: "Discard draft?"
- waitForAnimationToEnd
- takeScreenshot: new-task-discard
- tapOn: "Discard draft"
- extendedWaitUntil:
    notVisible: "Describe the task"
    timeout: 5000
# A picture attaches through the sheet's + menu's Photos, which opens the
# system's photo picker on the library `media/invite-bug.png` was added to. Note that the
# picker's grid names its photos differently by iOS version, so it is tried
# by each name, as Maestro's own gallery recipe does, and confirms with Add,
# or Done as iOS 27.2 names it; and that a sheet with a picture and no words
# keeps it as a draft too.
- launchApp:
    arguments:
      fixture: inbox
- addMedia:
    - "media/invite-bug.png"
- assertVisible: "Inbox"
- tapOn: "New task"
- assertVisible: "Describe the task"
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: new-task-add
- tapOn:
    id: "new-task-attach"
- tapOn: "Photos"
# Note that the waits on the photo picker and on the picked photo are long,
# because the picker's process and the Photos file provider start cold on a
# fresh simulator, which has taken a loaded runner thirteen seconds.
- extendedWaitUntil:
    visible: "Select up to .*"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: new-task-picker
- tapOn:
    id: "PXGGridLayout-Info"
    index: 0
    optional: true
# Note that the photo's other name is tapped only while nothing is picked,
# because on iOS 27.2 both names find the same photo, and a second tap
# takes it back.
- runFlow:
    when:
      visible: "Select Photos"
    commands:
      - tapOn:
          text: "Photo, .*"
          index: 0
          optional: true
- tapOn: "Add|Done"
- extendedWaitUntil:
    visible: "Picture 1"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: new-task-picture
- tapOn: "Cancel"
- assertVisible: "Discard draft?"
- tapOn: "Discard draft"
- extendedWaitUntil:
    notVisible: "Describe the task"
    timeout: 5000
