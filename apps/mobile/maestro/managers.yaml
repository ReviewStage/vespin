# managers.yaml -- the workspace's Managers: their section leading the Tasks list above Pinned, a Manager's row unread, its press opening its chat (its messages to the account alone, its other words left out), and Search finding it.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
# Launched on the host's Inbox fixture, whose workspace has Managers on and
# holds one, the release Manager, its chat said something the account has
# not read (`@repo/host/fixture-inbox`); nothing reaches a server.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- assertVisible: "Managers"
- assertVisible: "Release manager"
- assertVisible: "Pinned"
- waitForAnimationToEnd
- takeScreenshot: managers-list
# Its press opens its page on its chat: the two messages it sent the account,
# and the account's ask, but never the words it wrote to itself.
- tapOn: "Release manager"
- extendedWaitUntil:
    visible: "Left before it ships.*"
    timeout: 15000
- assertVisible: "On it. The invitations agent has its pull request open.*"
- assertNotVisible: "Reading the invitations task before I answer."
- waitForAnimationToEnd
- takeScreenshot: managers-chat
# Search finds it among the agents, by its name.
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Search
- runFlow:
    when:
      notVisible: "Search Vespin"
    commands:
      - tapOn:
          text: "Search"
          rightOf: "Tasks"
- tapOn: "Search Vespin"
- inputText: "release manager"
- extendedWaitUntil:
    visible: "Release manager"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: managers-search
