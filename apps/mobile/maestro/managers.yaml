# managers.yaml -- the workspace's Managers: their section leading the Tasks list above Pinned, a Manager's row unread, New Manager's sheet from the section's +, its press opening its chat (its messages to the account alone, its other words left out), its face changed in the face picker from its row's Change face…, its page's ⋯, and its Settings, a character and an emoji each in a color from the row of colors under the preview, its Settings from the chat's ⋯, its Overview pushed from the chat's bar (its counts, the agents it started, and their pull request), and Search finding it.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
# Launched on the host's Inbox fixture, whose workspace has Managers on and
# holds one, the release Manager, its chat said something the account has
# not read (`@repo/host/fixture-inbox`); nothing reaches a server.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- assertVisible: "Managers"
- assertVisible: "Release manager"
- assertVisible: "Pinned"
- waitForAnimationToEnd
- takeScreenshot: managers-list
# Its row's long press offers Change face… beside Rename, as the panel's
# Manager menu offers Change face: the face picker over the list, its face
# large over the row of colors; a face and a color picked show in the
# preview, and Done changes the face.
- longPressOn: "Release manager"
- tapOn: "Change face…"
- extendedWaitUntil:
    visible: "Speech bubble"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: managers-change-face
- tapOn: "Cat"
- tapOn: "Pink"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: managers-change-face-preview
- tapOn: "Done"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: managers-list-face
# The section's + opens New Manager: its name, its face, its repositories,
# the first picked its checkout, where it runs, and its model; Cancel leaves it.
- tapOn: "New Manager"
- extendedWaitUntil:
    visible: "Repositories"
    timeout: 10000
- inputText: "Launch captain"
# Note that the Face section stands between the name and the repositories, so Machine may sit under the keyboard until scrolled to.
- scrollUntilVisible:
    element: "Machine"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: managers-new
- tapOn: "Cancel"
- assertVisible: "Release manager"
# Its press opens its page on its chat: the two messages it sent the account,
# and the account's ask, but never the words it wrote to itself.
- tapOn: "Release manager"
- extendedWaitUntil:
    visible: "Left before it ships.*"
    timeout: 15000
- assertVisible: "On it. The invitations agent has its pull request open.*"
- assertNotVisible: "Reading the invitations task before I answer."
- waitForAnimationToEnd
- takeScreenshot: managers-chat
# Its ⋯ offers Change face… beside Settings…, opening the same picker over
# the page; Cancel puts it away, keeping the face.
- tapOn: "More"
- tapOn: "Change face…"
- extendedWaitUntil:
    visible: "Speech bubble"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: managers-page-face
- tapOn: "Cancel"
- waitForAnimationToEnd:
    timeout: 5000
# Its ⋯ offers Settings… in Rename's place: its name and model to change,
# its checkout and machine standing as it was made.
- tapOn: "More"
- tapOn: "Settings…"
- extendedWaitUntil:
    visible: "Fixed once the Manager is made."
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: managers-settings
# Its Face row opens the app's one icon picker on Characters, as the
# desktop's card opens it: the face standing large over the row of colors,
# gray first, and every character in its color. A face's press and a color
# chosen show in the preview, and Done changes the face.
- tapOn:
    id: "manager-face"
- extendedWaitUntil:
    visible: "Speech bubble"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: managers-face-picker
- tapOn: "Cat"
- tapOn: "Teal"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: managers-face-colors
- tapOn: "Done"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: managers-settings-face
# Emoji offers Recent, then every emoji by category, and the search finds
# one by its name; the preview shows it on its color's disc.
- tapOn:
    id: "manager-face"
- tapOn: "Emoji"
- extendedWaitUntil:
    visible: "Smileys & Emotion"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: managers-face-emoji
- tapOn: "Search faces"
- inputText: "fox"
- extendedWaitUntil:
    visible: "🦊"
    timeout: 10000
- takeScreenshot: managers-face-search
- tapOn: "🦊"
- tapOn: "Orange"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: managers-face-emoji-colors
- tapOn: "Done"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: managers-settings-emoji
- tapOn: "Cancel"
# The bar's Overview opens what the Manager is doing: its counts, the two
# agents it started, and the pull request the invitations agent opened.
- tapOn: "Overview"
- extendedWaitUntil:
    visible: "At a glance"
    timeout: 10000
- assertVisible: "2 agents working.*"
- assertVisible: "Build teammate invitations"
- scrollUntilVisible:
    element: "Invite a teammate by email"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: managers-overview
# Search finds it among the agents, by its name.
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Search
- runFlow:
    when:
      notVisible: "Search Vespin"
    commands:
      - tapOn:
          text: "Search"
          rightOf: "Tasks"
- tapOn: "Search Vespin"
- inputText: "release manager"
- extendedWaitUntil:
    visible: "Release manager"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: managers-search
