# managers.yaml -- the workspace's Managers: their section leading the Tasks list above Pinned, a Manager's row unread, New Manager's sheet from the section's +, its press opening its chat (its messages to the account alone, its other words left out, a message's reactions under it and any emoji given from its long press), its face changed from its row's Change face › and from its Settings' picker, each picker's bar of groups scrolling to one, its Settings from the chat's ⋯, its Overview pushed from the chat's bar (its counts, the agents it started, and their pull request), and Search finding it.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
# Launched on the host's Inbox fixture, whose workspace has Managers on and
# holds one, the release Manager, its chat said something the account has
# not read (`@repo/host/fixture-inbox`); nothing reaches a server.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- assertVisible: "Managers"
- assertVisible: "Release manager"
- assertVisible: "Pinned"
- waitForAnimationToEnd
- takeScreenshot: managers-list
# Its row's long press offers Change face › beside Rename, as the panel's
# Manager menu does: a submenu to each character, its faces in each color.
- longPressOn: "Release manager"
- tapOn: "Change face"
- tapOn: "Cat"
- extendedWaitUntil:
    visible: "Pink cat"
    timeout: 10000
- takeScreenshot: managers-change-face
- tapOn: "Pink cat"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: managers-list-face
# The section's + opens New Manager: its name, its face, its repositories,
# the first picked its checkout, where it runs, and its model; Cancel leaves it.
- tapOn: "New Manager"
- extendedWaitUntil:
    visible: "Repositories"
    timeout: 10000
- inputText: "Launch captain"
# Note that the Face section stands between the name and the repositories, so Machine may sit under the keyboard until scrolled to.
- scrollUntilVisible:
    element: "Machine"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: managers-new
- tapOn: "Cancel"
- assertVisible: "Release manager"
# Its press opens its page on its chat: the two messages it sent the account,
# and the account's ask, but never the words it wrote to itself.
- tapOn: "Release manager"
- extendedWaitUntil:
    visible: "Left before it ships.*"
    timeout: 15000
- assertVisible: "On it. The invitations agent has its pull request open.*"
- assertNotVisible: "Reading the invitations task before I answer."
- waitForAnimationToEnd
- takeScreenshot: managers-chat
# Under its first answer stand the reactions it was given, a chip to each:
# the account's 👍 among two lit, Grace's 🎉 and the Manager's 👀.
- assertVisible: "You and 1 other reacted with thumbs up"
- assertVisible: "1 reacted with :tada:"
- assertVisible: "1 reacted with :eyes:"
# Its long press offers Add reaction, 👍 and 👎 first, then More emoji…,
# which opens the app's one icon picker over every emoji, Quick reactions
# leading, searched by an emoji's Unicode name or a name Slack gives it.
- longPressOn: "On it. The invitations agent has its pull request open.*"
- tapOn: "Add reaction"
- assertVisible: "Thumbs down"
- waitForAnimationToEnd
- takeScreenshot: managers-chat-add-reaction
- tapOn: "More emoji…"
- extendedWaitUntil:
    visible: "Search emoji"
    timeout: 10000
- assertVisible: "Quick reactions"
- waitForAnimationToEnd
- takeScreenshot: managers-reaction-picker-open
# Its bar of categories across the top, as the panel's, scrolls the grid to
# one, ruled under it, its name standing at the top while its emoji scroll
# under it; the bar's is the first "Animals & Nature" on screen.
- tapOn:
    text: "Animals & Nature"
    index: 0
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: managers-reaction-picker-nature
- tapOn: "Search emoji"
- inputText: "heart"
- extendedWaitUntil:
    visible: "sparkling heart"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: managers-reaction-picker
# A pick gives the reaction and puts the picker away, its chip standing lit.
- tapOn: "red heart"
- extendedWaitUntil:
    visible: "You reacted with :heart:"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: managers-chat-reacted
# Its ⋯ offers Settings… in Rename's place: its name and model to change,
# its checkout and machine standing as it was made.
- tapOn: "More"
- tapOn: "Settings…"
- extendedWaitUntil:
    visible: "Fixed once the Manager is made."
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: managers-settings
# Its Face row opens the app's one icon picker over every face, as the
# desktop's card opens it, and a pick changes the face at once and puts the
# picker away.
- tapOn:
    id: "manager-face"
- extendedWaitUntil:
    visible: "Pink planet"
    timeout: 10000
- takeScreenshot: managers-face-picker
# Its bar of characters scrolls the picker to one, as the emoji's bar of
# categories does; the bar's is the first "Mug" on screen.
- tapOn:
    text: "Mug"
    index: 0
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: managers-face-picker-mug
- tapOn:
    text: "Planet"
    index: 0
- extendedWaitUntil:
    visible: "Pink planet"
    timeout: 10000
- tapOn: "Pink planet"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: managers-settings-face
- tapOn: "Cancel"
# The bar's Overview opens what the Manager is doing: its counts, the two
# agents it started, and the pull request the invitations agent opened.
- tapOn: "Overview"
- extendedWaitUntil:
    visible: "At a glance"
    timeout: 10000
- assertVisible: "2 agents working.*"
- assertVisible: "Build teammate invitations"
- scrollUntilVisible:
    element: "Invite a teammate by email"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: managers-overview
# Search finds it among the agents, by its name.
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Search
- runFlow:
    when:
      notVisible: "Search Vespin"
    commands:
      - tapOn:
          text: "Search"
          rightOf: "Tasks"
- tapOn: "Search Vespin"
- inputText: "release manager"
- extendedWaitUntil:
    visible: "Release manager"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: managers-search
