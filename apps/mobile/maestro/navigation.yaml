# navigation.yaml -- how the app is found around: an iPad in landscape standing the app sidebar with its places and Pinned, Following, and the member's sections as collections, Pinned picked to fill the list with its tasks and one opened beside it, the list's compose button opening New task, the pick kept across a rotation, Search beside it, and the workspace switcher's menu holding the account, which opens Settings; and a compact window's switcher and its tab bar minimized as a list scrolls down.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
# Note that the window is turned back upright however the flow ends, because
# a run left in landscape fails every flow after it.
onFlowComplete:
  - setOrientation: PORTRAIT
---
# Launched on the host's Inbox fixture, as `tasks.yaml` is, so the sidebar
# lists the fixture's pinned and sectioned tasks and no server is reached.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- assertVisible: "Recorded the invite flow"
- waitForAnimationToEnd
# A regular window, which stands "Choose an item" beside the Inbox's list, is
# turned to landscape, wide enough for three columns: the system's tab bar
# steps aside for the app sidebar, the Inbox with its count, Tasks, and
# Search, then Pinned, Following, and the member's sections, each one row
# with its count, the switcher at its head and nothing in its bar but the
# system's toggle. Pinned fills the list with its tasks alone, one opens
# beside it, and the list's compose button opens New task. The pick stands
# through a turn to portrait and back. The switcher's menu holds the
# account, which opens Settings, the sidebar's one way there besides ⌘,.
- runFlow:
    when:
      visible: "Choose an item"
    commands:
      - setOrientation: LANDSCAPE_LEFT
      - waitForAnimationToEnd
      - assertVisible: "Pinned"
      - takeScreenshot: ipad-sidebar
      - tapOn: "Pinned"
      - tapOn: "Weekly digest email"
      - assertVisible: "Created by .*"
      - waitForAnimationToEnd
      - takeScreenshot: ipad-sidebar-pinned
      - tapOn: "New task"
      - assertVisible: "Describe the task"
      - takeScreenshot: ipad-compose
      - tapOn: "Cancel"
      - waitForAnimationToEnd
      - setOrientation: PORTRAIT
      - waitForAnimationToEnd
      - setOrientation: LANDSCAPE_LEFT
      - waitForAnimationToEnd
      - assertVisible: "Weekly digest email"
      - takeScreenshot: ipad-sidebar-pinned-turned
      - tapOn: "Tasks"
      - waitForAnimationToEnd
      - takeScreenshot: ipad-sidebar-tasks
      - tapOn:
          id: "search-tab"
      - assertVisible: "Search Vespin"
      - waitForAnimationToEnd
      - takeScreenshot: ipad-sidebar-search
      - tapOn: "Inbox"
      - tapOn:
          id: "workspace-switcher"
      - assertVisible: ".*, Settings"
      - assertVisible: "Workspace settings|Settings…"
      - takeScreenshot: ipad-switcher-settings
      - tapOn:
          point: "75%, 90%"
      - setOrientation: PORTRAIT
      - waitForAnimationToEnd
# A compact window, the iPhone's, names its workspace as the Inbox's one
# leading button, whose list holds the workspaces, New workspace and
# Workspace settings, then the account opening Settings, and keeps the
# system's tab bar, minimizing it as the Tasks list scrolls down, the round +
# staying on its own glass beside it.
- runFlow:
    when:
      notVisible: "Choose an item"
    commands:
      - tapOn:
          id: "workspace-switcher"
      - assertVisible: ".*, Settings"
      - assertVisible: "Workspace settings|Settings…"
      - takeScreenshot: switcher-settings
      - tapOn:
          point: "50%, 90%"
      - waitForAnimationToEnd
      - tapOn: "Tasks"
      - assertVisible: "Weekly digest email"
      - waitForAnimationToEnd
      - takeScreenshot: tab-bar
      - scroll
      - waitForAnimationToEnd
      - takeScreenshot: tab-bar-minimized
