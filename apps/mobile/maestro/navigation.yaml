# navigation.yaml -- how the app is found around: an iPad in landscape standing iPadOS's own tab sidebar beside each tab's list and detail, Tasks with Pinned, Following, and the member's sections as groups atop its list, a task opened beside it and kept across a rotation, the detail's compose button opening New task, Search, and the workspace switcher's menu holding the account, which opens Settings; and a compact window's switcher and its tab bar minimized as a list scrolls down.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
# Note that the window is turned back upright however the flow ends, because
# a run left in landscape fails every flow after it.
onFlowComplete:
  - setOrientation: PORTRAIT
---
# Launched on the host's Inbox fixture, as `tasks.yaml` is, so Tasks lists
# the fixture's pinned and sectioned tasks and no server is reached.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- waitForAnimationToEnd
# A regular window, which stands "No item selected" beside the Inbox's list, is
# turned to landscape: the system's tab sidebar stands the Inbox with its
# count, Tasks, and Search beside the tab's list and detail. Tasks heads its
# list with Pinned, Following, and the member's sections as groups, one task
# opens beside it, and the detail's compose button opens New task. The open
# task stands through a turn to portrait and back. The switcher's menu holds
# the account, which opens Settings, the one way there besides ⌘,.
- runFlow:
    when:
      visible: "No item selected"
    commands:
      - setOrientation: LANDSCAPE_LEFT
      - waitForAnimationToEnd
      - takeScreenshot: ipad-tabs-inbox
      - runFlow:
          file: subflows/tab.yaml
          env:
            TAB: Tasks
      - assertVisible: "Pinned"
      - takeScreenshot: ipad-tabs-tasks
      - tapOn: "Weekly digest email"
      - assertVisible: "Created by .*"
      - waitForAnimationToEnd
      - takeScreenshot: ipad-tabs-task
      - tapOn: "New task"
      - assertVisible: "Describe the task"
      - takeScreenshot: ipad-compose
      - tapOn: "Cancel"
      - waitForAnimationToEnd
      - setOrientation: PORTRAIT
      - waitForAnimationToEnd
      - assertVisible: "Created by .*"
      - takeScreenshot: ipad-tabs-task-portrait
      - setOrientation: LANDSCAPE_LEFT
      - waitForAnimationToEnd
      - assertVisible: "Created by .*"
      - takeScreenshot: ipad-tabs-task-turned
      - runFlow:
          file: subflows/tab.yaml
          env:
            TAB: Search
      - assertVisible: "Search Vespin"
      - waitForAnimationToEnd
      - takeScreenshot: ipad-tabs-search
      - runFlow:
          file: subflows/tab.yaml
          env:
            TAB: Inbox
      - runFlow:
          file: subflows/switcher.yaml
      - assertVisible: "Settings"
      - assertVisible: "Manage"
      - takeScreenshot: ipad-switcher-settings
      - tapOn: "Settings(, .*)?"
      - waitForAnimationToEnd
      - assertVisible: "Ada Lovelace"
      - runFlow:
          file: subflows/close-sheet.yaml
      - extendedWaitUntil:
          notVisible: "Ada Lovelace"
          timeout: 5000
      - setOrientation: PORTRAIT
      - waitForAnimationToEnd
# A compact window, the iPhone's, names its workspace as the Inbox's one
# leading button, whose list holds the workspaces, New workspace, the
# workspace's Manage, then the account opening Settings, and keeps the
# system's tab bar, minimizing it as the Tasks list scrolls down, Search
# staying on its own glass beside it.
- runFlow:
    when:
      notVisible: "No item selected"
    commands:
      - runFlow:
          file: subflows/switcher.yaml
      - assertVisible: "Settings"
      - assertVisible: "Manage"
      - takeScreenshot: switcher-settings
      # Note that the switcher's menu is left by its own Settings, which
      # opens Settings, closed again by a swipe down, rather than by a tap
      # off the menu, which landed on its Relay row and switched the
      # workspace (vjnatc2).
      - tapOn: "Settings(, .*)?"
      - waitForAnimationToEnd
      - assertVisible: "Ada Lovelace"
      - runFlow:
          file: subflows/close-sheet.yaml
      - extendedWaitUntil:
          notVisible: "Ada Lovelace"
          timeout: 5000
      - runFlow:
          file: subflows/tab.yaml
          env:
            TAB: Tasks
      - assertVisible: "Weekly digest email"
      - waitForAnimationToEnd
      - takeScreenshot: tab-bar
      - scroll
      - waitForAnimationToEnd
      - takeScreenshot: tab-bar-minimized
