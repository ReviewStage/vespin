# tasks-view.yaml -- the Tasks tab's View options: its menu, the list grouped by status, the finished tasks of the past month shown, and Reset view putting the sidebar's view back.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
# Launched on the host's Inbox fixture, as `tasks.yaml` is, so the list holds
# the fixture's tasks, in two repositories and of every status, and no server
# is reached. Note that the state is cleared, so the view starts as the
# sidebar's whatever an earlier run chose.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- assertVisible: "Pinned"
- assertVisible: "ledger"
- tapOn: "View options"
- assertVisible: "Group by"
- waitForAnimationToEnd
- takeScreenshot: tasks-view-menu
# Group by stands its choices as a submenu over the menu. Note that its
# Status is tapped as the last in the tree, because the menu's own Status
# filter, under which the submenu opens, shares the name.
- tapOn: "Group by"
- waitForAnimationToEnd
- tapOn:
    text: "Status"
    index: -1
- waitForAnimationToEnd
# Note that a group's header is found by its title and count, "Todo, 1",
# because a row's status mark is heard as "Todo" too.
- assertVisible: "Todo, [0-9]+"
- assertNotVisible: "ledger"
# Show completed's Past month stands the reader's finished tasks by their
# status. Note that the fixture's only Done task of the reader's is a
# sub-task, which stands under its open parent, so its Canceled task heads
# a group of its own, which an iPhone stands below the fold.
- tapOn: "View options"
- tapOn: "Show completed"
- waitForAnimationToEnd
- tapOn: "Past month"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Canceled, [0-9]+"
    direction: DOWN
- takeScreenshot: tasks-view-status
# Reset view puts the sidebar's view back: the reader's open tasks by repository.
- tapOn: "View options"
- tapOn: "Reset view"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "ledger"
    direction: DOWN
- assertNotVisible: "Todo, [0-9]+"
