# accessibility.yaml -- the main screens at the largest accessibility text size (AX5, Accessibility XXXL): the Inbox, a thread, a decide's card with its Recommended tag, the Tasks tab, a task's page, an agent's page, a pull request's page, New task, Settings, and Settings' Workspace, Machines, and Integrations pages, each shot to check that words wrap rather than cut, rows grow and stack their ends under their titles, chips stand one to a line, and bars do not overflow.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
# Note that each screen is reached by a launch of its own rather than by going
# back, since a bar's back button at this size may stand as its chevron
# alone, and that the content size is a launch argument UIKit reads as the
# reader's own setting (`-UIPreferredContentSizeCategoryName`), which SwiftUI's
# text styles and React Native's font scale both follow. Each wait is capped
# at five seconds, since an agent's page draws its turn still running, whose
# mark never stops moving.
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
# The Inbox, on the host's Inbox fixture as `inbox.yaml` launches it, so no
# server is reached: each row heard as one element by its title, so a flow
# still finds it by the words on screen. Note that each launch knows the
# Inbox by its first row, the do ask under Pinned, because the pinned tasks'
# threads stand first, and at this size they push every other row below the
# window's foot.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      UIPreferredContentSizeCategoryName: UICTContentSizeCategoryAccessibilityXXXL
- extendedWaitUntil:
    visible: "Verify the digest's sender domain"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: accessibility-inbox
# A thread: its title as the page's heading, each message's writer line, and
# the composer docked at its foot, its row scrolled to below the pinned
# threads.
- runFlow:
    file: subflows/open-row.yaml
    env:
      ROW: "Recorded the invite flow"
# Note that the thread is scrolled up to its first message, since at this
# text size it opens at its newest, the first one's words above the window.
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: ".*walked the invite flow.*"
      DIRECTION: UP
- assertVisible: ".*walked the invite flow.*"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: accessibility-thread
# The Tasks tab: each row's status, end marks, and, in a compact window, key stacked under its name.
- launchApp:
    arguments:
      fixture: inbox
      UIPreferredContentSizeCategoryName: UICTContentSizeCategoryAccessibilityXXXL
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- extendedWaitUntil:
    visible: "Weekly digest email"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: accessibility-tasks
# A task's page: its name as a heading, and its status, priority, and
# assignee chips one to a line.
- runFlow:
    file: subflows/open-row.yaml
    env:
      ROW: "Teammate invitations"
- assertVisible: "Created by .*"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: accessibility-task
- scrollUntilVisible:
    element: "Agents"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: accessibility-task-agents
# An agent's page: its calls' lines wrapping rather than cut, and the held
# call's banner over the composer, which scrolls in place once it would
# stand taller than a share of the window, so the transcript stays in sight
# above it.
- launchApp:
    arguments:
      fixture: inbox
      agent: 5ebf7192-3a6c-4d84-8fac-6b7c8d9eafb5
      UIPreferredContentSizeCategoryName: UICTContentSizeCategoryAccessibilityXXXL
- extendedWaitUntil:
    visible: "Waiting on you.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: accessibility-agent
# A pull request's page: who opened it wrapping rather than cut, and its
# branches on two lines, the one it merges into, then the arrow and the one
# it merges from.
- launchApp:
    arguments:
      fixture: inbox
      agent: 5ebf7192-3a6c-4d84-8fac-6b7c8d9eafb5
      pullRequest: "128"
      UIPreferredContentSizeCategoryName: UICTContentSizeCategoryAccessibilityXXXL
- extendedWaitUntil:
    visible: "Ready to merge"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: accessibility-pull-request
# A decide's card: its Recommended tag on a line of its own under the
# option's label, its word whole rather than broken inside the tag. Note
# that on a phone the Inbox's row is scrolled to the window's middle
# (`scroll-to.yaml`), because at this size it stands most of a window tall
# five rows under the pinned threads, so a scroll that stops once it shows
# left its middle, where a tap lands, on the tab bar, whose Inbox tab took
# the tap and scrolled the list to its top; that an iPad's is scrolled to
# through `to-row.yaml`, because its list is a column beside the page it
# opens, which a scroll at the window's middle never moves; and that the tag
# is scrolled up to, because a thread opens at its newest end, its decide's
# options running down past the window at this size, the recommended one
# first.
- launchApp:
    arguments:
      fixture: inbox
      UIPreferredContentSizeCategoryName: UICTContentSizeCategoryAccessibilityXXXL
- extendedWaitUntil:
    visible: "Verify the digest's sender domain"
    timeout: 30000
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: "How should a finished turn end\\?"
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    file: subflows/to-row.yaml
    env:
      ROW: "How should a finished turn end\\?"
- tapOn: "How should a finished turn end\\?"
- scrollUntilVisible:
    element: "Recommended"
    direction: UP
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: accessibility-decide
# New task, the sheet the Inbox bar's compose opens.
- launchApp:
    arguments:
      fixture: inbox
      UIPreferredContentSizeCategoryName: UICTContentSizeCategoryAccessibilityXXXL
- extendedWaitUntil:
    visible: "Verify the digest's sender domain"
    timeout: 30000
- tapOn: "New task"
- assertVisible: "Describe the task"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: accessibility-new-task
# Settings, which the account's photo in the Inbox's bar opens.
- launchApp:
    arguments:
      fixture: inbox
      UIPreferredContentSizeCategoryName: UICTContentSizeCategoryAccessibilityXXXL
- extendedWaitUntil:
    visible: "Verify the digest's sender domain"
    timeout: 30000
- tapOn:
    id: "workspace-switcher"
# Note that the switcher is waited for before its list is scrolled to the
# account's row, which at this text size a short window, the iPhone Duo's,
# stands below its foot, and that an iPad's switcher, a popover down the
# window's leading quarter that a swipe off it closes, is scrolled by a drag
# inside it, its rows at this size running three pages.
- extendedWaitUntil:
    visible: "Ada Lovelace, Personal workspace"
    timeout: 10000
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - scrollUntilVisible:
          element: "Settings(, .*)?"
          direction: DOWN
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - repeat:
          times: 6
          while:
            notVisible: "Settings(, .*)?"
          commands:
            - swipe:
                start: "20%, 45%"
                end: "20%, 18%"
                duration: 1000
- tapOn: "Settings(, .*)?"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: accessibility-settings
# Settings' Workspace page: each member's role stacked under their address.
- launchApp:
    arguments:
      fixture: inbox
      UIPreferredContentSizeCategoryName: UICTContentSizeCategoryAccessibilityXXXL
- extendedWaitUntil:
    visible: "Verify the digest's sender domain"
    timeout: 15000
- tapOn:
    id: "workspace-switcher"
- tapOn: "Settings(, .*)?"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "settings-workspace"
- waitForAnimationToEnd:
    timeout: 5000
# Note that at this size the workspace's own rows can stand a screen tall, so the members are scrolled to.
- scrollUntilVisible:
    element: "Grace Hopper"
- assertVisible: "Grace Hopper"
- takeScreenshot: accessibility-settings-workspace
# Settings' Machines page: each machine's facts line wrapped under its name.
- launchApp:
    arguments:
      fixture: inbox
      UIPreferredContentSizeCategoryName: UICTContentSizeCategoryAccessibilityXXXL
- extendedWaitUntil:
    visible: "Verify the digest's sender domain"
    timeout: 15000
- tapOn:
    id: "workspace-switcher"
- tapOn: "Settings(, .*)?"
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element: "Machines"
- tapOn: "Machines"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Ada's MacBook Pro"
- takeScreenshot: accessibility-settings-machines
# Settings' Integrations page: each account's Connect or Reconnect stacked under its lines.
- launchApp:
    arguments:
      fixture: inbox
      UIPreferredContentSizeCategoryName: UICTContentSizeCategoryAccessibilityXXXL
- extendedWaitUntil:
    visible: "Verify the digest's sender domain"
    timeout: 15000
- tapOn:
    id: "workspace-switcher"
- tapOn: "Settings(, .*)?"
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element: "Integrations"
- tapOn: "Integrations"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Linear"
- takeScreenshot: accessibility-settings-integrations
