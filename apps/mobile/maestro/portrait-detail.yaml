# portrait-detail.yaml -- a portrait iPad's two columns: a task's agent and its pull request pushed on the Tasks tab's own stack over the whole window, as a compact window pushes them, each under the stack's bar with its Back, and Back returning to the split view with the task still picked; skipped on a compact window, which stands no list beside its detail.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
# Note that each wait for the screen to settle is capped at five seconds,
# because the agent's page draws its turn still running, whose mark never
# stops moving, so an uncapped wait always ran to Maestro's fifteen.
onFlowComplete:
  - setOrientation: PORTRAIT
---
# Launched on the host's Inbox fixture, whose invitations task holds its
# agent and the pull request #128 it opened (`@repo/host/fixture-inbox`);
# nothing reaches a server.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
# A regular window in portrait stands "No item selected" beside the Inbox's
# list; a compact one stands the list alone, and skips the rest.
- runFlow:
    when:
      visible: "No item selected"
    commands:
      - setOrientation: PORTRAIT
      - waitForAnimationToEnd:
          timeout: 5000
      # Each tab opens on its list beside "No item selected" or "No task
      # selected" while nothing is picked, the Inbox's and Tasks' alike, never on the detail alone with
      # its list folded behind the sidebar button.
      - assertVisible: "Recorded the invite flow"
      - takeScreenshot: portrait-inbox
      - runFlow:
          file: subflows/tab.yaml
          env:
            TAB: Tasks
      - assertVisible: "Pinned"
      - assertVisible: "No task selected"
      - takeScreenshot: portrait-tasks
      - tapOn: "Teammate invitations"
      - assertVisible: "Agents"
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: portrait-task
      # The agent opens over the whole window on the tab's stack, under the
      # stack's bar: its name, Archive and Pin, its ⋯, and Back, with the
      # composer docked at its foot.
      # Note that the tap is never retried, because a retry on a screen still
      # pushing lands on the page opened.
      - tapOn:
          text: "Build teammate invitations"
          retryTapIfNoChange: false
      - extendedWaitUntil:
          visible: "Add a way to resend an invite that expired."
          timeout: 30000
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: portrait-agent
      # Back pops the tab's stack, landing on the split view, the task
      # still picked.
      - tapOn:
          id: "BackButton"
      - waitForAnimationToEnd:
          timeout: 5000
      - assertVisible: "Agents"
      - takeScreenshot: portrait-agent-back
      # A tap on the agent's row, one element with its pull request's
      # number in its line, opens the agent, never the pull request.
      - tapOn:
          text: "Build teammate invitations"
          retryTapIfNoChange: false
      - extendedWaitUntil:
          visible: "Add a way to resend an invite that expired."
          timeout: 30000
      - assertNotVisible: "Ready to merge"
      - tapOn:
          id: "BackButton"
      - waitForAnimationToEnd:
          timeout: 5000
      - assertVisible: "Agents"
      # The pull request opens on the same stack from its agent's row's
      # long-press menu, its bar standing Open on GitHub and Refresh as
      # glyphs, its merge under the checks. Note that the item is matched with
      # or without its subtitle, because iPadOS 27 labels a menu item by both
      # ("Open pull request, #128 · Open") where 26 names its title alone.
      - runFlow:
          file: subflows/row-menu.yaml
          env:
            ROW: Build teammate invitations
            ITEM: "Open pull request(, .*)?"
      - tapOn: "Open pull request(, .*)?"
      - extendedWaitUntil:
          visible: "Ready to merge"
          timeout: 30000
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: portrait-pull-request
      - tapOn:
          id: "BackButton"
      - waitForAnimationToEnd:
          timeout: 5000
      - assertVisible: "Agents"
      - takeScreenshot: portrait-pull-request-back
