# description-media.yaml -- a description's comment counts, table, file, picture and diagram drawn in its field as its page reads them, a block's count of open threads at its first line's end, the table as its grid, a PDF as its card, a picture at its own place in its line, and a Mermaid diagram as its picture under its head, while the words are edited in place.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
# Launched on the host's Inbox fixture, as every flow is, so no server is
# reached; the fixture's Teammate invitations holds a table, then a PDF,
# "Invite flow spec", and a picture, "The invite page", and, as
# `descriptionDiagram` asks of this flow alone, ends with a Mermaid diagram
# under a heading an open thread is on.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      descriptionDiagram: "true"
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- scrollUntilVisible:
    element: "Teammate invitations"
- tapOn: "Teammate invitations"
- assertVisible: "Created by .*"
# A press on the words puts the description in its field, as
# `description-edit.yaml` presses them.
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - scrollUntilVisible:
          element: "Only an admin can add.*"
          centerElement: true
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - runFlow:
          file: subflows/scroll-in.yaml
          env:
            ELEMENT: "Only an admin can add.*"
            BESIDE: "true"
      - swipe:
          start: "85%, 65%"
          end: "85%, 45%"
          duration: 1200
- tapOn: "Only an admin can add.*"
- extendedWaitUntil:
    visible:
      id: "description-words"
    timeout: 10000
- waitForAnimationToEnd
# A line typed in Context, far above the diagram's heading, which holds an
# open thread as `descriptionDiagram` asks: the heading's count stays beside
# the heading, on its block, rather than on the place it stood in the words
# before the typing moved them.
- inputText: "A line typed above. "
- pressKey: Enter
- inputText: "And another."
- waitForAnimationToEnd
# The words stay one element of their own beside the pictures, cells and
# counts the field lists, which reads them and takes keys: the lines just
# typed through it stand in its words.
- assertVisible:
    id: "description-words"
    text: "(?s).*A line typed above.*And another.*"
# The count of the open thread on Context, the description's first block,
# stands at its line's trailing edge in the field, as the read rows stand it,
# heard as its count of comments.
- runFlow:
    file: subflows/scroll-in.yaml
    env:
      ELEMENT: "1 comment"
      DIRECTION: UP
      BESIDE: ${FLOATING_TABS}
- waitForAnimationToEnd
- takeScreenshot: description-media-comments
# The field draws the table as its grid, each cell read as its words, where
# it once drew a card of the table's first line.
- runFlow:
    file: subflows/scroll-in.yaml
    env:
      ELEMENT: "Send the invite"
      BESIDE: ${FLOATING_TABS}
- waitForAnimationToEnd
- takeScreenshot: description-media-table
# The field draws the PDF as its card, heard by its name and size, and the
# picture as the picture, heard by its words, each on a line of its own,
# where it once drew each as a pill of the word "Picture".
- runFlow:
    file: subflows/scroll-in.yaml
    env:
      ELEMENT: "Invite flow spec.*"
      BESIDE: ${FLOATING_TABS}
- waitForAnimationToEnd
- takeScreenshot: description-media-file
- runFlow:
    file: subflows/scroll-in.yaml
    env:
      ELEMENT: "The invite page"
      BESIDE: ${FLOATING_TABS}
- waitForAnimationToEnd
- takeScreenshot: description-media-picture
# The diagram stands under its head as the picture the app's Mermaid
# renderer drew, where it once drew a card saying to edit it on the desktop.
- runFlow:
    file: subflows/scroll-in.yaml
    env:
      ELEMENT: "Diagram"
      BESIDE: ${FLOATING_TABS}
- extendedWaitUntil:
    visible: "Diagram"
    timeout: 10000
# The diagram's heading still stands its count, just over the diagram's head.
- assertVisible:
    text: "1 comment"
    above: "Diagram"
- waitForAnimationToEnd
- takeScreenshot: description-media-diagram
