# description-edit.yaml -- a task's description edited whole, as Notion edits a page: its blocks drawn with no syntax, a table as a card, the selection formatted from the edit menu's Format and the bar over the keyboard, a person mentioned from an `@`, and a list's item moved in and back out.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
# Launched on the host's Inbox fixture, as every flow is, so no server is
# reached; the fixture's Teammate invitations holds a description with
# headings, lists, a quote, code, a table and mentions, and answers a save.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- scrollUntilVisible:
    element: "Teammate invitations"
- tapOn: "Teammate invitations"
- assertVisible: "Created by .*"
# The Description's Edit, heard as Edit description, opens the sheet on the
# description as the page read it: headings, bold and italic words, the
# lists' marks and the quote drawn as the page draws them, with no Markdown
# syntax, and the table as a card the phone does not edit.
- runFlow:
    file: subflows/scroll-in.yaml
    env:
      ELEMENT: "Edit description"
      BESIDE: ${FLOATING_TABS}
- tapOn: "Edit description"
- extendedWaitUntil:
    visible:
      id: "description-words"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: description-edit-sheet
# A word selected opens the system's edit menu, its Format after the
# system's own acts, a page on: Bold, Italic, Strikethrough, Code and Link,
# then Turn into, in the panel's words. Note that the menu's next page is
# the system's own chevron, which VoiceOver hears as Next Page; a wide
# window stands Format on the first page already. The field is one element,
# its whole document its words, as Notes' page is, so the taps land at its
# leading edge halfway down, where a line's first word stands rather than
# the blank past a short line's end. The word is selected as a person
# selects without a double tap: a tap takes the keyboard and stands the
# caret at the word's end, a tap on the caret opens the edit menu, and its
# Select takes the word, so no step waits on a double tap's timing.
- tapOn:
    id: "description-words"
    point: "8%,50%"
- waitForAnimationToEnd
- tapOn:
    id: "description-words"
    point: "8%,50%"
- tapOn: "Select"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible: "Format"
    commands:
      - tapOn: "Next Page"
- tapOn: "Format"
- assertVisible: "Turn into"
- waitForAnimationToEnd
- takeScreenshot: description-edit-format
- tapOn: "Italic"
# The bar over the keyboard holds the same marks, Link, Mention, and Turn
# into, each heard by its words.
- assertVisible: "Bold"
- assertVisible: "Mention"
- takeScreenshot: description-edit-bar
# Mention types an `@`, which offers what the task can mention over the
# keyboard, as a composer's `@` offers it; a pick stands as the person's
# pill in the word's place. The caret goes to the end of the selected
# word's line first, so the person is mentioned after the word rather than
# in its place.
- tapOn:
    id: "description-words"
    point: "95%,50%"
- inputText: " "
- tapOn: "Mention"
- inputText: "Ad"
- assertVisible: "Ada Lovelace"
- waitForAnimationToEnd
- takeScreenshot: description-edit-mention
- tapOn: "Ada Lovelace"
- waitForAnimationToEnd
- assertNotVisible: "Ada Lovelace.*You"
- takeScreenshot: description-edit-mentioned
# A list made on a new line stands Indent and Outdent on the bar while the
# caret is in its items, as Notion's bar does. Text first makes the new line
# a paragraph whatever the mentioned line was, so Bulleted list turns it
# into a list rather than back out of one. Indent moves Model under Plan,
# and a Return on the empty item under it takes that item back out, so Ship
# stands beside Plan; `pill-field.yaml` reads the Markdown each move writes,
# which the sheet does not show.
- pressKey: Enter
- tapOn: "Turn into"
- tapOn: "Text"
- tapOn: "Turn into"
- tapOn: "Bulleted list"
- inputText: "Plan"
- pressKey: Enter
- inputText: "Model"
- tapOn: "Indent"
- assertVisible: "Outdent"
- waitForAnimationToEnd
- takeScreenshot: description-edit-nested
- pressKey: Enter
- pressKey: Enter
- inputText: "Ship"
- waitForAnimationToEnd
- takeScreenshot: description-edit-nested-out
