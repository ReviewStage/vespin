# description-edit.yaml -- a task's description edited in place on its page in one view, as the desktop and Notion edit one: a press on its words at rest putting the caret there, its blocks drawn with no syntax, the bar over the keyboard, a person mentioned from an `@`, a list's item moved in and back out, and the system's ✓ putting the keyboard away.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
# Launched on the host's Inbox fixture, as every flow is, so no server is
# reached; the fixture's Teammate invitations holds a description with
# headings, lists, a quote, code, a table and mentions, and answers a save.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- scrollUntilVisible:
    element: "Teammate invitations"
- tapOn: "Teammate invitations"
- assertVisible: "Created by .*"
# The description stands as one field, read-only at rest, each paragraph
# reached by its words; a press on Context's paragraph takes the keyboard
# with the caret where it landed, with no swap to other rows: headings, bold
# and italic words, the lists' marks and the quote drawn with no Markdown
# syntax, and the table as its grid, which the phone does not edit.
# Note that no step selects words for the edit menu's Format here: the field
# stands as tall as the description, so a tap at a share of its height can
# land off the screen.
# Note that on an iPhone the words are scrolled to the screen's middle, clear
# of the floating tab bar, which takes a press on words scrolled only into
# sight at the screen's foot; an iPad's split view scrolls its detail column
# beside the list, and one more swipe draws the words up from its foot.
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - scrollUntilVisible:
          element: "Only an admin can add.*"
          centerElement: true
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - runFlow:
          file: subflows/scroll-in.yaml
          env:
            ELEMENT: "Only an admin can add.*"
            BESIDE: "true"
      - swipe:
          start: "85%, 65%"
          end: "85%, 45%"
          duration: 1200
- tapOn: "Only an admin can add.*"
# The words take the keyboard where the press landed, in place, the system's
# ✓ standing in the bar while they do.
- extendedWaitUntil:
    visible: "Done editing description"
    timeout: 10000
# The page stands where the press left it, the words pressed still in sight,
# rather than jumping to its top with the field below the fold, as it did
# when the read rows gave way to the field.
- assertVisible:
    id: "description-words"
    text: "(?s).*Only an admin can add.*"
- waitForAnimationToEnd
- takeScreenshot: description-edit-inline
# The bar over the keyboard holds the marks, Link, Mention, and Turn into,
# each heard by its words.
- assertVisible: "Bold"
- assertVisible: "Mention"
- takeScreenshot: description-edit-bar
# Mention types an `@`, which offers what the task can mention over the
# keyboard, as a composer's `@` offers it; a pick stands as the person's
# pill in the word's place, here in the middle of the paragraph pressed.
# Note that the offer's row is found under its People heading, since the
# page's Assignee chip names Ada Lovelace too; the heading goes with the
# offer once the pick closes it.
- inputText: " "
- tapOn: "Mention"
- inputText: "Ad"
- assertVisible:
    text: "Ada Lovelace"
    below: "People"
- waitForAnimationToEnd
- takeScreenshot: description-edit-mention
- tapOn:
    text: "Ada Lovelace"
    below: "People"
- waitForAnimationToEnd
- assertNotVisible: "People"
- takeScreenshot: description-edit-mentioned
# A list made on a new line stands Indent and Outdent on the bar while the
# caret is in its items, as Notion's bar does. Text first makes the new line
# a paragraph whatever the mentioned line was, so Bulleted list turns it
# into a list rather than back out of one. Indent moves Model under Plan,
# and a Return on the empty item under it takes that item back out, so Ship
# stands beside Plan; `pill-field.yaml` reads the Markdown each move writes,
# which the sheet does not show. Note that the list is made right above a
# paragraph, with no blank line between, on purpose: a key typed there once
# drew the new item into the paragraph after it, which a list at the
# document's end never shows.
- pressKey: Enter
- tapOn: "Turn into"
- tapOn: "Text"
- tapOn: "Turn into"
- tapOn: "Bulleted list"
- inputText: "Plan"
- pressKey: Enter
- inputText: "Model"
- tapOn: "Indent"
- assertVisible: "Outdent"
- waitForAnimationToEnd
- takeScreenshot: description-edit-nested
- pressKey: Enter
- pressKey: Enter
- inputText: "Ship"
- waitForAnimationToEnd
- takeScreenshot: description-edit-nested-out
# The system's ✓, in the page's bar on the iPhone and the detail column's
# on an iPad, puts the keyboard away and saves what is typed, the words
# standing at rest again. Note that the fixture answers the save without
# changing the description it serves.
- tapOn: "Done editing description"
- extendedWaitUntil:
    notVisible: "Done editing description"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: description-edit-done
# Typed at the foot of a long description, the caret's line stays in sight
# over the keyboard and over what an `@` offers: docked over the keyboard on
# an iPhone, and at the detail column's foot on an iPad. A press on the last
# task list's words puts the caret in it, and Mention's offer comes up under
# it; the screenshot shows the line being typed above the offer. Note that
# the list is found by its last item's words, which the quote words apart,
# and pressed past its last line's end, so the caret stands after a word: an
# `@` typed inside one takes the rest of that word with it, as the panel's
# does.
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - scrollUntilVisible:
          element: ".*A withdrawn link grants nothing.*"
          centerElement: true
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - runFlow:
          file: subflows/scroll-in.yaml
          env:
            ELEMENT: ".*A withdrawn link grants nothing.*"
            BESIDE: "true"
      - swipe:
          start: "85%, 65%"
          end: "85%, 45%"
          duration: 1200
- tapOn:
    text: ".*A withdrawn link grants nothing.*"
    point: "97%,75%"
- extendedWaitUntil:
    visible: "Done editing description"
    timeout: 10000
- inputText: " for "
- tapOn: "Mention"
- inputText: "Ad"
- assertVisible:
    text: "Ada Lovelace"
    below: "People"
- waitForAnimationToEnd
- takeScreenshot: description-edit-foot-mention
- tapOn:
    text: "Ada Lovelace"
    below: "People"
- waitForAnimationToEnd
- takeScreenshot: description-edit-foot-mentioned
- tapOn: "Done editing description"
- extendedWaitUntil:
    notVisible: "Done editing description"
    timeout: 10000
