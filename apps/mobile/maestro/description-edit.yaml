# description-edit.yaml -- a task's description edited in place on its page, as the desktop and Notion edit one: a press on its words putting the caret there, its blocks drawn with no syntax, a table as a card, the bar over the keyboard, a person mentioned from an `@`, a list's item moved in and back out, and Done.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
# Launched on the host's Inbox fixture, as every flow is, so no server is
# reached; the fixture's Teammate invitations holds a description with
# headings, lists, a quote, code, a table and mentions, and answers a save.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- scrollUntilVisible:
    element: "Teammate invitations"
- tapOn: "Teammate invitations"
- assertVisible: "Created by .*"
# A press on the description's words puts them in its field where the page
# read them, the caret where the press landed, the sections around it
# standing as they stood: headings, bold and italic words, the lists' marks
# and the quote drawn as the page draws them, with no Markdown syntax, and
# the table as a card the phone does not edit. The press lands in the middle
# of the Context's paragraph, read as its words before the field stands.
# Note that no step selects words for the edit menu's Format here: the field
# stands as tall as the description, so a tap at a share of its height can
# land off the screen.
# Note that on an iPhone the words are scrolled to the screen's middle, clear
# of the floating tab bar, which takes a press on words scrolled only into
# sight at the screen's foot.
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - scrollUntilVisible:
          element: "Only an admin can add.*"
          centerElement: true
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - tapOn: "Only an admin can add.*"
# Note that an iPad's split view edits the description in its sheet until an
# offer for an `@` stands over the keyboard there: Edit opens it, and a tap
# on its words, which fill the sheet, takes the keyboard.
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - runFlow:
          file: subflows/scroll-in.yaml
          env:
            ELEMENT: "Edit description"
            BESIDE: "true"
      - tapOn: "Edit description"
      - extendedWaitUntil:
          visible:
            id: "description-words"
          timeout: 10000
      - tapOn:
          id: "description-words"
          point: "8%,50%"
- extendedWaitUntil:
    visible:
      id: "description-words"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: description-edit-inline
# The bar over the keyboard holds the marks, Link, Mention, and Turn into,
# each heard by its words.
- assertVisible: "Bold"
- assertVisible: "Mention"
- takeScreenshot: description-edit-bar
# Mention types an `@`, which offers what the task can mention over the
# keyboard, as a composer's `@` offers it; a pick stands as the person's
# pill in the word's place, here in the middle of the paragraph pressed.
# Note that the offer's row is found by the reader's "You", since the page's
# Assignee chip names Ada Lovelace too.
- inputText: " "
- tapOn: "Mention"
- inputText: "Ad"
- assertVisible: "Ada Lovelace.*You"
- waitForAnimationToEnd
- takeScreenshot: description-edit-mention
- tapOn: "Ada Lovelace.*You"
- waitForAnimationToEnd
- assertNotVisible: "Ada Lovelace.*You"
- takeScreenshot: description-edit-mentioned
# A list made on a new line stands Indent and Outdent on the bar while the
# caret is in its items, as Notion's bar does. Text first makes the new line
# a paragraph whatever the mentioned line was, so Bulleted list turns it
# into a list rather than back out of one. Indent moves Model under Plan,
# and a Return on the empty item under it takes that item back out, so Ship
# stands beside Plan; `pill-field.yaml` reads the Markdown each move writes,
# which the sheet does not show. Note that the list is made right above a
# paragraph, with no blank line between, on purpose: a key typed there once
# drew the new item into the paragraph after it, which a list at the
# document's end never shows.
- pressKey: Enter
- tapOn: "Turn into"
- tapOn: "Text"
- tapOn: "Turn into"
- tapOn: "Bulleted list"
- inputText: "Plan"
- pressKey: Enter
- inputText: "Model"
- tapOn: "Indent"
- assertVisible: "Outdent"
- waitForAnimationToEnd
- takeScreenshot: description-edit-nested
- pressKey: Enter
- pressKey: Enter
- inputText: "Ship"
- waitForAnimationToEnd
- takeScreenshot: description-edit-nested-out
# Done, in the page's bar on the iPhone, saves what is typed and leaves the
# field once the service holds it, the page reading the words again; an
# iPad's sheet saves with Save. Note that the fixture
# answers the save without changing the description it serves, so the words
# read afterwards are the fixture's own.
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - tapOn: "Done editing description"
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - tapOn: "Save"
- extendedWaitUntil:
    notVisible:
      id: "description-words"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: description-edit-done
