# keep.yaml -- what a long press offers on a thread's picture and its message, and the full-screen viewer's share button: the picture's Copy, Save to Photos, and Share…, and the message's Copy message.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
---
# Launched on the host's Inbox fixture, as `inbox.yaml` is, so the thread and
# its picture's bytes are the fixture's (`@repo/host/fixture-inbox`) and no
# server is reached. Nothing here presses an act, so no pasteboard, Photos, or
# share sheet is reached either; the menus are shot and closed.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- tapOn: "Recorded the invite flow"
- assertVisible: ".*walked the invite flow.*"
- waitForAnimationToEnd
# The picture's menu, which the system opens over it lifted.
- longPressOn: "The invite page"
- assertVisible: "Save to Photos"
- assertVisible: "Share…"
- waitForAnimationToEnd
- takeScreenshot: keep-picture-menu
# Note that a menu is put away by a swipe down at a point, the one place this
# flow acts on a position, because iOS takes everything under an open context
# menu out of the accessibility tree, so no named control exists to tap; a
# tap at a point could land on a link chip once the menu is gone, which opens
# its sheet instead. The swipe starts at the window's trailing edge, past
# where the menu stands, and the flow then asserts the menu gone and the page
# as it stood, the item the menu opened on still there, so a swipe that ever
# lands on something fails here.
- swipe:
    start: "94%, 45%"
    end: "94%, 60%"
- waitForAnimationToEnd
- assertNotVisible: "Save to Photos"
- assertVisible: "The invite page"
# The message's own menu, opened on its words. Note that they are scrolled to
# the window's middle first, since the picture's menu closing left them under
# the bar, where the long press landed on it instead.
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: ".*walked the invite flow.*"
      DIRECTION: UP
- longPressOn: ".*walked the invite flow.*"
- assertVisible: "Copy message"
- waitForAnimationToEnd
- takeScreenshot: keep-message-menu
# The message's menu is put away the same way, then asserted gone with the message still there.
- swipe:
    start: "94%, 45%"
    end: "94%, 60%"
- waitForAnimationToEnd
- assertNotVisible: "Copy message"
- assertVisible: ".*walked the invite flow.*"
# The picture opens full screen in the app's viewer, whose share sheet copies
# and saves it as the system's own wording names those acts.
- tapOn: "The invite page"
- assertVisible:
    id: "picture-viewer-close"
- waitForAnimationToEnd
- tapOn:
    id: "picture-viewer-share"
- assertVisible: "Save Image"
- assertVisible: "Copy"
- waitForAnimationToEnd
- takeScreenshot: keep-viewer-share
# The share sheet is put away as the system puts a sheet away, by a swipe down.
- swipe:
    start: "50%, 55%"
    end: "50%, 98%"
- waitForAnimationToEnd
- assertNotVisible: "Save Image"
- tapOn:
    id: "picture-viewer-close"
