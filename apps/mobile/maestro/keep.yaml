# keep.yaml -- what a long press offers on a thread's picture, its message, and a task's chip in its words, and the full-screen viewer's share button: the picture's Copy, Save to Photos, and Share…, the message's Copy message, the chip's own Open link and Copy link, which open nothing until pressed, and the chip's plain tap, which opens its task.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
---
# Launched on the host's Inbox fixture, as `inbox.yaml` is, so the thread and
# its picture's bytes are the fixture's (`@repo/host/fixture-inbox`) and no
# server is reached. Nothing here presses an act but the chip's Copy link,
# which closes its menu by its own item and writes only the simulator's
# pasteboard, so no Photos or share sheet is reached; the menus are shot and
# closed.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- tapOn: "Recorded the invite flow"
- assertVisible: ".*walked the invite flow.*"
- waitForAnimationToEnd
# The picture's menu, which the system opens over it lifted.
- longPressOn: "The invite page"
- assertVisible: "Save to Photos"
- assertVisible: "Share…"
- waitForAnimationToEnd
- takeScreenshot: keep-picture-menu
# Note that a menu is put away by a tap off it at a point, through the
# flows' own `dismiss.yaml`, the one place this flow acts on a position,
# because iOS takes everything under an open context menu out of the
# accessibility tree, so no named control exists to tap, and a swipe off it
# leaves it standing. The point is the window's trailing margin beside the
# thread's recording, where nothing presses even with no menu standing, and
# the flow then asserts the menu gone and the page as it stood, the item the
# menu opened on still there, so a tap that ever lands on something fails
# here.
- runFlow:
    file: subflows/dismiss.yaml
    env:
      POINT: "94%, 60%"
- assertNotVisible: "Save to Photos"
- assertVisible: "The invite page"
# The message's own menu, opened on its words. Note that the long press lands
# on a paragraph of plain words, never one holding a mention's chip, whose own
# hold opens the chip's menu instead; and that the words are scrolled to the
# window's middle first, since the picture's menu closing left them under the
# bar, where the long press landed on it instead.
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: "The recording is under this.*"
      DIRECTION: UP
- longPressOn: "The recording is under this.*"
- assertVisible: "Copy message"
- waitForAnimationToEnd
- takeScreenshot: keep-message-menu
# The message's menu is put away the same way, then asserted gone with the message still there.
- runFlow:
    file: subflows/dismiss.yaml
    env:
      POINT: "94%, 60%"
- assertNotVisible: "Copy message"
- assertVisible: "The recording is under this.*"
# The task's chip held, leading its own line in the same message: its own
# menu, UIKit's, never the message's beside it, as a link held in a Messages
# bubble opens its own. Note that the chip stands in its line's words, where
# it is no element of its own, so it is held a little in from the line's
# leading edge, as `person.yaml` holds a person's; and that its menu is put
# away by its own Copy link, which copies the chip's address alone.
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: ".*holds the rest of the work.*"
- longPressOn:
    text: ".*holds the rest of the work.*"
    point: "6%, 50%"
- assertVisible: "Copy link"
- assertNotVisible: "Copy message"
- waitForAnimationToEnd
- takeScreenshot: keep-chip-menu
- tapOn: "Copy link"
- waitForAnimationToEnd
# The hold opened no link as the finger lifted: the thread still stands in
# front, with no task page over it and no browser.
- assertNotVisible: "Copy link"
- assertVisible: ".*holds the rest of the work.*"
- assertNotVisible: "Agents"
# The picture opens full screen in the app's viewer, whose share sheet copies
# and saves it as the system's own wording names those acts. Note that it is
# scrolled back to first, since the chip's line stood under it.
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: "The invite page"
      DIRECTION: UP
- tapOn: "The invite page"
- assertVisible:
    id: "picture-viewer-close"
- waitForAnimationToEnd
- tapOn:
    id: "picture-viewer-share"
- assertVisible: "Save Image"
- assertVisible: "Copy"
- waitForAnimationToEnd
- takeScreenshot: keep-viewer-share
# The share sheet is put away as the system puts a sheet away, by a swipe down
# on the sheet itself. Note that the swipe starts on the sheet's own header,
# the file's name, since iOS 26 floats the sheet over the viewer with nothing
# dimmed above it, and a swipe begun just above it drags the viewer closed
# instead; the viewer is then asserted still open.
- swipe:
    start: "50%, 63%"
    end: "50%, 98%"
- waitForAnimationToEnd
- assertNotVisible: "Save Image"
- assertVisible:
    id: "picture-viewer-close"
- tapOn:
    id: "picture-viewer-close"
- waitForAnimationToEnd
# The chip pressed: a plain tap opens its task's page, on the Inbox's own
# stack in a compact window, from which Back lands on the thread again; a
# regular window selects the task on Tasks beside its list instead
# (`related.yaml`).
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: ".*holds the rest of the work.*"
- tapOn:
    text: ".*holds the rest of the work.*"
    point: "6%, 50%"
- extendedWaitUntil:
    visible: "Agents"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: keep-chip-opened
- runFlow:
    when:
      visible:
        id: "BackButton"
    commands:
      - tapOn:
          id: "BackButton"
      - assertVisible: ".*holds the rest of the work.*"
