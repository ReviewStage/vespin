# task-relations.yaml -- a task row's long press holding Task relation, Move to section, and its repository; a task's Task relations group with Add task relation, opening the Task relation sheet on its four kinds; and Mark as blocked by…, which lists the workspace's other tasks under a search, a task that cannot take the relation dimmed with why.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
---
# Launched on the host's Inbox fixture, as `tasks.yaml` is, so the tree holds
# the fixture's tasks and no server is reached. Nothing here is picked, since
# the fixture stages no relation write.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- tapOn: "Tasks"
- assertVisible: "Weekly digest email"
- waitForAnimationToEnd
# A row's long press menu holds Task relation, the four kinds under it.
- longPressOn: "Weekly digest email"
- assertVisible: "Task relation"
- takeScreenshot: task-relations-row-menu
- tapOn: "Task relation"
- assertVisible: "Mark as blocked by…"
- takeScreenshot: task-relations-row-kinds
- tapOn: "Mark as blocked by…"
- assertVisible: "Mark as blocked by"
- tapOn: "Cancel"
- waitForAnimationToEnd
# The task's page lists its relations with Add task relation, which opens the
# sheet on the four kinds.
- tapOn: "Weekly digest email"
- scrollUntilVisible:
    element: "Add task relation"
    direction: DOWN
- waitForAnimationToEnd
- takeScreenshot: task-relations-page
- tapOn: "Add task relation"
- assertVisible: "Set parent…"
- takeScreenshot: task-relations-kinds
- tapOn: "Mark as blocked by…"
- assertVisible: "Mark as blocked by"
- waitForAnimationToEnd
- takeScreenshot: task-relations-search
- tapOn: "Cancel"
