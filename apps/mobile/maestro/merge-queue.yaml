# merge-queue.yaml -- the Merge queue screen, opened from Search's Go to: each repository's queue under its header, its pull requests front first, each with its checks, its author, and when it should merge, and a row's long press holding Open on GitHub and Copy GitHub link.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
# Launched on the host's Inbox fixture, which turns the account's Merge queue
# experiment on and answers its read with synthetic queues of ada/relay and
# ada/ledger (`@repo/host/fixture-inbox`); nothing reaches a server.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Search
# Note that Search lists Go to before anything is typed, so Merge queue stands there while the experiment is on.
- runFlow:
    when:
      visible: "Merge queue"
    commands:
      - tapOn:
          text: "Merge queue"
          below: "Go to"
      - extendedWaitUntil:
          visible: "Invite a teammate by email"
          timeout: 15000
      - assertVisible: "Retry the billing webhook on a 502"
      - assertVisible: "Close the books at month end"
      - waitForAnimationToEnd
      - takeScreenshot: merge-queue
      - longPressOn: "Retry the billing webhook on a 502"
      - assertVisible: "Open on GitHub"
      - assertVisible: "Copy GitHub link"
      - waitForAnimationToEnd
      - takeScreenshot: merge-queue-row-menu
