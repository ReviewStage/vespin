# accessibility-ax3.yaml -- the iPhone's main reading screens at the third accessibility text size (AX3, Accessibility Extra Large), where a row's parts are wide enough to crowd but not yet the AX5 that `accessibility.yaml` shoots: the Inbox's rows, a do ask's Mark done and Couldn't do it one to a line, a task page's agent rows with their state and pull request one under another, an agent's page and its dock, a `/`'s skills wrapping and standing whole, and Settings' rows, each shot to check that words wrap and parts stack rather than cut or overlap, as Mail and Settings stand large text.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
# Note that each screen is reached by a launch of its own, as in
# `accessibility.yaml`, and that each wait for the screen to settle is capped
# at five seconds, since an agent's page draws its turn still running.
---
# The Inbox on the host's Inbox fixture, so no server is reached.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      UIPreferredContentSizeCategoryName: UICTContentSizeCategoryAccessibilityXL
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ax3-inbox
# A do ask: its steps, then Mark done and Couldn't do it, one to a line.
# Note that the swipe stands in the list's own column: on a portrait iPad the
# screen's center, where `scrollUntilVisible` swipes, is the empty detail
# column, so the list never moved. A bounded loop with an assert after it
# fails a row that never appears rather than looping on.
- repeat:
    times: 8
    while:
      notVisible: "Verify the digest's sender domain"
    commands:
      - swipe:
          start: "15%, 80%"
          end: "15%, 40%"
- assertVisible: "Verify the digest's sender domain"
- tapOn: "Verify the digest's sender domain"
- scrollUntilVisible:
    element: "Mark done"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ax3-thread-do
# A task's page and its agents, each agent's state and pull request under
# its name rather than squeezed beside each other.
- launchApp:
    arguments:
      fixture: inbox
      UIPreferredContentSizeCategoryName: UICTContentSizeCategoryAccessibilityXL
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- runFlow:
    file: subflows/open-row.yaml
    env:
      ROW: "Teammate invitations"
- assertVisible: "Created by .*"
- scrollUntilVisible:
    element: "Agents"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ax3-task-agents
# An agent's page and its dock.
- launchApp:
    arguments:
      fixture: inbox
      agent: 5ebf7192-3a6c-4d84-8fac-6b7c8d9eafb5
      UIPreferredContentSizeCategoryName: UICTContentSizeCategoryAccessibilityXL
# At AX3 the dock's chips scroll sideways and "2 queued" stands off-screen,
# so the page is known by its composer.
- extendedWaitUntil:
    visible:
      id: "composer-field"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ax3-agent
# A `/` typed: each skill's name and line wrap, and the list stands whole
# rather than in a scroller that showed about two rows.
- tapOn:
    id: "composer-field"
- inputText: "/"
- assertVisible: "/release-notes"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ax3-agent-skills
# Settings, from the switcher's account row.
- launchApp:
    arguments:
      fixture: inbox
      UIPreferredContentSizeCategoryName: UICTContentSizeCategoryAccessibilityXL
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 15000
- tapOn:
    id: "workspace-switcher"
- tapOn: "Settings(, .*)?"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ax3-settings
