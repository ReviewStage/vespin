# pull-request-files.yaml -- a pull request's Files changed: opened from its page's Files changed row, one list of its files in the tree's order, each with its letter, lines, and folder under its name, a search by path narrowing them, and a file's diff on its own screen, stepping to the next file, and the 5,000-line generated file shown from its fold.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
# Launched on the host's Inbox fixture, whose invitations agent's ready pull
# request, #128, changes eight invented files (`@repo/host/fixture-inbox`'s
# `fixtureChanges`): a change in place, files added, one deleted, one moved,
# a picture, a lockfile, and a generated table of 5,000 lines. Nothing
# reaches a server.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
# The pull request opens by its link. The system asks before a custom scheme
# opens the app.
- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "vespin://tasks/pull/workspace-personal/ada/relay/128"
- extendedWaitUntil:
    visible: "Ready to merge"
    timeout: 30000
# Its Files changed row, beside Checks under the description, pushes them.
- runFlow:
    file: subflows/open-row.yaml
    env:
      ROW: "Files changed.*"
# The files stand in one list in the tree's order, each with the count of
# lines it adds and removes at its row's end and its folder under its name.
# Note that a row is one element heard by the file's name, its folder and
# counts in its value, so the flow finds each row by its name.
- extendedWaitUntil:
    visible: "resend.ts"
    timeout: 30000
- assertVisible: "expiry.ts"
- assertVisible: "legacy-mailer.ts"
- waitForAnimationToEnd
- takeScreenshot: pull-request-files
# A search keeps the files whose path holds what is typed.
- tapOn: "Find a file"
- inputText: "invite-messages"
- extendedWaitUntil:
    visible: "invite-messages.ts"
    timeout: 10000
- assertNotVisible: "resend.ts"
- waitForAnimationToEnd
- takeScreenshot: pull-request-files-search
# A file opens its diff on a screen of its own, drawn natively: each row is
# heard as its line numbers and its words.
- clearText
- tapOn: "Cancel"
- tapOn: "resend.ts"
- extendedWaitUntil:
    visible: ".*fresh expiry.*"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: pull-request-diff
# The arrows step to the next file in the list's order, in place.
- tapOn: "Next file"
- extendedWaitUntil:
    visible: ".*Whether an invitation has passed its expiry.*"
    timeout: 10000
# The generated table of 5,000 lines starts folded, as the desktop folds a
# large file, and Show diff draws it; its first frame's time is logged for
# the timing lane ("DiffView first frame").
- openLink: "vespin://tasks/pull/workspace-personal/ada/relay/128/file?path=src%2Fgenerated%2Finvite-messages.ts"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Show diff"
    timeout: 15000
- tapOn: "Show diff"
- extendedWaitUntil:
    visible: ".*Invitation 0 is waiting for you.*"
    timeout: 15000
- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 200
- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 200
- waitForAnimationToEnd
- takeScreenshot: pull-request-diff-long
