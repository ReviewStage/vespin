# pull-request-files.yaml -- a pull request's Files changed: opened from its page's Files changed row, one list of its files in the tree's order, each with its letter, lines, and folder under its name, scrolled mid-list under the bar's search field, and a search by path narrowing them.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
# Launched on the host's Inbox fixture, whose invitations agent's ready pull
# request, #128, changes 38 invented files (`@repo/host/fixture-inbox`'s
# `fixtureChanges`): a change in place, files added, one deleted, one moved,
# a picture, a lockfile, a generated table of 5,000 lines, and 30 tests, so
# the list runs past the window. Nothing reaches a server.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
# The pull request opens by its link. The system asks before a custom scheme
# opens the app.
- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "vespin://tasks/pull/workspace-personal/ada/relay/128"
- extendedWaitUntil:
    visible: "Ready to merge"
    timeout: 30000
# Its Files changed row, beside Checks under the description, pushes them.
- runFlow:
    file: subflows/open-row.yaml
    env:
      ROW: "Files changed.*"
# The files stand in one list in the tree's order, each with the count of
# lines it adds and removes at its row's end and its folder under its name.
# Note that a row is one element heard by the file's name, its folder and
# counts in its value, so the flow finds each row by its name.
- extendedWaitUntil:
    visible: "resend.ts"
    timeout: 30000
- assertVisible: "expiry.ts"
- assertVisible: "legacy-mailer.ts"
- waitForAnimationToEnd
- takeScreenshot: pull-request-files
# Scrolled mid-list, the rows pass under the bar and its search field, which
# the system tucks away over the list's top edge effect rather than drawing
# a row's words through it.
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: "magic-link.test.ts"
- takeScreenshot: pull-request-files-scrolled
# Back at the list's top, the bar's search field stands again.
- scrollUntilVisible:
    element: "Find a file"
    direction: UP
    timeout: 30000
- waitForAnimationToEnd
# A search keeps the files whose path holds what is typed.
- tapOn: "Find a file"
- inputText: "invite-messages"
- extendedWaitUntil:
    visible: "invite-messages.ts"
    timeout: 10000
- assertNotVisible: "resend.ts"
- waitForAnimationToEnd
- takeScreenshot: pull-request-files-search
