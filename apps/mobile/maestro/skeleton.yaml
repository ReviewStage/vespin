# skeleton.yaml -- every tab, an ask's choices, and the signed-out placeholder, each shot once.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device.
appId: dev.vespin.ios
---
- launchApp:
    clearState: true
- assertVisible: "Inbox"
- takeScreenshot: inbox
# A row's detail: pushed over the list in a compact window, and beside it in
# a regular one.
- tapOn: "Review the invite flow"
- assertVisible: "A pull request waits for your go."
- takeScreenshot: inbox-thread
# Note that pressing the Inbox tab again pops its stack back to the list on a
# compact window, and is a no-op beside the split view on a regular one.
- tapOn: "Inbox"
- tapOn: "Pick the tab bar's placement"
- assertVisible: "Recommended"
- takeScreenshot: inbox-ask
- tapOn: "Inbox"
- tapOn: "Tasks"
- assertVisible: "Tasks"
- takeScreenshot: tasks
- tapOn: "Brand the iOS app"
- assertVisible: "Todo"
- takeScreenshot: task
- tapOn: "Search"
- assertVisible: "Find a task, a thread, or an agent."
- takeScreenshot: search
- tapOn: "New task"
- assertVisible: "Describe the task, and an agent starts on it."
- takeScreenshot: new-task
- openLink: vespin://signed-out
# The link comes from outside the app, so iOS asks before opening it there.
# The prompt is the system's, and SpringBoard raises it, and then hands the
# link to the app, in its own time: on a loaded CI simulator each has taken
# 20 seconds, past a tap's or a plain assertion's wait, so both are waited
# for as long as a minute. A simulator that has already allowed the link
# shows no prompt, which the optional wait and tap pass over.
- extendedWaitUntil:
    visible: "Open"
    timeout: 60000
    optional: true
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 60000
- takeScreenshot: signed-out
- tapOn: "Sign in"
- assertVisible: "Review the invite flow"
