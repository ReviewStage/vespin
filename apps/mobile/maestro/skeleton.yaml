# skeleton.yaml -- every tab, a thread, an ask's choices, a task, and a search, each shot once.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device.
appId: dev.vespin.ios
---
# The app is launched on the host's Inbox fixture (`src/host/launch-arguments.ts`),
# so the Inbox lists the synthetic threads the panel's own fixture run lists
# (`@repo/host/fixture-inbox`), read from the host's document, and no server
# is reached; the Tasks tab lists the fixture's tasks. `inbox.yaml` walks the
# Inbox itself, and `tasks.yaml` the Tasks tab.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- assertVisible: "Inbox"
- takeScreenshot: inbox
# A row's detail: pushed over the list in a compact window, and beside it in
# a regular one. A thread with a decide ask opens on its question.
# Note that it is the list's first row, opened as the app launches, because
# on the folded iPhone Duo a tap on the first row right after the list is
# scrolled back to its top, on the way back from a thread, opens nothing.
- tapOn: "Who can withdraw an invite?"
- assertVisible: ".*withdrawing one deletes it.*"
- takeScreenshot: inbox-ask
# Note that pressing "Inbox" goes back to the list on a compact window, by its
# back button or, where that is a bare chevron as on the folded Duo, its tab,
# and is a no-op beside the split view on a regular one. A plain thread, a
# notice, opens on its words; it may stand below the fold of a short window,
# so the list is scrolled to it, and settles before the tap, which a list
# still gliding takes as a stop rather than a pick.
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Inbox
- runFlow:
    file: subflows/open-row.yaml
    env:
      ROW: "acceptInvite can add a member twice"
- assertVisible: ".*adds them twice.*"
- takeScreenshot: inbox-thread
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- assertVisible: "Tasks"
- takeScreenshot: tasks
- tapOn: "Teammate invitations"
- assertVisible: "Created by .*"
- takeScreenshot: task
# The Search tab is tapped by its id, since a split view's search field is
# named Search too; it finds the task by its name. `search.yaml` walks it.
- runFlow:
    when:
      visible:
        id: "search-tab"
    commands:
      - tapOn:
          id: "search-tab"
# The iPad's top tab bar carries no id, so there the tab is the Search right of Tasks.
- runFlow:
    when:
      notVisible: "Find a task, an Inbox item, or an agent."
    commands:
      - tapOn:
          text: "Search"
          rightOf: "Tasks"
- assertVisible: "Find a task, an Inbox item, or an agent."
- tapOn: "Search Vespin"
- inputText: "invitations"
- assertVisible: "Teammate invitations"
- takeScreenshot: search
# Note that the keyboard is put away, since it stands over the tab bar.
- hideKeyboard
# The tab bar's round + opens New task as a sheet over the tabs.
- tapOn: "New task"
- assertVisible: "Describe the task"
- assertVisible: "Repository"
- takeScreenshot: new-task
