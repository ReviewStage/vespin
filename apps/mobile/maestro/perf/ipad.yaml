# ipad.yaml -- MEASUREMENT ONLY: each tap path on the Inbox fixture in landscape's three columns, each timed tap labeled "T:<path>".
appId: dev.vespin.ios
onFlowComplete:
  - setOrientation: PORTRAIT
---
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- setOrientation: LANDSCAPE_LEFT
- assertVisible: "Recorded the invite flow"
- waitForAnimationToEnd:
    timeout: 5000
# Inbox rows into the detail, two in turn.
- repeat:
    times: 5
    commands:
      - tapOn:
          text: "Recorded the invite flow"
          retryTapIfNoChange: false
          label: "T:inbox-row"
      - assertVisible: ".*walked the invite flow.*"
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "Invite limits"
          retryTapIfNoChange: false
          label: "T:inbox-row"
      - waitForAnimationToEnd:
          timeout: 3000
# The list column's ⋯ menu.
- repeat:
    times: 5
    commands:
      - tapOn:
          text: "More"
          index: 0
          retryTapIfNoChange: false
          label: "T:more-menu"
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          point: "60%, 95%"
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 3000
# New task.
- repeat:
    times: 5
    commands:
      - tapOn:
          text: "New task"
          retryTapIfNoChange: false
          label: "T:new-task"
      - assertVisible: "Describe the task"
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "Cancel"
          retryTapIfNoChange: false
          label: "T:new-task-cancel"
      - assertNotVisible: "Describe the task"
      - waitForAnimationToEnd:
          timeout: 3000
# The sidebar's places, Inbox and Tasks in turn.
- repeat:
    times: 5
    commands:
      - tapOn:
          text: "Tasks"
          retryTapIfNoChange: false
          label: "T:tab-tasks"
      - assertVisible: "Teammate invitations"
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "Inbox.*"
          index: 0
          retryTapIfNoChange: false
          label: "T:tab-inbox"
      - assertVisible: "Recorded the invite flow"
      - waitForAnimationToEnd:
          timeout: 3000
# Tasks rows into the detail, two in turn, then the Status chip.
- tapOn: "Tasks"
- assertVisible: "Teammate invitations"
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    times: 5
    commands:
      - tapOn:
          text: "Teammate invitations"
          retryTapIfNoChange: false
          label: "T:tasks-row"
      - assertVisible: "Created by .*"
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "Weekly digest email"
          retryTapIfNoChange: false
          label: "T:tasks-row"
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn: "Teammate invitations"
- assertVisible: "Created by .*"
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    times: 3
    commands:
      - tapOn:
          text: "Status, .*"
          retryTapIfNoChange: false
          label: "T:status-chip-open"
      - assertVisible: "Backlog"
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "Todo"
          retryTapIfNoChange: false
          label: "T:status-pick"
      - assertVisible: "Status, Todo"
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "Status, .*"
          retryTapIfNoChange: false
          label: "T:status-chip-open"
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "Backlog"
          retryTapIfNoChange: false
          label: "T:status-pick"
      - assertVisible: "Status, Backlog"
      - waitForAnimationToEnd:
          timeout: 3000
# Send on an agent's page.
- launchApp:
    arguments:
      fixture: inbox
      agent: 5ebf7192-3a6c-4d84-8fac-6b7c8d9eafb5
- assertVisible: "Stop"
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    times: 3
    commands:
      - tapOn:
          id: "composer-field"
      - inputText: "Show the expiry too."
      - assertVisible: "Send"
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          text: "Send"
          retryTapIfNoChange: false
          label: "T:send"
      - extendedWaitUntil:
          visible: "Stop"
          timeout: 5000
      - waitForAnimationToEnd:
          timeout: 2000
