# iphone.yaml -- MEASUREMENT ONLY (chore/probe-dock-chips): the agent page's dock chips over its composer, the Inbox chip to its thread and the pull request chip to its page, each five times, beside the Inbox row to a thread as the reference of the same thread page opened from a light screen; each timed step labeled "T:<path>".
appId: dev.vespin.ios
onFlowComplete:
  - setOrientation: PORTRAIT
---
- launchApp:
    clearState: true
    arguments:
      fixture: ${FIXTURE}
      perfStream: ${STREAM}
      perfLarge: ${LARGE}
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
# The reference: an Inbox row to its thread, the same page the Inbox chip opens.
- repeat:
    times: 5
    commands:
      - tapOn:
          text: "Recorded the invite flow"
          retryTapIfNoChange: false
          label: "T:inbox-row"
      - assertVisible: ".*walked the invite flow.*"
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: "BackButton"
          retryTapIfNoChange: false
          label: "T:back-from-thread"
      - assertVisible: "Recorded the invite flow"
      - waitForAnimationToEnd:
          timeout: 3000
# The agent's page, opened at launch, its dock standing over the composer.
- launchApp:
    arguments:
      fixture: ${FIXTURE}
      perfStream: ${STREAM}
      perfLarge: ${LARGE}
      agent: 5ebf7192-3a6c-4d84-8fac-6b7c8d9eafb5
- extendedWaitUntil:
    visible: "Inbox, \\d+ waiting"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
# The Inbox chip to the oldest thread waiting.
- repeat:
    times: 5
    commands:
      - tapOn:
          text: "Inbox, \\d+ waiting"
          retryTapIfNoChange: false
          label: "T:dock-inbox"
      - extendedWaitUntil:
          notVisible: "Inbox, \\d+ waiting"
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: "BackButton"
          retryTapIfNoChange: false
          label: "T:back-from-dock-inbox"
      - extendedWaitUntil:
          visible: "Inbox, \\d+ waiting"
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 3000
# The pull request chip to its page.
- repeat:
    times: 5
    commands:
      - tapOn:
          text: "#128"
          retryTapIfNoChange: false
          label: "T:dock-pr"
      - extendedWaitUntil:
          visible: "Checks.*"
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: "BackButton"
          retryTapIfNoChange: false
          label: "T:back-from-dock-pr"
      - extendedWaitUntil:
          visible: "#128"
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 3000
