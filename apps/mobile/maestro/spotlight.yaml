# spotlight.yaml -- the account's tasks found in Spotlight: a launch indexes its workspace's tasks and threads, a search from the Home Screen finds a task by its name with its status and workspace under it, and tapping the result opens the task's Overview in the app.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
# Handoff has no part a simulator shows, so it waits for a device.
appId: dev.vespin.ios
---
# Launched on the host's Inbox fixture, whose workspace holds the account's
# "Weekly digest email" (`@repo/host/fixture-inbox`); the app indexes it once
# the lists are read (`src/system-activity/`).
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
# Note that the Tasks list is read before the app is left, because the
# index is written from it, so a search typed sooner can come back without
# the app's row.
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- assertVisible: "Weekly digest email"
- pressKey: Home
- waitForAnimationToEnd
# A swipe down from the Home Screen's middle opens Spotlight's search.
- swipe:
    start: "50%,40%"
    end: "50%,70%"
- inputText: "Weekly digest"
# Note that the app's row is found by its title and the summary Spotlight
# reads beside it, "In progress · Ada Lovelace", since Maestro matches words
# whatever their case and Safari suggests "weekly digest email" too; and
# that the keyboard is put away before the row is tapped, because Spotlight
# lists the app's results under the web's, behind the keyboard, where a tap
# lands on a key.
- extendedWaitUntil:
    visible: "Weekly digest email, .*"
    timeout: 30000
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: spotlight-results
- tapOn: "Weekly digest email, .*"
- extendedWaitUntil:
    visible: "Created by .*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: spotlight-opened
