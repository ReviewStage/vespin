# probe-tasks-touch.yaml -- PROBE ONLY, never merged: a cold launch's first touches of the Tasks list as a person makes them, run right after the rig's own launch: the Tasks tab once the Inbox shows its threads, a scroll down the list and back, and a row opened.
#
# Note that the app is not launched here, since the rig launches it cold
# with its own arguments and times it; the flow starts on whatever stands.
appId: dev.vespin.ios
---
- runScript:
    file: probe-tasks-touch-clock.js
    env:
      STEP: start
# Note that Tasks is tapped once the Inbox shows its threads, as the developer did on build 78.
- extendedWaitUntil:
    visible:
      text: ".*decide how a partial cent rounds.*"
    timeout: 30000
- runScript:
    file: probe-tasks-touch-clock.js
    env:
      STEP: inbox-shown
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- runScript:
    file: probe-tasks-touch-clock.js
    env:
      STEP: tasks-tapped
- swipe:
    direction: UP
    duration: 400
- runScript:
    file: probe-tasks-touch-clock.js
    env:
      STEP: scrolled-down
- swipe:
    direction: DOWN
    duration: 400
- runScript:
    file: probe-tasks-touch-clock.js
    env:
      STEP: scrolled-up
- tapOn:
    text: ".*so it holds under load.*"
    index: 0
- runScript:
    file: probe-tasks-touch-clock.js
    env:
      STEP: row-tapped
- waitForAnimationToEnd:
    timeout: 3000
