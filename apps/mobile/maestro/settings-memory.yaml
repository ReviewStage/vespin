# settings-memory.yaml -- Settings › Memory on the Inbox fixture: the workspace's memories most recalled first, a search narrowing them, and a memory's Delete asked first and canceled.
#
# Launched on the host's Inbox fixture, whose workspace holds three memories
# (`@repo/host/fixture-inbox`), so no server is reached. The fixture is
# signed in as Ada Lovelace, the workspace's owner, who may delete each.
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- tapOn:
    id: "workspace-switcher"
- tapOn: ".*, Settings"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Memory"
- tapOn: "Memory"
- waitForAnimationToEnd
# Note that a row is one element, heard as its words, so a memory is found by them.
- assertVisible: "The web server's tests run on PGlite through `test:store`."
- assertVisible: "Release dates are written in Eastern time, never UTC."
- takeScreenshot: settings-memory
# The search narrows the list by a memory's words or whose they are. Note
# that a wide window, the iPhone Duo's, folds the search field into a Search
# button at the toolbar's end, which stands the field once pressed, and that
# the iPad's form sheet draws neither until its list is pulled down, as a
# search field that hides on scroll stands.
- runFlow:
    when:
      notVisible: "Search memories"
    commands:
      - runFlow:
          when:
            visible: "Search"
          commands:
            - tapOn: "Search"
      - runFlow:
          when:
            true: ${FLOATING_TABS == 'true'}
          commands:
            - swipe:
                start: "50%, 40%"
                end: "50%, 55%"
                duration: 800
      - waitForAnimationToEnd
- tapOn: "Search memories"
- inputText: "Grace"
- assertVisible: "Release dates are written in Eastern time, never UTC."
- assertNotVisible: "The staging database is reset every Sunday night."
- waitForAnimationToEnd
- takeScreenshot: settings-memory-search
# The search is put away by the close button beside its field, as iOS 27
# draws a toolbar's search.
- tapOn: "close"
- waitForAnimationToEnd
# A long press offers Delete, which asks first.
- longPressOn: "The staging database is reset every Sunday night."
- tapOn: "Delete"
- assertVisible: "Delete this memory?"
- waitForAnimationToEnd
- takeScreenshot: settings-memory-delete
- tapOn: "Cancel"
- assertVisible: "The staging database is reset every Sunday night."
