# workspace.yaml -- the workspace switcher: the chosen workspace named in the Inbox's bar as its one leading button, its list open with every workspace, New workspace, the chosen workspace's Manage under its name, then the account opening Settings, another chosen and the Inbox and Tasks following it, and New workspace's sheet.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
---
# Launched on the host's Inbox fixture, whose account is in its own
# workspace and in Relay, a team of six that holds no tasks or threads
# (`@repo/host/fixture-inbox`), so a switch shows at once and no server is
# reached.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
# The switcher leads the bar alone in a compact window and a portrait
# regular one, with no photo beside it, and heads the sidebar in a landscape
# iPad's, heard as the workspace and who shares it.
- runFlow:
    file: subflows/show-sidebar.yaml
- assertVisible:
    id: "workspace-switcher"
- waitForAnimationToEnd
- takeScreenshot: workspace-inbox
- runFlow:
    file: subflows/switcher.yaml
# Note that a menu row is heard as its name and who shares it together, so a
# workspace is found by both.
- assertVisible: "Relay, 6 members"
- assertVisible: "Settings"
- assertVisible: "New workspace"
- assertVisible: "Manage"
- waitForAnimationToEnd
- takeScreenshot: workspace-menu
# Relay holds no threads, so the Inbox empties once it is chosen, and Tasks
# follows the same choice.
- tapOn: "Relay, 6 members"
- assertNotVisible: "Recorded the invite flow"
- waitForAnimationToEnd
- takeScreenshot: workspace-switched
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- assertNotVisible: "Weekly digest email"
# The choice outlives a relaunch, as the phone keeps it.
- stopApp
- launchApp:
    arguments:
      fixture: inbox
- assertNotVisible: "Recorded the invite flow"
# New workspace opens its sheet, a team's name and Create.
- runFlow:
    file: subflows/switcher.yaml
- tapOn: "New workspace"
- assertVisible:
    id: "new-workspace-name"
- waitForAnimationToEnd
- takeScreenshot: workspace-new
# The fixture has no service, so Create is refused: the sheet stays with the
# name and says why under it, rather than closing.
- inputText: "Launch crew"
- tapOn: "Create"
- assertVisible: "Could not.*"
- assertVisible:
    id: "new-workspace-name"
- takeScreenshot: workspace-new-refused
- tapOn: "Cancel"
# Back to the account's own workspace, whose threads stand again. The Inbox
# is tapped first, since a wide iPad keeps the Tasks collection picked above
# and would stand on it after the switch.
- runFlow:
    file: subflows/switcher.yaml
- tapOn: "Ada Lovelace, Personal workspace"
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Inbox
- assertVisible: "Recorded the invite flow"
