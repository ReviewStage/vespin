# manager-thread.yaml -- a Manager's chat as a team channel with threads: every message headed by its sender's face and name, the Manager's message the account answered in its thread summing its replies under it ("2 replies"), the thread opened from that summary on its own page (the message it hangs on, a rule counting the replies, the replies), a reply sent there landing in the thread, and Reply in thread from a message's long press opening the thread of a message no one answered yet.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
# Launched on the host's Inbox fixture and opened on its release Manager's
# page by `-agent <id>`: its chat holds the account's ask, the two messages
# the Manager sent back, and in the first of those's thread the account's
# question and the Manager's answer (`@repo/host/fixture-inbox`'s
# `MANAGER_CHAT`); a message the run sends lands as the chat's row
# (`fixture-host.ts`'s `keepChatSend`); nothing reaches a server.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      agent: 81e2a425-6d3f-4a07-92df-9eafb0c1d2e8
- extendedWaitUntil:
    visible: "Left before it ships.*"
    timeout: 15000
# The channel heads each run with who sent it, and sums the thread's replies
# under the message they answer; the replies themselves stand in the thread
# alone.
- assertVisible: "On it. The invitations agent has its pull request open.*"
- assertVisible: "2 replies"
- assertNotVisible: "Which pull request is it?"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: manager-chat-channel
# The summary opens the thread on its own page: the message it hangs on, the
# rule counting its replies, and the replies in their runs.
- tapOn: "2 replies"
- extendedWaitUntil:
    visible: "Which pull request is it?"
    timeout: 10000
- assertVisible: "Thread"
- assertVisible: "#128, Invite a teammate by email.*"
- assertVisible: "On it. The invitations agent has its pull request open.*"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: manager-thread-open
# Its box answers in the thread: a reply sent lands among its replies.
- tapOn:
    id: "composer-field"
- inputText: "Thanks, reviewing it now."
- assertVisible:
    text: "Send"
    enabled: true
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Thanks, reviewing it now."
    timeout: 10000
- extendedWaitUntil:
    visible: "3 replies"
    timeout: 10000
- runFlow: subflows/lower-keyboard.yaml
- takeScreenshot: manager-thread-replied
# Back in the chat, the summary counts the reply, which still stands in the
# thread alone.
- tapOn: "Back"
- extendedWaitUntil:
    visible: "3 replies"
    timeout: 10000
- assertNotVisible: "Thanks, reviewing it now."
# A message no one answered offers Reply in thread from its long press, which
# opens its thread with no reply yet.
- longPressOn: "Left before it ships.*"
- tapOn: "Reply in thread"
- extendedWaitUntil:
    visible: "Thread"
    timeout: 10000
- assertVisible: "Left before it ships.*"
- assertNotVisible: "2 replies"
- takeScreenshot: manager-thread-empty
