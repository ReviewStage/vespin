# person.yaml -- a person's chip in a thread's message and in an agent's transcript: held, it opens Open link and Copy link over the message's own menu; pressed, it opens the person's page, their name heading it and its ⋯ holding Copy link, Copy email and Manage in workspace settings; and a chip naming no member opens a page that says so; and the account's own chip opens its page, which leads with the Managers it started.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
# Note that a chip stands mid-line, where it is no element of its own, heard
# only as its line's words, so each chip in the fixture leads its own line and
# is pressed a little in from the line's leading edge (`point` beside the
# line's words), where the chip stands at every window's width.
# Note that `FLOATING_TABS` names a regular window, whose transcript is
# scrolled inside its detail column (`scroll-to.yaml`'s `BESIDE`).
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
# Launched on the host's Inbox fixture, signed in as Ada Lovelace, whose
# invite recording thread names her by a chip leading its own line: pressed,
# it opens her own page, which leads with the Managers she started, the
# fixture's Release manager, its face in the ring's place.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- tapOn: "Recorded the invite flow"
- assertVisible: ".*walked the invite flow.*"
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: ".*signed off on it.*"
- tapOn:
    text: ".*signed off on it.*"
    point: "6%, 50%"
- extendedWaitUntil:
    visible: "Managers.*"
    timeout: 10000
- assertVisible: "Release manager"
- waitForAnimationToEnd
- takeScreenshot: person-managers
# Launched on the host's Inbox fixture, whose invite recording thread names
# Grace Hopper, a member, and Nobody Known, who is none, each by a chip
# leading its own line (`@repo/host/fixture-inbox`); nothing reaches a server.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- tapOn: "Recorded the invite flow"
- assertVisible: ".*walked the invite flow.*"
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: ".*reviewed the flow.*"
# The chip held: the system's sheet of the link's acts, not the message's Copy message.
- longPressOn:
    text: ".*reviewed the flow.*"
    point: "6%, 50%"
- assertVisible: "Open link"
- assertVisible: "Copy link"
- assertNotVisible: "Copy message"
- waitForAnimationToEnd
- takeScreenshot: person-chip-hold-thread
- tapOn: "Cancel"
- waitForAnimationToEnd
# The chip pressed: the person's page, their name heading it.
- tapOn:
    text: ".*reviewed the flow.*"
    point: "6%, 50%"
- extendedWaitUntil:
    visible: "Grace Hopper"
    timeout: 10000
- assertNotVisible: "Not in this workspace"
- waitForAnimationToEnd
- takeScreenshot: person-page
# Its ⋯: the reader, the workspace's owner, may manage a member there.
- tapOn: "Person"
- assertVisible: "Copy link"
- assertVisible: "Copy email"
- assertVisible: "Manage in workspace settings"
- waitForAnimationToEnd
- takeScreenshot: person-menu
# Note that a menu or popover is put away by a tap off it at a point, through
# `dismiss.yaml`, because iOS takes everything under it out of the
# accessibility tree, so no named control behind it can be pressed (#10757's
# rig run); the flow then asserts it gone and the page as it stood, so a tap
# that ever lands on a live control fails here.
- runFlow: subflows/dismiss.yaml
- assertNotVisible: "Copy email"
- assertVisible: "Grace Hopper"
- runFlow:
    when:
      visible:
        id: "BackButton"
    commands:
      - tapOn:
          id: "BackButton"
- assertVisible: ".*walked the invite flow.*"
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: ".*was asked too.*"
# A chip naming no member opens a page that says they are none.
- tapOn:
    text: ".*was asked too.*"
    point: "6%, 50%"
- extendedWaitUntil:
    visible: "Not in this workspace"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: person-unknown
# The invitations agent's page, opened by `-agent <id>` as `agent.yaml` opens
# it, whose newest reply ends in Grace Hopper's chip, inside a message the
# page holds for its own Copy message.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      agent: 5ebf7192-3a6c-4d84-8fac-6b7c8d9eafb5
- extendedWaitUntil:
    visible: "Add a way to resend an invite that expired."
    timeout: 30000
# Note that the reply is scrolled to in short steps until it stands clear
# under the agent's name in the bar, as `agent.yaml` reaches its cards, since
# a centered scroll may leave it under the held call's banner.
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: ".*asked for it.*"
      BELOW: "Build teammate invitations"
      BESIDE: ${FLOATING_TABS}
- waitForAnimationToEnd:
    timeout: 5000
- longPressOn:
    text: ".*asked for it.*"
    point: "6%, 50%"
- assertVisible: "Open link"
- assertVisible: "Copy link"
- assertNotVisible: "Copy message"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: person-chip-hold-transcript
- tapOn: "Cancel"
