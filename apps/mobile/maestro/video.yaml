# video.yaml -- an agent's recording in the system's own player: at rest on its first frame with the system's controls over it, then playing in place on a tap; with MEDIA_ORIGIN, the recording is read over HTTP from the rig, as a device reads it from the service.
#
# The screenshots are read by eye: `video-at-rest` must show the
# recording's first frame under the system's play button, scrubber, full
# screen and Picture in Picture controls, with no mark of the app's own over
# it, and `video-after-tap` the recording playing in place under the same
# controls. Note that the player stands to VoiceOver, and so to this flow, as
# one element whose activation opens it full screen, since the inline
# player's own views stood past the depth XCTest can read in an iPad's split
# view (`video.tsx`), so the system's controls are seen in the screenshots
# rather than asserted by name. With MEDIA_ORIGIN, the rig serves the
# fixture's MP4 at `<origin>/fixture-recording.mp4` with byte ranges, and
# the app's fixture answers the recording's source there (`-mediaOrigin`).
appId: dev.vespin.ios
env:
  MEDIA_ORIGIN: ${MEDIA_ORIGIN || ''}
---
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      agent: 5ebf7192-3a6c-4d84-8fac-6b7c8d9eafb5
      mediaOrigin: ${MEDIA_ORIGIN}
# The page opens at its newest row, so the recording stands above it; its
# caption is centered (`scroll-to.yaml`), so the recording above it stands
# whole below the bar, and each swipe may wait out a page that never holds
# still, such as the system's own wait while the player reads over HTTP.
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: "Accepting an invite.*"
      DIRECTION: UP
- extendedWaitUntil:
    visible:
      id: "video-player"
    timeout: 30000
- assertNotVisible: ".*can't play here.*"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: video-at-rest
# A tap plays it in place, under the system's controls.
- tapOn:
    id: "video-player"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: video-after-tap
