# tasks.yaml -- the Tasks tab's tree, its empty sections standing as their headers, a group folded, a task marked done by its menu and by its swipe, a row's long press preview and its leading swipe, its menu's Copy link in More copying at once, Rename alert, and Permanently delete question, an agent's preview and swipe, its archive confirmed, the agent then folded under Archived, its page standing Unarchive in the composer's place, and its row's Unarchive bringing it back, its unread mark and the read opening it takes, Mark done asking first while an agent works, a task's Overview with a page opened whole from it, its status changed from its ⋯, the ⋯'s acts, New sub-task, and its comment threads with their files and a reply typed, the list in landscape, and its search.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
# Note that the window is turned back upright however the flow ends, because
# a run left in landscape fails every flow after it.
onFlowComplete:
  - setOrientation: PORTRAIT
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
# Launched on the host's Inbox fixture, as `inbox.yaml` is, so the tree holds
# the fixture's tasks, pinned, sectioned, and in two repositories, and no
# server is reached; the fixture takes each status set
# (`@repo/host/fixture-inbox`), which the list draws at once.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- assertVisible: "Pinned"
- assertVisible: "Weekly digest email"
# The fixture's two empty sections stand as their headers alone, each with
# its + (New task in it), as the desktop's sidebar keeps an empty section.
- assertVisible: "Experiments"
- assertVisible: "Ideas"
- assertVisible: "New task in Ideas"
- waitForAnimationToEnd
- takeScreenshot: tasks-list
# A group folds under its header, heard by its title and count (whether it is
# collapsed or expanded is its value, which Maestro does not match), and
# opens again. Note that the header's title is pressed, as a child of the
# header, because the iPad's floating sidebar stands over the header's
# leading half, where a press at the whole header's middle folded nothing,
# and the sidebar's own Launch row has no such parent.
- tapOn:
    text: "Launch"
    childOf: "Launch, [0-9]+"
- assertNotVisible: "Launch checklist"
- tapOn:
    text: "Launch"
    childOf: "Launch, [0-9]+"
- assertVisible: "Launch checklist"
# A long press offers Done under the row menu's Status, as the panel's row
# menu does, and a swipe from the trailing edge reveals Mark done; either way
# the row leaves the list once it is pressed.
# Note that a row may stand below the fold of a short window, the folded
# iPhone Duo's, so the list is scrolled to it.
- runFlow:
    file: subflows/row-menu.yaml
    env:
      ROW: Launch checklist
      ITEM: Status
- takeScreenshot: tasks-menu
- tapOn: "Status"
- tapOn: "Done"
- assertNotVisible: "Launch checklist"
# Note that a swipe on a split view's sidebar reads as a tap under Maestro's
# driver, so a regular window, which stands "No task selected" beside its list,
# marks the task done from its menu instead.
- runFlow:
    when:
      notVisible: "No task selected"
    commands:
      # Note that the row is brought clear of the tab bar first (`to-row.yaml`), because the empty sections the list stands since #10305 put it at the window's foot, where the swipe ran over the tab bar and moved to the Inbox.
      - runFlow:
          file: subflows/to-row.yaml
          env:
            ROW: Usage alerts
      - waitForAnimationToEnd
      - swipe:
          from: "Usage alerts"
          direction: LEFT
      - tapOn: "Mark done"
- runFlow:
    when:
      visible: "No task selected"
    commands:
      - runFlow:
          file: subflows/row-menu.yaml
          env:
            ROW: Usage alerts
            ITEM: Status
      - tapOn: "Status"
      - tapOn: "Done"
- assertNotVisible: "Usage alerts"
- takeScreenshot: tasks-marked-done
# A long press on a task lifts its preview, its Overview at a glance: its
# status, key and repository, its name, and its agents, the pinned Weekly
# digest email's at work. Under it stands the panel's row menu, in the
# panel's order: Open; Rename and Mark as unread; Status, Priority and
# Assignee; Unpin on a pinned task and More, which holds the rarer acts;
# and Permanently delete, the whole menu standing beside the preview on an
# iPad (STAG-3801).
- scrollUntilVisible:
    element: "Weekly digest email"
    direction: UP
- waitForAnimationToEnd
# A swipe from the leading edge reveals Unpin, which a full swipe would
# press at once, so the flow swipes partway across Pinned's row, under the
# Managers group and Pinned's header, and a tap on the row's own words
# closes it unpressed. Note that the swipe's height is the row's on the
# iPhone 18 Pro since the Managers group stood above Pinned; at the old
# height it ran over Release manager and opened its page (j10404).
# Note that the row is closed before anything else is pressed, because a row
# left open takes the next press on the list, the long press below among
# them, only to close itself; and that a regular window, whose swipes read
# as taps, is left out.
- runFlow:
    when:
      notVisible: "No task selected"
    commands:
      - swipe:
          start: "8%, 33%"
          end: "38%, 33%"
          duration: 900
      - waitForAnimationToEnd
      - takeScreenshot: tasks-swipe-leading
      - tapOn: "Weekly digest email"
      - waitForAnimationToEnd
- runFlow:
    file: subflows/row-menu.yaml
    env:
      ROW: Weekly digest email
      ITEM: Open
- assertVisible: "Rename"
- assertVisible: "Mark as unread"
- assertVisible: "Status"
- assertVisible: "Priority"
- assertVisible: "Assignee"
- assertVisible: "More"
- scrollUntilVisible:
    element: "Unpin"
    direction: DOWN
# Note that the menu is scrolled to its last act, which a short window, the
# iPhone Duo's, stands below its foot.
- scrollUntilVisible:
    element: "Permanently delete"
    direction: DOWN
- takeScreenshot: tasks-row-menu
# Rename asks for the name in the system's alert, opened on the task's name,
# and Cancel keeps it. Note that the menu is scrolled back up to it first,
# because the scroll to its foot above moves an iPhone's menu too, which
# scrolls inside itself now that it is longer than the window (j10407).
- scrollUntilVisible:
    element: "Rename"
    direction: UP
- tapOn: "Rename"
- assertVisible: "Rename task"
- waitForAnimationToEnd
- takeScreenshot: tasks-rename
- tapOn: "Cancel"
- waitForAnimationToEnd
# Permanently delete asks first, in the panel's words, and putting it away keeps the
# task.
- runFlow:
    file: subflows/row-menu.yaml
    env:
      ROW: Weekly digest email
      ITEM: Permanently delete
# Note that the menu is scrolled until its last act stands whole before the
# tap, because after the steps above a tap on it as soon as the menu showed
# it closed the menu with no question, even tapped once and waited on for
# 5 s, while the same steps scrolled first asked every time (jtdel and
# jndel, Nov 18). The tap is never retried, because a retry once the menu
# has closed lands behind the question and puts it away.
- scrollUntilVisible:
    element: "Permanently delete"
    direction: DOWN
- tapOn:
    text: "Permanently delete"
    retryTapIfNoChange: false
- assertVisible: "Permanently delete task?"
- waitForAnimationToEnd
- takeScreenshot: tasks-delete-ask
- runFlow:
    file: subflows/dismiss-ask.yaml
    env:
      QUESTION: "Permanently delete task?"
- waitForAnimationToEnd
- assertVisible: "Weekly digest email"
# Copy link, in More, copies the task's address at once, as Safari's and
# Notes' do, with no share sheet, so the list stands back under the closed
# menu.
- runFlow:
    file: subflows/row-menu.yaml
    env:
      ROW: Weekly digest email
      ITEM: More
- tapOn: "More"
- tapOn: "Copy link"
- waitForAnimationToEnd
- assertVisible: "Weekly digest email"
- takeScreenshot: tasks-copy-link
- runFlow:
    file: subflows/row-menu.yaml
    env:
      ROW: Weekly digest email
      ITEM: Mark as unread
# Mark as unread draws the row's dot.
- tapOn: "Mark as unread"
- waitForAnimationToEnd
- takeScreenshot: tasks-row-unread
# Done on a task whose agent is at work asks first, as the panel does,
# and Cancel leaves the task where it stands. Its menu now offers Mark as
# read, so the unread mark held.
- runFlow:
    file: subflows/row-menu.yaml
    env:
      ROW: Weekly digest email
      ITEM: Mark as read
# Note that Done is set from the menu's Status, since the panel's row menu
# offers Mark done only by the row's swipe.
- tapOn: "Status"
- tapOn: "Done"
- assertVisible: "Mark as Done?"
- assertVisible: "Stop agent"
- takeScreenshot: tasks-mark-done-ask
- runFlow:
    file: subflows/dismiss-ask.yaml
    env:
      QUESTION: "Mark as Done?"
- waitForAnimationToEnd
- assertVisible: "Weekly digest email"
# Opening the task reads it, so its dot is gone once the list shows again.
- tapOn: "Weekly digest email"
- assertVisible: "Created by .*"
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- takeScreenshot: tasks-row-read
# A task opens on its Overview: its path in the bar, its name, its chips, and
# who created it,
# its relations, its agents with their pull request, its pages, and its
# description.
- scrollUntilVisible:
    element: "Teammate invitations"
    direction: UP
- waitForAnimationToEnd
- tapOn: "Teammate invitations"
- assertVisible: "Created by .*"
- assertVisible: "Agents"
- waitForAnimationToEnd
- takeScreenshot: task-overview
# A long press on an agent lifts its preview: its tile and name, where it
# stands with its model and where it runs, its latest step where the app
# holds its transcript, and its pull request, over Open and Stop, which a
# swipe from its trailing edge reveals too while it works; once it rests the
# swipe offers Archive, which asks first. A tap off the preview closes it.
- runFlow:
    file: subflows/row-menu.yaml
    env:
      ROW: Build teammate invitations
      ITEM: Open
- takeScreenshot: task-agent-preview
# Note that the tap lands on the dimmed screen above the preview, which
# lifts low on the screen under the agent's row.
- runFlow:
    file: subflows/dismiss.yaml
    env:
      POINT: 50%, 30%
- runFlow:
    when:
      notVisible: "No task selected"
    commands:
      # Note that the agent's row is swiped from the row itself, found by its
      # name, as the resting agent's row is below, because a point a share
      # of the window down stood on the agent's row on an iPhone but on the
      # Pages row under it on an iPad, which it opened. The swipe must only
      # reveal Stop, a working agent's one act, which a full swipe would
      # run, so Stop is read standing before a tap on the page's plain line,
      # inside the same list, closes it. It keeps Maestro's own duration, as
      # the resting agent's swipe below does, since a 900 ms swipe on an
      # agent's row held long enough on the iPhone to lift its preview.
      - swipe:
          from:
            text: "Build teammate invitations"
          direction: LEFT
      - waitForAnimationToEnd
      - assertVisible: "Stop"
      - takeScreenshot: task-agent-swipe
      - tapOn: "Created by .*"
      - waitForAnimationToEnd
# Note that the task's page is scrolled by drags inside it on an iPad
# (`BESIDE`), since a scroll at the window's middle lands on a landscape
# window's list column beside it, and the page never moved.
- runFlow:
    file: subflows/scroll-in.yaml
    env:
      ELEMENT: "Goal"
      BESIDE: ${FLOATING_TABS}
- takeScreenshot: task-description
# A page in its Pages opens whole on the app's own page screen, its ⋯
# offering Open in browser, and back leads to the Overview. A tap off the
# menu closes it.
# Note that the wait is long, because the first web view a freshly booted
# simulator opens launches WebKit's processes, as `agent.yaml` says; and
# that the page is scrolled to in short steps until it stands clear under
# the task's name in the bar (`scroll-to.yaml`'s `BELOW`), because a scroll
# that stops once it shows leaves it under the bar, where the tap misses it.
# Note that an iPad's detail column stands its path in the bar as a title of
# its own, with no bar named for it in the tree, so there the card is
# scrolled up and then drawn a step further down instead, clear of the bar.
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - runFlow:
          file: subflows/scroll-to.yaml
          env:
            ELEMENT: "Invite funnel"
            BELOW: "relay › AL-42"
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - runFlow:
          file: subflows/scroll-to.yaml
          env:
            ELEMENT: "Invite funnel"
            DIRECTION: UP
            BESIDE: "true"
- tapOn: "Invite funnel"
- extendedWaitUntil:
    visible: "Invites sent in the staging workspace.*"
    timeout: 90000
# Note that the page's words are heard only once its loading ground, heard
# as Loading while it stands, has faded from over them (`SealedPage`), so
# the shot is taken once it has gone rather than of the ground.
- extendedWaitUntil:
    notVisible: "Loading"
    timeout: 5000
- takeScreenshot: task-page
# Note that the page is pushed over the whole window in every window, on
# the tab's own stack, so its ⋯ holds Open in browser on an iPad too.
- tapOn: "More"
- assertVisible: "Open in browser"
- takeScreenshot: task-page-menu
- runFlow:
    file: subflows/dismiss.yaml
- tapOn:
    id: "BackButton"
- waitForAnimationToEnd
- runFlow:
    file: subflows/scroll-in.yaml
    env:
      ELEMENT: "Goal"
      BESIDE: ${FLOATING_TABS}
# Its status chip opens the menu of statuses, the one it stands at checked,
# and a pick says at once on the chip. Its priority and assignee chips open
# theirs the same way; a tap off a menu closes it.
# Note that the page is scrolled up to the status chip itself, and on an
# iPad a step further, because a scroll up stops once its element peeks in,
# and there "Created by" peeked in under the floating bar with the chips
# above it, out of sight.
- runFlow:
    when:
      true: ${FLOATING_TABS != 'true'}
    commands:
      - runFlow:
          file: subflows/scroll-in.yaml
          env:
            ELEMENT: "Status, .*"
            DIRECTION: UP
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - runFlow:
          file: subflows/scroll-to.yaml
          env:
            ELEMENT: "Status, .*"
            DIRECTION: UP
            BESIDE: "true"
- tapOn: "Status, .*"
- takeScreenshot: task-status-menu
- tapOn: "Todo"
- waitForAnimationToEnd
- assertVisible: "Status, Todo"
- takeScreenshot: task-status-set
- tapOn: "Priority, .*"
- assertVisible: "Urgent"
- takeScreenshot: task-priority-menu
- tapOn:
    point: "50%, 90%"
- waitForAnimationToEnd
- tapOn: "Assignee, .*"
- assertVisible: "No assignee"
- takeScreenshot: task-assignee-menu
- tapOn:
    point: "50%, 90%"
- waitForAnimationToEnd
# Its ⋯ holds the panel's acts: Copy link, Rename, New sub-task, Open in
# browser, and Permanently delete, red and last, which asks first. Note that
# a regular window's bar stands New sub-task as a glyph beside ⋯ instead
# (`bar-act.yaml`), so there ⋯ is opened once it is found.
- runFlow:
    file: subflows/bar-act.yaml
    env:
      ACT: New sub-task
- assertVisible: "New sub-task"
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - tapOn: "More"
- assertVisible: "Copy link"
- assertVisible: "Permanently delete"
- takeScreenshot: task-more-menu
# Note that the tap is never retried, because a retry once the menu has
# closed lands behind the question and puts it away.
- tapOn:
    text: "Permanently delete"
    retryTapIfNoChange: false
- assertVisible: "Permanently delete task?"
- waitForAnimationToEnd
- takeScreenshot: task-delete-ask
- runFlow:
    file: subflows/dismiss-ask.yaml
    env:
      QUESTION: "Permanently delete task?"
- waitForAnimationToEnd
# Sub-tasks' + offers New sub-task and Link existing task; New sub-task
# opens New task as a sub-task of it, its repository the task's own; Cancel
# on a sheet with nothing typed closes it.
- runFlow:
    file: subflows/scroll-in.yaml
    env:
      ELEMENT: "Add sub-task"
      BESIDE: ${FLOATING_TABS}
- tapOn: "Add sub-task"
- assertVisible: "Link existing task"
- takeScreenshot: task-sub-task-add
- tapOn: "New sub-task"
- assertVisible: "Describe the task"
# The parent stands over the words as the relation's capsule (since #8903),
# "Sub-task of · its name".
- assertVisible: "Sub-task of.*"
# The keyboard is lowered by a drag on the sheet's page.
- runFlow:
    file: subflows/lower-keyboard.yaml
- takeScreenshot: new-sub-task
- tapOn: "Cancel"
- waitForAnimationToEnd
# Its description's open comment threads stand under it; one opens with its
# comments and the reply field, a reply typed into it.
# Note that the scroll may take a minute, because the description's video
# plays on, holding each swipe ten seconds waiting for the page to settle,
# and that it is to the thread itself, centered, since a scroll that stops
# once the Comments header shows leaves it at the window's foot with its
# threads below it.
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: "Should an owner be able to resend.*"
      BESIDE: ${FLOATING_TABS}
- takeScreenshot: task-comments
- tapOn: "Should an owner be able to resend.*"
- assertVisible: "Yes: Resend stands beside each expired invite.*"
# The question's files stand after its words: its screenshot, and its PDF as
# a chip that names its size once read.
- assertVisible: "resend-flow.pdf.*"
- waitForAnimationToEnd
- takeScreenshot: task-comment-thread
- tapOn: "Reply"
- inputText: "Thanks, that covers it."
- waitForAnimationToEnd
- takeScreenshot: task-comment-reply
- tapOn: "Send"
- waitForAnimationToEnd
- tapOn:
    id: "BackButton"
- waitForAnimationToEnd
# Back on the list, a landscape window stands it as a split view: on an iPad
# the system's tab sidebar beside the list and the task.
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- assertVisible: "Pinned"
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd
- takeScreenshot: tasks-wide
- setOrientation: PORTRAIT
- waitForAnimationToEnd
# Last, the search, a round glass button in the bar, finds the workspace's
# tasks whatever their status, a done one among them, by every word typed. It
# comes last, since its keyboard stands over the rows. A compact window's
# search is the bar's round button, named as the Search tab is, so the one
# above the tab bar is pressed, which the two's order in the tree does not
# say once the window has turned; a split view's sidebar holds the field
# itself.
- runFlow:
    when:
      notVisible: "Search tasks"
      true: ${FLOATING_TABS != 'true'}
    commands:
      - tapOn:
          text: "Search"
          above: "Tab Bar"
# Note that an iPad turned back upright with a task picked folds its list
# behind the task, as a portrait split view does, so its field is brought
# back by the system's Show Sidebar in the task's bar (j10407).
- runFlow:
    when:
      notVisible: "Search tasks"
      true: ${FLOATING_TABS == 'true'}
    commands:
      - tapOn: "Show Sidebar"
      - waitForAnimationToEnd
- tapOn: "Search tasks"
- inputText: "rounding"
- assertVisible: "Ledger rounding"
- assertNotVisible: "Weekly digest email"
- takeScreenshot: tasks-search
# A resting agent's row offers Archive from its trailing swipe, which asks
# first, as the agent page's ⋯ does. The search above leaves "Ledger
# rounding" found, whose agent finished, so its swipe offers Archive where a
# working agent's offers Open and Stop. Note that the swipe starts on the
# row, one element whose center is the row's, and keeps Maestro's own
# duration, because on the iPhone a 900 ms swipe held long enough to start
# the row's long-press preview and never opened it (jswipe2 and jswipe3,
# Nov 18). A full swipe only opens the row, since Archive never runs on one,
# so the flow taps Archive and waits for its ask.
- tapOn: "Ledger rounding"
- extendedWaitUntil:
    visible: "Created by .*"
    timeout: 20000
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: "Fix ledger rounding"
      BESIDE: ${FLOATING_TABS}
- waitForAnimationToEnd
- swipe:
    from:
      text: "Fix ledger rounding"
    direction: LEFT
- waitForAnimationToEnd
- takeScreenshot: task-agent-swipe-resting
- tapOn: "Archive"
- assertVisible: "Archive agent?"
- takeScreenshot: task-agent-archive-ask
- runFlow:
    file: subflows/dismiss-ask.yaml
    env:
      QUESTION: "Archive agent?"
- assertVisible: "Fix ledger rounding"
# Confirmed, the archive is taken, as the fixture takes it, and the agent
# leaves Agents for Archived after them, folded under its header, as the
# panel's phone Overview folds archived agents. Opened, the fold shows its
# row, which opens the agent's page and offers Unarchive in Archive's place, which brings it back at once, asking
# nothing, and Archived goes with its last agent.
- swipe:
    from:
      text: "Fix ledger rounding"
    direction: LEFT
- waitForAnimationToEnd
- tapOn: "Archive"
- assertVisible: "Archive agent?"
- tapOn: "Archive agent"
- assertNotVisible: "Archive agent?"
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      ELEMENT: "Archived, 1"
      BESIDE: ${FLOATING_TABS}
- assertNotVisible: "Fix ledger rounding"
- tapOn:
    text: "Archived"
    childOf: "Archived, [0-9]+"
- assertVisible: "Fix ledger rounding"
- waitForAnimationToEnd
- takeScreenshot: task-agents-archived
# Its row opens its page, where the composer gives way to the panel's note
# that the agent is archived, with Unarchive beside it.
- tapOn: "Fix ledger rounding"
- extendedWaitUntil:
    visible: "This agent is archived"
    timeout: 20000
- assertVisible:
    text: "Unarchive"
    rightOf: "This agent is archived"
- waitForAnimationToEnd
- takeScreenshot: agent-archived
- tapOn:
    id: "BackButton"
- assertVisible: "Archived, 1"
- swipe:
    from:
      text: "Fix ledger rounding"
    direction: LEFT
- waitForAnimationToEnd
- takeScreenshot: task-agent-swipe-archived
- tapOn: "Unarchive"
- waitForAnimationToEnd
- assertNotVisible: "Archived, [0-9]+"
- assertVisible: "Fix ledger rounding"
