# tasks.yaml -- the Tasks tab's tree, a group folded, a task marked done by its menu and by its swipe, a row's long press preview and its leading swipe, its menu's Copy link share sheet, Rename alert, and Permanently delete question, an agent's preview and swipe, its unread mark and the read opening it takes, Mark done asking first while an agent works, a task's Overview with a page opened whole from it, its status changed from its ⋯, the ⋯'s acts, New sub-task, and its comment threads with a reply typed, the list in landscape, and its search.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
# Note that the window is turned back upright however the flow ends, because
# a run left in landscape fails every flow after it.
onFlowComplete:
  - setOrientation: PORTRAIT
---
# Launched on the host's Inbox fixture, as `inbox.yaml` is, so the tree holds
# the fixture's tasks, pinned, sectioned, and in two repositories, and no
# server is reached; the fixture takes each status set
# (`@repo/host/fixture-inbox`), which the list draws at once.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- assertVisible: "Pinned"
- assertVisible: "Weekly digest email"
- waitForAnimationToEnd
- takeScreenshot: tasks-list
# A group folds under its header, heard by its title and count (whether it is
# collapsed or expanded is its value, which Maestro does not match), and
# opens again.
- tapOn: "Launch, [0-9]+"
- assertNotVisible: "Launch checklist"
- tapOn: "Launch, [0-9]+"
- assertVisible: "Launch checklist"
# A long press offers Mark done in the row's menu, and a swipe from the
# trailing edge reveals it too; either way the row leaves the list once it
# is pressed.
# Note that a row may stand below the fold of a short window, the folded
# iPhone Duo's, so the list is scrolled to it.
- runFlow:
    file: subflows/row-menu.yaml
    env:
      ROW: Launch checklist
      ITEM: Mark done
- takeScreenshot: tasks-menu
- tapOn: "Mark done"
- assertNotVisible: "Launch checklist"
# Note that a swipe on a split view's sidebar reads as a tap under Maestro's
# driver, so a regular window, which stands "Select a task" beside its list,
# marks the task done from its menu instead.
- runFlow:
    when:
      notVisible: "Select a task"
    commands:
      - scrollUntilVisible:
          element: "Usage alerts"
          direction: DOWN
      - waitForAnimationToEnd
      - swipe:
          from: "Usage alerts"
          direction: LEFT
      - tapOn: "Mark done"
- runFlow:
    when:
      visible: "Select a task"
    commands:
      - runFlow:
          file: subflows/row-menu.yaml
          env:
            ROW: Usage alerts
            ITEM: Mark done
      - tapOn: "Mark done"
- assertNotVisible: "Usage alerts"
- takeScreenshot: tasks-marked-done
# A long press on a task lifts its preview, its Overview at a glance: its
# status, key and repository, its name, and its agents, the pinned Weekly
# digest email's at work. Under it stands the panel's row menu: Open, Mark
# done, Status, Unpin on a pinned task, Copy link, Rename, Mark as unread,
# Open in browser, and Permanently delete.
- scrollUntilVisible:
    element: "Weekly digest email"
    direction: UP
- waitForAnimationToEnd
# A swipe from the leading edge reveals Unpin, which a full swipe would
# press at once, so the flow swipes partway across the first row, under
# Pinned's header, and a tap on the row's own words closes it unpressed.
# Note that the row is closed before anything else is pressed, because a row
# left open takes the next press on the list, the long press below among
# them, only to close itself; and that a regular window, whose swipes read
# as taps, is left out.
- runFlow:
    when:
      notVisible: "Select a task"
    commands:
      - swipe:
          start: "8%, 21%"
          end: "38%, 21%"
          duration: 900
      - waitForAnimationToEnd
      - takeScreenshot: tasks-swipe-leading
      - tapOn: "Weekly digest email"
      - waitForAnimationToEnd
- runFlow:
    file: subflows/row-menu.yaml
    env:
      ROW: Weekly digest email
      ITEM: Open
- assertVisible: "Status"
- assertVisible: "Copy link"
- assertVisible: "Rename"
- assertVisible: "Mark as unread"
- assertVisible: "Unpin"
- assertVisible: "Open in browser"
- assertVisible: "Permanently delete"
- takeScreenshot: tasks-row-menu
# Rename asks for the name in the system's alert, opened on the task's name,
# and Cancel keeps it.
- tapOn: "Rename"
- assertVisible: "Rename task"
- waitForAnimationToEnd
- takeScreenshot: tasks-rename
- tapOn: "Cancel"
- waitForAnimationToEnd
# Permanently delete asks first, in the panel's words, and Cancel keeps the
# task.
- runFlow:
    file: subflows/row-menu.yaml
    env:
      ROW: Weekly digest email
      ITEM: Permanently delete
- tapOn: "Permanently delete"
- assertVisible: "Permanently delete task?"
- waitForAnimationToEnd
- takeScreenshot: tasks-delete-ask
- tapOn: "Cancel"
- waitForAnimationToEnd
- assertVisible: "Weekly digest email"
# Copy link raises the system's share sheet on the task's address, whose
# first row copies it; its close puts it away, which iOS 27.2 names
# "dismiss popup" where earlier releases said "Close".
- runFlow:
    file: subflows/row-menu.yaml
    env:
      ROW: Weekly digest email
      ITEM: Copy link
- tapOn: "Copy link"
- waitForAnimationToEnd
- takeScreenshot: tasks-copy-link
- tapOn: "Close|dismiss popup"
- waitForAnimationToEnd
- runFlow:
    file: subflows/row-menu.yaml
    env:
      ROW: Weekly digest email
      ITEM: Mark as unread
# Mark as unread draws the row's dot.
- tapOn: "Mark as unread"
- waitForAnimationToEnd
- takeScreenshot: tasks-row-unread
# Mark done on a task whose agent is at work asks first, as the panel does,
# and Cancel leaves the task where it stands.
- runFlow:
    file: subflows/row-menu.yaml
    env:
      ROW: Weekly digest email
      ITEM: Mark done
- tapOn: "Mark done"
- assertVisible: "Mark as Done?"
- assertVisible: "Stop agents"
- takeScreenshot: tasks-mark-done-ask
- tapOn: "Cancel"
- waitForAnimationToEnd
- assertVisible: "Weekly digest email"
# Opening the task reads it, so its dot is gone once the list shows again.
- tapOn: "Weekly digest email"
- assertVisible: "Created by .*"
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- takeScreenshot: tasks-row-read
# A task opens on its Overview: its path in the bar, its name, its chips, and
# who created it,
# its relations, its agents with their pull request, its pages, and its
# description.
- scrollUntilVisible:
    element: "Teammate invitations"
    direction: UP
- waitForAnimationToEnd
- tapOn: "Teammate invitations"
- assertVisible: "Created by .*"
- assertVisible: "Agents"
- waitForAnimationToEnd
- takeScreenshot: task-overview
# A long press on an agent lifts its preview: its tile and name, where it
# stands with its model and where it runs, its latest step where the app
# holds its transcript, and its pull request, over Open and Stop, which a
# swipe from its trailing edge reveals too while it works; once it rests the
# swipe offers Archive, which asks first. A tap off the preview closes it.
- runFlow:
    file: subflows/row-menu.yaml
    env:
      ROW: Build teammate invitations
      ITEM: Open
- takeScreenshot: task-agent-preview
# Note that the tap lands on the dimmed screen above the preview, which
# lifts low on the screen under the agent's row.
- runFlow:
    file: subflows/dismiss.yaml
    env:
      POINT: 50%, 30%
- runFlow:
    when:
      notVisible: "Select a task"
    commands:
      # Note that the swipe runs partway across the agent's row, where the
      # Overview opened at its top stands it, as the leading swipe above
      # does, because a swipe from the row's name either holds long enough
      # to lift its preview or runs far enough to press Open; a tap on the
      # page's plain line, inside the same list, then closes it.
      - swipe:
          start: "85%, 66%"
          end: "50%, 66%"
          duration: 900
      - waitForAnimationToEnd
      - takeScreenshot: task-agent-swipe
      - tapOn: "Created by .*"
      - waitForAnimationToEnd
- scrollUntilVisible:
    element: "Goal"
    direction: DOWN
- takeScreenshot: task-description
# A page in its Pages opens whole on the app's own page screen, its ⋯
# offering Open in browser, and back leads to the Overview. A tap off the
# menu closes it.
# Note that the wait is long, because the first web view a freshly booted
# simulator opens launches WebKit's processes, as `agent.yaml` says.
- scrollUntilVisible:
    element: "Invite funnel"
    direction: UP
- tapOn: "Invite funnel"
- extendedWaitUntil:
    visible: "Invites sent in the staging workspace.*"
    timeout: 90000
- takeScreenshot: task-page
- tapOn: "More"
- assertVisible: "Open in browser"
- takeScreenshot: task-page-menu
- runFlow:
    file: subflows/dismiss.yaml
- tapOn:
    id: "BackButton"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Goal"
    direction: DOWN
# Its ⋯ sets its status, which its chip says at once.
- tapOn: "More"
- tapOn: "Status"
- takeScreenshot: task-status-menu
- tapOn: "Todo"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Created by .*"
    direction: UP
- assertVisible: "Todo"
- takeScreenshot: task-status-set
# Its ⋯ holds the panel's acts: Copy link, Rename, New sub-task, Open in
# browser, and Permanently delete, red and last, which asks first.
- tapOn: "More"
- assertVisible: "Copy link"
- assertVisible: "New sub-task"
- assertVisible: "Permanently delete"
- takeScreenshot: task-more-menu
- tapOn: "Permanently delete"
- assertVisible: "Permanently delete task?"
- waitForAnimationToEnd
- takeScreenshot: task-delete-ask
- tapOn: "Cancel"
- waitForAnimationToEnd
# New sub-task under its Sub-tasks opens New task as a sub-task of it, its
# repository the task's own; Cancel on a sheet with nothing typed closes it.
- scrollUntilVisible:
    element: "New sub-task"
    direction: DOWN
- tapOn: "New sub-task"
- assertVisible: "Describe the task"
- assertVisible: "Relation, Sub-task of"
# Note that the keyboard is lowered by a short drag up the form, which
# lowers it on a drag (`SettingsForm`), since Maestro's hideKeyboard fails
# on this sheet when no keyboard stands, as with nothing typed.
- swipe:
    start: "50%, 50%"
    end: "50%, 40%"
    duration: 400
- waitForAnimationToEnd
- takeScreenshot: new-sub-task
- tapOn: "Cancel"
- waitForAnimationToEnd
# Its description's open comment threads stand under it; one opens with its
# comments and the reply field, a reply typed into it.
# Note that the scroll may take a minute, because the description's video
# plays on, holding each swipe ten seconds waiting for the page to settle.
- scrollUntilVisible:
    element: "Comments"
    direction: DOWN
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: task-comments
- tapOn: "Should an owner be able to resend.*"
- assertVisible: "Yes: Resend stands beside each expired invite.*"
- waitForAnimationToEnd
- takeScreenshot: task-comment-thread
- tapOn: "Reply"
- inputText: "Thanks, that covers it."
- waitForAnimationToEnd
- takeScreenshot: task-comment-reply
- tapOn: "Send"
- waitForAnimationToEnd
- tapOn:
    id: "BackButton"
- waitForAnimationToEnd
# Back on the list, a landscape window stands it as a split view: on an iPad
# the app sidebar, the list, and the task side by side.
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- assertVisible: "Pinned"
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd
- takeScreenshot: tasks-wide
- setOrientation: PORTRAIT
- waitForAnimationToEnd
# Last, the search, a round glass button in the bar, finds the workspace's
# tasks whatever their status, a done one among them, by every word typed. It
# comes last, since its keyboard stands over the rows. A compact window's
# search is the bar's round button, named as the Search tab is, so the one
# above the tab bar is pressed, which the two's order in the tree does not
# say once the window has turned; a split view's sidebar holds the field
# itself.
- runFlow:
    when:
      notVisible: "Search tasks"
    commands:
      - tapOn:
          text: "Search"
          above: "Tab Bar"
- tapOn: "Search tasks"
- inputText: "rounding"
- assertVisible: "Ledger rounding"
- assertNotVisible: "Weekly digest email"
- takeScreenshot: tasks-search
