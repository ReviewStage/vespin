# undo.yaml -- a notice settled with Got it, and a thread resolved, each said in the app's notice with Undo, which opens the thread again.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
---
# Launched on the host's Inbox fixture, as `answer.yaml` is, so no server is
# reached: the fixture takes each nod, resolve, and take-back as the service
# would (`@repo/host/fixture-inbox`). Each thread is opened from a fresh
# launch, so a compact window's pushed thread and a regular window's split
# view are reached the same way.

# Got it: a notice asking nothing offers it under the thread while the box is
# empty; its press settles the notice, says so with Undo, and Undo has it
# wait on the reader again, Got it offered anew.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- runFlow:
    file: subflows/open-row.yaml
    env:
      ROW: "acceptInvite can add a member twice"
- assertVisible: "Got it"
- waitForAnimationToEnd
- takeScreenshot: got-it
- tapOn: "Got it"
# Note that the notice is checked at once and pressed after only its shot,
# since it stands six seconds and a loaded runner has reached it after it
# went.
- extendedWaitUntil:
    visible: "Got it: “acceptInvite can add a member twice”"
    timeout: 5000
- takeScreenshot: got-it-undo
- tapOn:
    id: "failure-notice-undo"
# Note that the notice slides away first, so the chip is found by itself rather than by the notice's own "Got it: …".
- extendedWaitUntil:
    notVisible:
      id: "failure-notice-undo"
    timeout: 5000
- assertVisible: "Got it"
- waitForAnimationToEnd
- takeScreenshot: got-it-undone

# Resolve, from the thread's ⋯ menu or a wide window's bar: the thread
# settles, says so with Undo, and Undo opens it again, Resolve offered anew.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- runFlow:
    file: subflows/open-row.yaml
    env:
      ROW: "What the expired invite page says"
- waitForAnimationToEnd
- runFlow:
    file: subflows/thread-act.yaml
    env:
      ACT: Resolve
- tapOn: "Resolve"
- extendedWaitUntil:
    visible: "Resolved “What the expired invite page says”"
    timeout: 5000
- takeScreenshot: resolve-undo
- tapOn:
    id: "failure-notice-undo"
- extendedWaitUntil:
    notVisible:
      id: "failure-notice-undo"
    timeout: 5000
# Note that Resolve is checked as pressable, since a regular window's bar
# keeps it standing, dimmed, once the thread is settled.
- runFlow:
    file: subflows/thread-act.yaml
    env:
      ACT: Resolve
- assertVisible:
    text: "Resolve"
    enabled: true
- takeScreenshot: resolve-undone
