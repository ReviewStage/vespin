# settings.yaml -- Settings on the Inbox fixture: its list, grouped Workspace then Account, Notifications' page with the phone registered, its pushes working and its "Notify me" picked, About, the Account page with Delete account's question, the Workspace page with its members and invitation, and the Agents page.
#
# Launched on the host's Inbox fixture with notifications allowed, so the
# phone names itself by the fixture's synthetic token, which the fixture
# registers and answers working, its last push a few minutes old
# (`@repo/host/fixture-inbox`), and no server or APNs is reached. The
# fixture is signed in as Ada Lovelace.
appId: dev.vespin.ios
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
    arguments:
      fixture: inbox
- assertVisible: "Recorded the invite flow"
# The workspace switcher leads the Inbox's bar, and its menu's account,
# heard as its name and Settings, opens it.
- tapOn:
    id: "workspace-switcher"
- tapOn: ".*, Settings"
- waitForAnimationToEnd
# The account heads the list, pushing to Account.
- assertVisible: "Ada Lovelace"
- takeScreenshot: settings
# Notifications is one row reading the phone's "Notify me" choice, pushing
# to its own page, as iOS's own Settings keeps an app's.
- scrollUntilVisible:
    element:
      id: "settings-notifications"
# Note that the row's value is checked on the row itself, its words standing
# apart from its name in the tree.
- assertVisible:
    id: "settings-notifications"
    text: "When I'm away"
- tapOn:
    id: "settings-notifications"
- waitForAnimationToEnd
# Note that a row's name and value stand apart in the tree Maestro reads,
# the name as the row's label and the value as its text, so each is found
# on its own.
- assertVisible: "Status"
- assertVisible: "Working"
- assertVisible: "Open iOS notification settings"
- takeScreenshot: settings-notifications
# A choice is drawn at once, as the fixture takes it.
- tapOn: "Always"
- waitForAnimationToEnd
- takeScreenshot: settings-notify-always
- tapOn:
    id: "BackButton"
- waitForAnimationToEnd
- assertVisible:
    id: "settings-notifications"
    text: "Always"
# About, and the pages still kept on vespin.dev under it.
- scrollUntilVisible:
    element: "Send feedback"
- assertVisible: "What's new"
- waitForAnimationToEnd
- takeScreenshot: settings-about
- scrollUntilVisible:
    element: "Experimental"
- waitForAnimationToEnd
- takeScreenshot: settings-more-on-web
# The Account page: who is signed in, Privacy, Sign out, and Delete account.
# Note that the personal workspace's row below it bears the same name, so the
# account is found by the line only it draws.
- scrollUntilVisible:
    element: "Signed in with GitHub"
    direction: UP
- tapOn: "Signed in with GitHub"
- waitForAnimationToEnd
- assertVisible: "Share usage data"
- assertVisible: "Sign out"
- takeScreenshot: settings-account
# Delete account asks first, its act dimmed until the account's address is typed.
- tapOn: "Delete account"
- waitForAnimationToEnd
- assertVisible: "Delete the account ada@example.com?"
- takeScreenshot: settings-delete-account
- tapOn: "Cancel"
- waitForAnimationToEnd
- assertVisible: "Share usage data"
# The Workspace page, from a fresh launch: the workspace's name, its
# members with their roles and the reader's own badge, and its pending
# invitation, which the fixture stages (`@repo/host/fixture-inbox`).
- launchApp:
    stopApp: true
    arguments:
      fixture: inbox
- assertVisible: "Recorded the invite flow"
- tapOn:
    id: "workspace-switcher"
- tapOn: ".*, Settings"
- waitForAnimationToEnd
- tapOn:
    id: "settings-workspace"
- waitForAnimationToEnd
- assertVisible: "Grace Hopper"
- assertVisible: "Alan Turing"
- takeScreenshot: settings-workspace
- scrollUntilVisible:
    element: "katherine@example.com"
- waitForAnimationToEnd
- takeScreenshot: settings-workspace-invitations
# Inviting asks for the address in the system's alert, its acts naming the role.
- tapOn: "Invite"
- waitForAnimationToEnd
- assertVisible: "Invite as member"
- takeScreenshot: settings-workspace-invite
- tapOn: "Cancel"
- waitForAnimationToEnd
# The Agents page, from a fresh launch: the default model and effort, then
# default permissions, follow-up behavior, and the commit author.
- launchApp:
    stopApp: true
    arguments:
      fixture: inbox
- assertVisible: "Recorded the invite flow"
- tapOn:
    id: "workspace-switcher"
- tapOn: ".*, Settings"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Agents"
- tapOn: "Agents"
- waitForAnimationToEnd
- assertVisible: "Default permissions"
- takeScreenshot: settings-agents
- scrollUntilVisible:
    element: "Commit author"
- waitForAnimationToEnd
- takeScreenshot: settings-agents-more
