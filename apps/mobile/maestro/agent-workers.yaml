# agent-workers.yaml -- BEFORE: main's drawing of the worker agent's delegations, each a generic call row, for the before shots of #11266. Throwaway: this branch is main plus the fixture alone.
appId: dev.vespin.ios
onFlowComplete:
  - setOrientation: PORTRAIT
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
---
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
      agent: e3b7a9d1-58c2-4f06-b1d4-6a9c2e7f3b18
- runFlow:
    when:
      true: ${FLOATING_TABS == 'true'}
    commands:
      - setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible: "I'll split the audit between workers.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-workers
- tapOn:
    text: ".*Find the export's callers.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-workers-native-open
- tapOn:
    text: ".*Find the export's callers.*"
    optional: true
# On main a delegation's row only opens on its call's body; nothing opens the worker.
- tapOn:
    text: ".*Check that the export's tests cover half-cent totals.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: agent-worker-opened
