# new-agent.yaml -- New agent on a task: its page opened from the task page, the words typed, the model picked in the sheet its capsule under the composer's field opens, and the agent started, its page opened.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
---
# Launched on the host's Inbox fixture, as `tasks.yaml` is, whose models are
# staged and whose Start is answered with a new agent starting
# (`@repo/host/fixture-inbox`), so nothing reaches a server.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- scrollUntilVisible:
    element: "Teammate invitations"
    direction: DOWN
- tapOn: "Teammate invitations"
# Note that the page is waited for before the scroll, since a scroll that
# finds nothing yet swipes, and that swipe flung the page past its Agents.
- assertVisible: "Created by .*"
- scrollUntilVisible:
    element: "New agent"
    direction: DOWN
- tapOn: "New agent"
- assertVisible: "Ask to make changes"
- assertVisible: "Opus 5.5.*"
- waitForAnimationToEnd
- takeScreenshot: new-agent-sheet
- inputText: "Add a Resend button beside each pending invite."
# The keyboard is lowered by a drag on the page over the composer (`StartPage`).
- runFlow:
    file: subflows/lower-keyboard.yaml
# The model's capsule says the model and its effort, "Opus 5.5 · High", the
# fixture's first model, and opens the model sheet: Effort and Fast lead it,
# then the catalog, each model once under its harness, by the panel's name
# for it ("Sonnet 5.5"); a pick keeps the effort it lists nearest the one
# shown, and Done closes the sheet.
- tapOn: "Opus 5.5.*"
- assertVisible: "Effort"
- assertVisible: ".*Sonnet 5.5"
- waitForAnimationToEnd
- takeScreenshot: new-agent-models
- tapOn: ".*Sonnet 5.5"
- waitForAnimationToEnd
- tapOn: "Done"
- assertVisible: "Sonnet 5.5.*"
- waitForAnimationToEnd
- takeScreenshot: new-agent-picked
- tapOn: "Send"
- extendedWaitUntil:
    notVisible: "Ask to make changes"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: new-agent-started
