# new-agent.yaml -- New agent on a task: its page opened from the task page, the words typed, the model picked in the sheet its capsule under the composer's field opens, and the agent started, its page opened.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
---
# Launched on the host's Inbox fixture, as `tasks.yaml` is, whose models are
# staged and whose Start is answered with a new agent starting
# (`@repo/host/fixture-inbox`), so nothing reaches a server.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: Tasks
- scrollUntilVisible:
    element: "Teammate invitations"
    direction: DOWN
- tapOn: "Teammate invitations"
# Note that the page is waited for before the scroll, since a scroll that
# finds nothing yet swipes, and that swipe flung the page past its Agents.
- assertVisible: "Created by .*"
- scrollUntilVisible:
    element: "New agent"
    direction: DOWN
- tapOn: "New agent"
- assertVisible: "Ask to make changes"
- assertVisible: "Opus 5.5.*"
- waitForAnimationToEnd
- takeScreenshot: new-agent-sheet
- inputText: "Add a Resend button beside each pending invite."
# The keyboard is lowered by a drag on the page over the composer
# (`StartPage`). Note that the drag is made a quarter of the way down the
# window rather than at its middle, where `lower-keyboard.yaml` drags,
# because the composer, docked on the keyboard with its row of capsules
# under its field, now reaches the window's middle on the iPhone, and a drag
# on it left the keyboard up; the model sheet then opened over the keyboard
# and stood outside the tree Maestro reads, so nothing in it was found.
- swipe:
    start: "50%, 25%"
    end: "50%, 15%"
    duration: 400
- waitForAnimationToEnd
# The model's capsule says the model alone, "Opus 5.5", the fixture's first
# model, its effort left to the sheet, and opens the model sheet: Effort and Fast lead it,
# then the catalog, each model once under its harness, by the panel's name
# for it ("Sonnet 5.5"); a pick keeps the effort it lists nearest the one
# shown. Done closes the sheet; a regular window presents it as a popover
# from the capsule, with no Done, which a tap off it closes.
- tapOn: "Opus 5.5.*"
- assertVisible: "Effort"
- assertVisible: ".*Sonnet 5.5"
- waitForAnimationToEnd
- takeScreenshot: new-agent-models
- tapOn: ".*Sonnet 5.5"
- waitForAnimationToEnd
# Note that the popover's tap off comes first, so it never follows the sheet's Done and lands on the page behind.
- runFlow:
    when:
      notVisible: "Done"
    file: subflows/dismiss.yaml
    env:
      POINT: "25%, 30%"
- runFlow:
    when:
      visible: "Done"
    commands:
      - tapOn: "Done"
- assertVisible: "Sonnet 5.5.*"
- waitForAnimationToEnd
- takeScreenshot: new-agent-picked
- tapOn: "Send"
- extendedWaitUntil:
    notVisible: "Ask to make changes"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: new-agent-started
