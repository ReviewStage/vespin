# new-agent.yaml -- New agent on a task: its compose sheet opened from the task's Agents, the words typed, the model picked from its capsule over the keyboard, and the agent started, its page opened.
#
# The screenshots land under the run's --test-output-dir (`takeScreenshot/`),
# which `scripts/simulator-screenshots.sh` names per device and appearance.
appId: dev.vespin.ios
---
# Launched on the host's Inbox fixture, as `tasks.yaml` is, whose models are
# staged and whose Start is answered with a new agent starting
# (`@repo/host/fixture-inbox`), so nothing reaches a server.
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- tapOn: "Tasks"
- scrollUntilVisible:
    element: "Teammate invitations"
    direction: DOWN
- tapOn: "Teammate invitations"
- scrollUntilVisible:
    element: "New agent"
    direction: DOWN
- tapOn: "New agent"
- assertVisible: "Ask to make changes"
- assertVisible: "Opus 5.5.*"
- waitForAnimationToEnd
- takeScreenshot: new-agent-sheet
- inputText: "Add a Resend button beside each pending invite."
# Note that iOS's hideKeyboard is a short drag at the screen's middle, which
# lowers the keyboard because the sheet's page lowers it on a drag
# (`ComposeSheet`); the words field's return key types a new line.
- hideKeyboard
# The model's capsule says the model and its effort, "Opus 5.5 · High", the
# fixture's first model; its menu offers the catalog, each model once, by the
# panel's name for it ("Sonnet 5.5"), then the model's efforts; a pick keeps
# the effort it lists nearest the one shown.
- tapOn: "Opus 5.5.*"
- assertVisible: ".*Sonnet 5.5"
- waitForAnimationToEnd
- takeScreenshot: new-agent-models
- tapOn: ".*Sonnet 5.5"
- assertVisible: "Sonnet 5.5.*"
- waitForAnimationToEnd
- takeScreenshot: new-agent-picked
- tapOn: "Start"
- extendedWaitUntil:
    notVisible: "Ask to make changes"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: new-agent-started
