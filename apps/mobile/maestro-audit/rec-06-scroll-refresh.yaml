# rec-06-scroll-refresh.yaml -- pull to refresh on the Inbox and Tasks, then each list scrolled down and back: the large title folding into the bar, and the tab bar minimizing.
appId: dev.vespin.ios
env:
  FLOATING_TABS: ${FLOATING_TABS || 'false'}
onFlowComplete:
  - setOrientation: PORTRAIT
---
- launchApp:
    clearState: true
    arguments:
      fixture: inbox
- extendedWaitUntil:
    visible: "Recorded the invite flow"
    timeout: 30000
- waitForAnimationToEnd
- startRecording: rec-06-scroll-refresh
- swipe:
    start: "50%, 30%"
    end: "50%, 75%"
    duration: 1200
    optional: true
- waitForAnimationToEnd
- takeScreenshot: a06-inbox-refresh
- swipe:
    start: "50%, 80%"
    end: "50%, 25%"
    duration: 900
    optional: true
- waitForAnimationToEnd
- takeScreenshot: a06-inbox-scrolled
- swipe:
    start: "50%, 30%"
    end: "50%, 85%"
    duration: 900
    optional: true
- waitForAnimationToEnd
- runFlow:
    file: ../maestro/subflows/tab.yaml
    env:
      TAB: Tasks
- swipe:
    start: "50%, 30%"
    end: "50%, 75%"
    duration: 1200
    optional: true
- waitForAnimationToEnd
- swipe:
    start: "50%, 80%"
    end: "50%, 25%"
    duration: 900
    optional: true
- waitForAnimationToEnd
- takeScreenshot: a06-tasks-scrolled
- swipe:
    start: "50%, 30%"
    end: "50%, 85%"
    duration: 900
    optional: true
- waitForAnimationToEnd
- stopRecording
