<!doctype html>
<html lang="en" data-ui-profile="web" data-ui-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0d0b" />
    <meta name="color-scheme" content="dark" />
    <title>Sign in to Vespin</title>

    <meta
      name="description"
      content="Vespin is an inbox for all your coding agents."
    />

    <!-- What an unfurler shows for a pasted sign-in link: the site's card, the
         tag set documented in index.html, under this page's own title, and
         no og:url, as app.html leaves it out, so a link that carries where
         to return after signing in keeps it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vespin" />
    <meta property="og:title" content="Sign in to Vespin" />
    <meta
      property="og:description"
      content="Vespin is an inbox for all your coding agents."
    />
    <meta property="og:image" content="https://vespin.dev/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="The Vespin logo — a disc cut by a V, beside the name — on a near-black ground."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sign in to Vespin" />
    <meta
      name="twitter:description"
      content="Vespin is an inbox for all your coding agents."
    />
    <meta name="twitter:image" content="https://vespin.dev/og-card.png" />
    <meta
      name="twitter:image:alt"
      content="The Vespin logo — a disc cut by a V, beside the name — on a near-black ground."
    />

    <!-- Vespin's app icon, the same icons the landing page carries — the tag set
         is documented there, in index.html. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/sign-in.tsx"></script>
  </body>
</html>
